# Linhagem de dados da conversão NEWAVE → Novomodelo.
#
# Fonte única de docs/newave-data-map.md (gerado por scripts/gen-lineage-docs.py;
# nunca edite a página). Um [[output]] por arquivo escrito, um [[output.field]] por
# campo ou coluna, e [[source]] para o que o deck traz e o conversor ainda não lê ou
# não converte. Chaves em inglês; prosa em pt-BR. Validado por tests/test_lineage.py.
track = "newave"

# ===== frag_A_nw_root_network =====
# Fragmento A — NEWAVE: raiz do caso (config, stages, penalties, initial_conditions),
# rede (buses, lines, non_controllable_sources), térmicas, parâmetros escalares e
# as tabelas parquet de limites de intercâmbio, limites térmicos e sobrescritas de
# penalidade. A chave `track` é escrita pelo montador.

# =============================================================================
# config.json
# =============================================================================
[[output]]
path = "config.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/newave/converters/temporal.py"
reads = [
  { file = "dger" },
  { file = "shist" },
]
summary = "Parâmetros de treinamento e simulação do Novomodelo derivados dos flags de `dger.dat`; `shist.dat` entra somente no modo determinístico e na simulação histórica."

  [[output.field]]
  path = "estimation.max_order"
  from = [ { file = "dger", item = "ordem_maxima_parp" } ]
  how = "Valor direto (6 quando ausente). No modo determinístico (`num_forwards` = 1, `num_aberturas` = 1, `tipo_simulacao_final` = 2 e `shist.dat` com `varredura` = 0 e um único ano) é forçado a 0 para não carregar estado de defasagem de afluência."

  [[output.field]]
  path = "estimation.order_selection"
  from = [ { file = "dger", item = "consideracao_media_anual_afluencias" } ]
  how = "0 → `pacf`; 1, 2 ou 3 → `pacf_annual` (o Novomodelo implementa a variante exata de 12 eixos, opção 3). Campo omitido quando o flag está ausente; no modo determinístico é `pacf`."

  [[output.field]]
  path = "exports.states"
  from = [ { file = "dger", item = "impressao_estados_geracao_cortes" } ]
  how = "`true` quando o flag vale 0 (NEWAVE grava os estados visitados na geração de cortes); qualquer outro valor mantém `false`."

  [[output.field]]
  path = "exports.stochastic"
  from = []
  status = "constant"
  how = "Sempre `true`: a exportação do modelo estocástico é ligada para permitir a comparação das estatísticas de afluência."

  [[output.field]]
  path = "modeling.inflow_non_negativity.method"
  from = []
  status = "constant"
  how = "Sempre `truncation_with_penalty`: a afluência incremental negativa é truncada e a folga penalizada por `hydro.inflow_nonnegativity_cost`."

  [[output.field]]
  path = "simulation.enabled"
  from = [
    { file = "dger", item = "tipo_execucao" },
    { file = "dger", item = "tipo_simulacao_final" },
  ]
  how = "`true` quando `tipo_execucao` = 0 (somente simulação); caso contrário `true` se `tipo_simulacao_final` ≠ 0."

  [[output.field]]
  path = "simulation.selection.method"
  from = []
  status = "constant"
  how = "Sempre `sampled`."

  [[output.field]]
  path = "simulation.selection.num_scenarios"
  from = [
    { file = "dger", item = "num_series_sinteticas" },
    { file = "shist", item = "anos_inicio_simulacoes" },
    { file = "shist", item = "ano_inicio_varredura" },
  ]
  how = "`num_series_sinteticas` (200 quando ausente). Na simulação histórica (`tipo_simulacao_final` = 2) é substituído pelo número de anos iniciais do `shist.dat`, pois cada cenário histórico é um ano de partida."

  [[output.field]]
  path = "simulation.scenario_source.seed"
  from = []
  status = "constant"
  when = "somente quando a simulação está habilitada"
  how = "Sempre 42; o NEWAVE não expõe semente equivalente."

  [[output.field]]
  path = "simulation.scenario_source.inflow.scheme"
  from = [
    { file = "dger", item = "tipo_simulacao_final" },
    { file = "dger", item = "considera_reamostragem_cenarios" },
  ]
  when = "somente quando a simulação está habilitada"
  how = "`tipo_simulacao_final` = 2 → `historical`; senão `considera_reamostragem_cenarios` = 1 → `out_of_sample`, caso contrário `in_sample`."

  [[output.field]]
  path = "simulation.scenario_source.historical_years"
  from = [
    { file = "shist", item = "varredura" },
    { file = "shist", item = "anos_inicio_simulacoes" },
    { file = "shist", item = "ano_inicio_varredura" },
    { file = "dger", item = "ano_inicial_historico" },
    { file = "dger", item = "ano_inicio_estudo" },
  ]
  when = "somente quando `tipo_simulacao_final` = 2 (simulação histórica)"
  how = "`varredura` = 0 → lista explícita de `anos_inicio_simulacoes`; `varredura` = 1 → intervalo de `ano_inicio_varredura` até `ano_inicio_estudo` − (anos de estudo + pós-estudo). Sem `shist.dat`: intervalo de `ano_inicial_historico` + 1 até `ano_inicio_estudo` − 1."

  [[output.field]]
  path = "training.selection.method"
  from = []
  status = "constant"
  how = "Sempre `sampled`."

  [[output.field]]
  path = "training.selection.forward_passes"
  from = [ { file = "dger", item = "num_forwards" } ]
  how = "Valor direto (1 quando ausente)."

  [[output.field]]
  path = "training.stopping_rules[].type"
  from = []
  status = "constant"
  how = "Sempre `iteration_limit`, única regra de parada emitida; o NEWAVE não tem critério de gap equivalente exposto aqui."

  [[output.field]]
  path = "training.stopping_rules[].limit"
  from = [ { file = "dger", item = "num_max_iteracoes" } ]
  how = "Valor direto (200 quando ausente)."

  [[output.field]]
  path = "training.cut_selection.row_activity_tolerance"
  from = []
  status = "constant"
  how = "Sempre 1e-6."

  [[output.field]]
  path = "training.cut_selection.selection.method"
  from = []
  status = "constant"
  when = "somente quando `selecao_de_cortes_forward` = 1 ou `selecao_de_cortes_backward` = 1"
  how = "Sempre `lml1` (seleção Level-1 de memória limitada). O Novomodelo tem um único interruptor para os dois passos; a união dos flags do NEWAVE o liga."

  [[output.field]]
  path = "training.cut_selection.selection.check_frequency"
  from = []
  status = "constant"
  when = "somente quando `selecao_de_cortes_forward` = 1 ou `selecao_de_cortes_backward` = 1"
  how = "Sempre 1. A janela de memória do NEWAVE não tem equivalente no `lml1` baseado em valor e é descartada."

  [[output.field]]
  path = "training.parallelism.backward_scheduler.method"
  from = []
  status = "constant"
  how = "Sempre `by_node`: cada unidade de trabalho do backward é um par (ponto de tentativa, bloco de aberturas)."

  [[output.field]]
  path = "training.parallelism.backward_scheduler.block_size"
  from = [ { file = "dger", item = "num_aberturas" } ]
  status = "derived"
  how = "`ceil(num_aberturas / 2)`; coincide com o padrão do Novomodelo, mas é fixado a partir do deck."

  [[output.field]]
  path = "training.scenario_source.seed"
  from = []
  status = "constant"
  when = "somente quando `tipo_execucao` = 1 e (`considera_reamostragem_cenarios` = 1 ou modo determinístico)"
  how = "Sempre 42."

  [[output.field]]
  path = "training.scenario_source.inflow.scheme"
  from = [
    { file = "dger", item = "considera_reamostragem_cenarios" },
    { file = "dger", item = "num_forwards" },
    { file = "dger", item = "num_aberturas" },
    { file = "dger", item = "tipo_simulacao_final" },
    { file = "shist", item = "varredura" },
    { file = "shist", item = "anos_inicio_simulacoes" },
  ]
  when = "somente quando `tipo_execucao` = 1 e (`considera_reamostragem_cenarios` = 1 ou modo determinístico)"
  how = "`out_of_sample` quando `considera_reamostragem_cenarios` = 1; `historical` no modo determinístico (treinamento reutiliza o único ano histórico da simulação)."

  [[output.field]]
  path = "training.scenario_source.historical_years"
  from = [
    { file = "shist", item = "varredura" },
    { file = "shist", item = "anos_inicio_simulacoes" },
    { file = "shist", item = "ano_inicio_varredura" },
    { file = "dger", item = "ano_inicial_historico" },
  ]
  when = "somente no modo determinístico"
  how = "Mesma resolução de `simulation.scenario_source.historical_years`; no modo determinístico resulta na lista de um único ano de `anos_inicio_simulacoes`."

  [[output.field]]
  path = "training.enabled"
  from = [ { file = "dger", item = "tipo_execucao" } ]
  when = "somente quando `tipo_execucao` = 0 (somente simulação)"
  how = "Escrito como `false` apenas nesse caso; omitido (padrão `true`) quando `tipo_execucao` = 1."

# =============================================================================
# stages.json
# =============================================================================
[[output]]
path = "stages.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/newave/converters/temporal.py"
reads = [
  { file = "dger" },
  { file = "patamar" },
  { file = "cvar" },
  { file = "shist" },
]
summary = "Um estágio mensal por mês de estudo e de pós-estudo, com blocos (patamares) de `patamar.dat` e medida de risco de `dger.dat`/`cvar.dat`."

  [[output.field]]
  path = "season_definitions.cycle_type"
  from = []
  status = "constant"
  how = "Sempre `monthly`: doze estações calendário."

  [[output.field]]
  path = "season_definitions.seasons[].id"
  from = []
  status = "constant"
  how = "0 a 11 (janeiro = 0)."

  [[output.field]]
  path = "season_definitions.seasons[].month_start"
  from = []
  status = "constant"
  how = "1 a 12, o mês calendário de cada estação."

  [[output.field]]
  path = "season_definitions.seasons[].label"
  from = []
  status = "constant"
  how = "Nome do mês em inglês (`January` … `December`)."

  [[output.field]]
  path = "policy_graph.type"
  from = []
  status = "constant"
  how = "Sempre `finite_horizon`."

  [[output.field]]
  path = "policy_graph.annual_discount_rate"
  from = [ { file = "dger", item = "taxa_de_desconto" } ]
  how = "Taxa anual em percentual dividida por 100 (0.0 quando ausente)."

  [[output.field]]
  path = "policy_graph.transitions[].source_id"
  from = [
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "num_anos_estudo" },
    { file = "dger", item = "num_anos_pos_estudo" },
  ]
  status = "derived"
  how = "Uma transição por par de estágios consecutivos (0→1, 1→2, …) até o último estágio do pós-estudo."

  [[output.field]]
  path = "policy_graph.transitions[].target_id"
  from = [
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "num_anos_estudo" },
    { file = "dger", item = "num_anos_pos_estudo" },
  ]
  status = "derived"
  how = "`source_id` + 1."

  [[output.field]]
  path = "policy_graph.transitions[].probability"
  from = []
  status = "constant"
  how = "Sempre 1.0: cadeia linear de estágios."

  [[output.field]]
  path = "stages[].id"
  from = [
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
    { file = "dger", item = "num_anos_estudo" },
    { file = "dger", item = "num_anos_pos_estudo" },
  ]
  status = "derived"
  how = "0-based, um por mês: o estudo vai de `mes_inicio_estudo` a dezembro de `ano_inicio_estudo` + `num_anos_estudo` − 1, seguido de `num_anos_pos_estudo` anos completos."

  [[output.field]]
  path = "stages[].start_date"
  from = [
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
  ]
  status = "derived"
  how = "Primeiro dia do mês do estágio (ISO)."

  [[output.field]]
  path = "stages[].end_date"
  from = [
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
  ]
  status = "derived"
  how = "Primeiro dia do mês seguinte (fim exclusivo)."

  [[output.field]]
  path = "stages[].season_id"
  from = [ { file = "dger", item = "mes_inicio_estudo" } ]
  status = "derived"
  how = "Mês calendário do estágio − 1."

  [[output.field]]
  path = "stages[].blocks[].id"
  from = [ { file = "patamar", item = "numero_patamares" } ]
  status = "derived"
  how = "Índice do patamar − 1, para cada um dos `numero_patamares` patamares."

  [[output.field]]
  path = "stages[].blocks[].name"
  from = [ { file = "patamar", item = "numero_patamares" } ]
  status = "derived"
  how = "Nome canônico por quantidade de patamares: 1 → `SINGLE`; 2 → `HEAVY`, `LIGHT`; 3 → `HEAVY`, `MEDIUM`, `LIGHT`; outras → `BLOCK_i`."

  [[output.field]]
  path = "stages[].blocks[].hours"
  from = [ { file = "patamar", item = "duracao_mensal_patamares · valor" } ]
  how = "Fração de duração do patamar no (ano, mês) do estágio multiplicada pelas horas do mês calendário. Ano ausente usa o último ano do arquivo no mesmo mês; sem registro, fração igual 1/N com aviso."

  [[output.field]]
  path = "stages[].num_openings"
  from = [ { file = "dger", item = "num_aberturas" } ]
  how = "Valor direto (1 quando ausente), igual em todos os estágios."

  [[output.field]]
  path = "stages[].risk_measure"
  from = [
    { file = "dger", item = "cvar" },
    { file = "cvar", item = "valores_constantes" },
  ]
  how = "`expectation` quando `cvar` = 0, quando `cvar.dat` está ausente ou no modo determinístico. Com `cvar` = 1 ou 2 e `cvar.dat` presente, vira o objeto `cvar` documentado nos campos `risk_measure.cvar.*`."

  [[output.field]]
  path = "stages[].risk_measure.cvar.alpha"
  from = [
    { file = "dger", item = "cvar" },
    { file = "cvar", item = "valores_constantes" },
    { file = "cvar", item = "alfa_variavel · valor" },
  ]
  when = "somente quando `cvar` = 1 ou 2 em `dger.dat` e `cvar.dat` está presente, fora do modo determinístico"
  how = "`cvar` = 1: primeiro valor de `valores_constantes` / 100 em todos os estágios. `cvar` = 2: `alfa_variavel` do (ano, mês) do estágio / 100; valor 0 ou mês ausente recai no constante."

  [[output.field]]
  path = "stages[].risk_measure.cvar.lambda"
  from = [
    { file = "dger", item = "cvar" },
    { file = "cvar", item = "valores_constantes" },
    { file = "cvar", item = "lambda_variavel · valor" },
  ]
  when = "somente quando `cvar` = 1 ou 2 em `dger.dat` e `cvar.dat` está presente, fora do modo determinístico"
  how = "`cvar` = 1: segundo valor de `valores_constantes` / 100. `cvar` = 2: `lambda_variavel` do (ano, mês) / 100, com o mesmo recuo ao constante."

  [[output.field]]
  path = "stages[].state_variables.storage"
  from = []
  status = "constant"
  how = "Sempre `true`: o armazenamento é variável de estado em todo estágio."

  [[output.field]]
  path = "stages[].state_variables.inflow_lags"
  from = [
    { file = "dger", item = "num_forwards" },
    { file = "dger", item = "num_aberturas" },
    { file = "dger", item = "tipo_simulacao_final" },
    { file = "shist", item = "varredura" },
    { file = "shist", item = "anos_inicio_simulacoes" },
  ]
  how = "`true`, exceto no modo determinístico, em que as defasagens de afluência não acrescentam informação e são desligadas."

  [[output.field]]
  path = "stages[].sampling_method"
  from = [
    { file = "dger", item = "num_forwards" },
    { file = "dger", item = "num_aberturas" },
    { file = "dger", item = "tipo_simulacao_final" },
    { file = "shist", item = "varredura" },
    { file = "shist", item = "anos_inicio_simulacoes" },
  ]
  when = "somente no modo determinístico"
  how = "`historical_residuals`: cada estágio amostra o resíduo diretamente do único cenário histórico."

  [[output.field]]
  path = "pre_study_stages[].id"
  from = [ { file = "dger", item = "num_anos_pre_estudo" } ]
  status = "derived"
  when = "somente quando `num_anos_pre_estudo` > 0"
  how = "Ids negativos −N … −1 para os N = 12 × `num_anos_pre_estudo` meses anteriores ao início do estudo."

  [[output.field]]
  path = "pre_study_stages[].start_date"
  from = [
    { file = "dger", item = "num_anos_pre_estudo" },
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
  ]
  status = "derived"
  when = "somente quando `num_anos_pre_estudo` > 0"
  how = "Primeiro dia de cada mês pré-estudo, andando para trás a partir do início do estudo."

  [[output.field]]
  path = "pre_study_stages[].end_date"
  from = [
    { file = "dger", item = "num_anos_pre_estudo" },
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
  ]
  status = "derived"
  when = "somente quando `num_anos_pre_estudo` > 0"
  how = "Primeiro dia do mês seguinte (fim exclusivo)."

  [[output.field]]
  path = "pre_study_stages[].season_id"
  from = [ { file = "dger", item = "num_anos_pre_estudo" } ]
  status = "derived"
  when = "somente quando `num_anos_pre_estudo` > 0"
  how = "Mês calendário − 1."

# =============================================================================
# penalties.json
# =============================================================================
[[output]]
path = "penalties.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/newave/converters/network.py"
reads = [
  { file = "sistema" },
  { file = "penalid" },
  { file = "hidr" },
  { file = "confhd" },
  { file = "modif" },
  { file = "exph" },
]
summary = "Penalidades globais: custo de déficit de `sistema.dat`, micropenalidades internas do NEWAVE (manual v30, §3.24) e penalidades de `penalid.dat` convertidas de R$/MWh para o domínio de vazão com as produtibilidades do SIN."

  [[output.field]]
  path = "bus.deficit_segments[].cost"
  from = [ { file = "sistema", item = "custo_deficit · custo" } ]
  how = "Custo do primeiro patamar de déficit do submercado de menor código, em R$/MWh, sem conversão. Um único segmento sem profundidade."

  [[output.field]]
  path = "bus.deficit_segments[].depth_mw"
  from = []
  status = "null"
  how = "Sempre nulo: o segmento global é ilimitado; as profundidades por patamar ficam em `system/buses.json`."

  [[output.field]]
  path = "bus.excess_cost"
  from = []
  status = "constant"
  how = "Sempre 0.000355 R$/MWh (pEXC, excesso de energia). Domínio de energia, sem fator de produtibilidade."

  [[output.field]]
  path = "line.exchange_cost"
  from = []
  status = "constant"
  how = "Sempre 0.000273 R$/MWh (pINT, intercâmbio). Sem fator de produtibilidade."

  [[output.field]]
  path = "non_controllable_source.curtailment_cost"
  from = []
  status = "constant"
  how = "Sempre 0.000344 R$/MWh (pCORTEOL, corte de geração não simulada). Sem fator de produtibilidade."

  [[output.field]]
  path = "hydro.spillage_cost"
  from = [
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
    { file = "hidr", item = "cadastro · volume_minimo" },
    { file = "hidr", item = "cadastro · volume_maximo" },
    { file = "hidr", item = "cadastro · canal_fuga_medio" },
  ]
  how = "0.000300 (pEVERT, coluna NEWAVE individualizado) × PROD_MEDIA_SIN, a média da produtibilidade equivalente volume mínimo→máximo (PRODT) sobre as usinas ativas, zeros incluídos. Resultado em R$/(m³/s·h)."

  [[output.field]]
  path = "hydro.turbined_cost"
  from = [
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
    { file = "hidr", item = "cadastro · volume_minimo" },
    { file = "hidr", item = "cadastro · volume_maximo" },
    { file = "hidr", item = "cadastro · canal_fuga_medio" },
  ]
  how = "0.000333 (pTURB) × PROD_MEDIA_SIN."

  [[output.field]]
  path = "hydro.diversion_cost"
  from = [
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
    { file = "hidr", item = "cadastro · volume_minimo" },
    { file = "hidr", item = "cadastro · volume_maximo" },
    { file = "hidr", item = "cadastro · canal_fuga_medio" },
  ]
  how = "0.000300 (pCDESV, volume desviado) × PROD_MEDIA_SIN."

  [[output.field]]
  path = "hydro.turbined_violation_below_cost"
  from = [
    { file = "penalid", item = "TURBMN · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
  ]
  how = "TURBMN (primeiro valor não nulo de `penalid.dat`; sem registro, 10 × maior custo de déficit) × PROD_MEDIA_SIN."

  [[output.field]]
  path = "hydro.outflow_violation_below_cost"
  from = [
    { file = "penalid", item = "VAZMIN · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
  ]
  how = "VAZMIN (sem registro, 10 × maior custo de déficit) × PROD_MEDIA_SIN."

  [[output.field]]
  path = "hydro.outflow_violation_above_cost"
  from = [
    { file = "penalid", item = "TURBMX · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
  ]
  how = "TURBMX (sem registro, 10 × maior custo de déficit) × PROD_MEDIA_SIN."

  [[output.field]]
  path = "hydro.generation_violation_below_cost"
  from = [
    { file = "penalid", item = "GHMIN · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
  ]
  how = "GHMIN (sem registro, 10 × maior custo de déficit), em R$/MWh sem fator de produtibilidade: a folga é no domínio de energia."

  [[output.field]]
  path = "hydro.water_withdrawal_violation_cost"
  from = [
    { file = "penalid", item = "DESVIO · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
    { file = "confhd", item = "usinas · codigo_usina_jusante" },
  ]
  how = "DESVIO (sem registro, 10 × maior custo de déficit) × MAX_PRODTACUM_SIN, a maior produtibilidade acumulada de cascata avaliada na altura máxima (volume útil integral), com a topologia de `codigo_usina_jusante`."

  [[output.field]]
  path = "hydro.evaporation_violation_cost"
  from = [
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
    { file = "confhd", item = "usinas · codigo_usina_jusante" },
  ]
  how = "Sem variável em `penalid.dat`: 10 × maior custo de déficit × MAX_PRODTACUM_SIN (manual p.87, sem a divisão por C_M3S2HM3 porque a folga do Novomodelo é em m³/s)."

  [[output.field]]
  path = "hydro.inflow_nonnegativity_cost"
  from = [
    { file = "penalid", item = "DESVIO · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
  ]
  how = "`water_withdrawal_violation_cost` + 1 R$/(m³/s), para que a folga de afluência nunca seja mais barata que a violação de desvio de água. Sem contrapartida no NEWAVE."

  [[output.field]]
  path = "hydro.storage_violation_below_cost"
  from = [
    { file = "penalid", item = "VOLMIN · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
    { file = "confhd", item = "usinas · codigo_usina_jusante" },
  ]
  how = "VOLMIN (sem registro, 10 × maior custo de déficit) × MAX_PRODTACUM_SIN × 1e6/3600 (≈ 277.78), convertendo para R$/hm³ pela equivalência volumétrica. Slot ainda não usado pelo LP do Novomodelo."

  [[output.field]]
  path = "hydro.filling_target_violation_cost"
  from = [
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
    { file = "confhd", item = "usinas · codigo_usina_jusante" },
  ]
  how = "Sem variável em `penalid.dat`: 0.9 × maior custo de déficit × MAX_PRODTACUM_SIN × 1e6/3600, em R$/hm³. Slot ainda não usado pelo LP do Novomodelo."

# =============================================================================
# initial_conditions.json
# =============================================================================
[[output]]
path = "initial_conditions.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/newave/converters/initial_conditions.py"
reads = [
  { file = "confhd" },
  { file = "hidr" },
  { file = "modif" },
  { file = "exph" },
  { file = "dger" },
  { file = "adterm" },
  { file = "patamar" },
  { file = "term" },
  { file = "conft" },
  { file = "vazpast" },
]
summary = "Armazenamento inicial por usina ativa; opcionalmente o volume morto já enchido das usinas em enchimento, os despachos antecipados de `adterm.dat` e a tendência hidrológica de `vazpast.dat`."

  [[output.field]]
  path = "storage[].hydro_id"
  from = [ { file = "confhd", item = "usinas · codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo 0-based da usina ativa (`usina_existente` = EX ou EE, não fictícia), atribuído em ordem crescente de `codigo_usina`. Ordenado pelo id."

  [[output.field]]
  path = "storage[].value_hm3"
  from = [
    { file = "confhd", item = "usinas · volume_inicial_percentual" },
    { file = "hidr", item = "cadastro · volume_minimo" },
    { file = "hidr", item = "cadastro · volume_maximo" },
    { file = "hidr", item = "cadastro · tipo_regulacao" },
    { file = "hidr", item = "cadastro · volume_referencia" },
    { file = "modif", item = "VOLMIN · volume" },
    { file = "modif", item = "VOLMAX · volume" },
  ]
  how = "Percentual (limitado a [0, 100]) do volume útil `volume_maximo` − `volume_minimo`, somado ao mínimo, após VOLMIN/VOLMAX permanentes de `modif.dat`. Usinas `tipo_regulacao` D e S ancoram em `volume_referencia`, como o colapso de fio d'água dos limites; sem `volume_referencia`, seguem o percentual."

  [[output.field]]
  path = "filling_storage"
  from = [
    { file = "confhd", item = "usinas · usina_existente" },
    { file = "exph", item = "expansoes · data_inicio_enchimento" },
  ]
  how = "Lista vazia quando nenhuma usina NE de `confhd.dat` tem linha de enchimento de volume morto em `exph.dat`; caso contrário, ver os campos `filling_storage[].*`."

  [[output.field]]
  path = "filling_storage[].hydro_id"
  from = [
    { file = "confhd", item = "usinas · codigo_usina" },
    { file = "confhd", item = "usinas · usina_existente" },
    { file = "exph", item = "expansoes · data_inicio_enchimento" },
  ]
  status = "derived"
  when = "somente para usinas NE com linha de enchimento (`data_inicio_enchimento` não nula) em `exph.dat`"
  how = "Id Novomodelo da usina em enchimento; ela nunca aparece também em `storage`."

  [[output.field]]
  path = "filling_storage[].value_hm3"
  from = [
    { file = "exph", item = "expansoes · volume_morto" },
    { file = "hidr", item = "cadastro · volume_minimo" },
  ]
  when = "somente para usinas NE com linha de enchimento em `exph.dat`"
  how = "`volume_morto` (percentual, limitado a [0, 100]) / 100 × `volume_minimo`: a fração do volume morto já represada no início do enchimento."

  [[output.field]]
  path = "past_anticipated_commitments[].thermal_id"
  from = [
    { file = "dger", item = "despacho_antecipado_gnl" },
    { file = "adterm", item = "despachos · codigo_usina" },
  ]
  status = "derived"
  when = "somente quando `despacho_antecipado_gnl` ≠ 0 e `adterm.dat` tem despachos"
  how = "Id Novomodelo da térmica de `conft.dat`; códigos ausentes do mapa são ignorados com aviso."

  [[output.field]]
  path = "past_anticipated_commitments[].start_date"
  from = [
    { file = "adterm", item = "despachos · lag" },
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
  ]
  status = "derived"
  when = "somente quando `despacho_antecipado_gnl` ≠ 0 e `adterm.dat` tem despachos"
  how = "Primeiro dia do mês de entrega: `lag` = 1 é o primeiro mês do estudo, `lag` = 2 o segundo, e assim por diante; uma janela por `lag` de 1 ao máximo da usina."

  [[output.field]]
  path = "past_anticipated_commitments[].end_date"
  from = [
    { file = "adterm", item = "despachos · lag" },
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
  ]
  status = "derived"
  when = "somente quando `despacho_antecipado_gnl` ≠ 0 e `adterm.dat` tem despachos"
  how = "Primeiro dia do mês seguinte à entrega (fim exclusivo)."

  [[output.field]]
  path = "past_anticipated_commitments[].value_mw"
  from = [
    { file = "adterm", item = "despachos · valor" },
    { file = "adterm", item = "despachos · patamar" },
    { file = "patamar", item = "duracao_mensal_patamares · valor" },
    { file = "term", item = "usinas · potencia_instalada" },
    { file = "term", item = "usinas · fator_capacidade_maximo" },
    { file = "term", item = "usinas · geracao_minima" },
  ]
  when = "somente quando `despacho_antecipado_gnl` ≠ 0 e `adterm.dat` tem despachos"
  how = "Média dos MW por patamar ponderada pela fração de duração do patamar no mês de entrega (preserva o MWh comprometido). Limitado ao par estático [`min_mw`, `max_mw`] da térmica — o envelope dos limites por estágio —, com aviso."

  [[output.field]]
  path = "recent_observations[].hydro_id"
  from = [
    { file = "vazpast", item = "tendencia · codigo_usina" },
    { file = "confhd", item = "usinas · posto" },
  ]
  status = "derived"
  when = "somente quando `vazpast.dat` está presente com dados de tendência"
  how = "`codigo_usina` de `vazpast.dat` é o posto; mapeado ao id Novomodelo pela coluna `posto` de `confhd.dat`. Ordenado pelo id."

  [[output.field]]
  path = "recent_observations[].start_date"
  from = [
    { file = "vazpast", item = "tendencia · mes" },
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
  ]
  status = "derived"
  when = "somente quando `vazpast.dat` está presente com dados de tendência"
  how = "Primeiro dia de cada um dos 12 meses calendário anteriores ao início do estudo, do mais antigo ao mais recente; mês sem valor na tendência é omitido."

  [[output.field]]
  path = "recent_observations[].end_date"
  from = [
    { file = "vazpast", item = "tendencia · mes" },
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
  ]
  status = "derived"
  when = "somente quando `vazpast.dat` está presente com dados de tendência"
  how = "Primeiro dia do mês seguinte (fim exclusivo)."

  [[output.field]]
  path = "recent_observations[].value_m3s"
  from = [
    { file = "vazpast", item = "tendencia · valor" },
    { file = "confhd", item = "usinas · posto" },
    { file = "confhd", item = "usinas · codigo_usina_jusante" },
  ]
  when = "somente quando `vazpast.dat` está presente com dados de tendência"
  how = "Vazão natural do posto convertida em incremental subtraindo, mês a mês, a vazão natural dos postos imediatamente a montante na cascata de `codigo_usina_jusante`."

# =============================================================================
# system/buses.json
# =============================================================================
[[output]]
path = "system/buses.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/newave/converters/network.py"
reads = [
  { file = "sistema" },
  { file = "dger" },
  { file = "ree" },
]
summary = "Uma barra por submercado de `sistema.dat` (fictícios incluídos), com os patamares de déficit."

  [[output.field]]
  path = "buses[].id"
  from = [
    { file = "sistema", item = "custo_deficit · codigo_submercado" },
    { file = "ree", item = "rees · submercado" },
  ]
  status = "derived"
  how = "Id 0-based em ordem crescente de `codigo_submercado`; códigos que só aparecem em `ree.dat` são acrescentados ao mapa. Lista ordenada pelo id."

  [[output.field]]
  path = "buses[].name"
  from = [ { file = "sistema", item = "custo_deficit · nome_submercado" } ]
  how = "Nome do submercado, sem espaços nas pontas."

  [[output.field]]
  path = "buses[].operational_start_date"
  from = [ { file = "dger", item = "ano_inicial_historico" } ]
  status = "derived"
  how = "1º de janeiro de `ano_inicial_historico` (1931 quando ausente): submercados não têm data de entrada; o Novomodelo usa a data só como chave de ordenação."

  [[output.field]]
  path = "buses[].deficit_segments[].cost"
  from = [
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "sistema", item = "custo_deficit · patamar_deficit" },
  ]
  how = "Um segmento por `patamar_deficit` com custo positivo, em ordem de patamar, R$/MWh direto. Submercado sem custo positivo (fictício) recebe um único segmento com o primeiro custo positivo do arquivo."

  [[output.field]]
  path = "buses[].deficit_segments[].depth_mw"
  from = [ { file = "sistema", item = "custo_deficit · corte" } ]
  how = "Profundidade `corte` do patamar; o último segmento de cada barra é sempre nulo (ilimitado)."

# =============================================================================
# system/lines.json
# =============================================================================
[[output]]
path = "system/lines.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/newave/converters/network.py"
reads = [
  { file = "sistema" },
  { file = "dger" },
  { file = "ree" },
]
summary = "Uma linha por par não ordenado de submercados presente em `limites_intercambio`, com as capacidades do primeiro mês do estudo."

  [[output.field]]
  path = "lines[].id"
  from = [
    { file = "sistema", item = "limites_intercambio · submercado_de" },
    { file = "sistema", item = "limites_intercambio · submercado_para" },
  ]
  status = "derived"
  how = "Pares canônicos (menor código, maior código) coletados de todas as datas do arquivo, ordenados e numerados de 0; o mesmo mapa é usado em `constraints/line_bounds.parquet`."

  [[output.field]]
  path = "lines[].name"
  from = [
    { file = "sistema", item = "limites_intercambio · submercado_de" },
    { file = "sistema", item = "limites_intercambio · submercado_para" },
  ]
  status = "derived"
  how = "`{código origem}_{código destino}` com os códigos numéricos do par canônico."

  [[output.field]]
  path = "lines[].operational_start_date"
  from = [ { file = "dger", item = "ano_inicial_historico" } ]
  status = "derived"
  how = "1º de janeiro de `ano_inicial_historico`, como nas barras."

  [[output.field]]
  path = "lines[].source_bus_id"
  from = [ { file = "sistema", item = "limites_intercambio · submercado_de" } ]
  status = "derived"
  how = "Id Novomodelo do menor código do par."

  [[output.field]]
  path = "lines[].target_bus_id"
  from = [ { file = "sistema", item = "limites_intercambio · submercado_para" } ]
  status = "derived"
  how = "Id Novomodelo do maior código do par."

  [[output.field]]
  path = "lines[].capacity.direct_mw"
  from = [
    { file = "sistema", item = "limites_intercambio · valor" },
    { file = "sistema", item = "limites_intercambio · sentido" },
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
  ]
  how = "Limite (MW) no sentido menor→maior código no mês de início do estudo (`sentido` 0 é de→para, 1 é para→de). Sem linha nessa data usa a primeira data com valor; par sem linha recebe 0."

  [[output.field]]
  path = "lines[].capacity.reverse_mw"
  from = [
    { file = "sistema", item = "limites_intercambio · valor" },
    { file = "sistema", item = "limites_intercambio · sentido" },
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
  ]
  how = "Limite (MW) no sentido maior→menor código, mesma regra de data."

  [[output.field]]
  path = "lines[].exchange_cost"
  from = [ { file = "sistema", item = "custo_deficit · ficticio" } ]
  how = "Presente só em linhas que tocam um submercado fictício: 0.000273 × 0.5, meia pINT, para que uma rota real→fictício→real custe o mesmo que o intercâmbio direto. Demais linhas usam o valor global de `penalties.json`."

# =============================================================================
# system/thermals.json
# =============================================================================
[[output]]
path = "system/thermals.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/newave/converters/thermal.py"
reads = [
  { file = "conft" },
  { file = "clast" },
  { file = "term" },
  { file = "expt" },
  { file = "manutt" },
  { file = "dger" },
  { file = "adterm" },
  { file = "patamar" },
  { file = "sistema" },
  { file = "ree" },
]
summary = "Uma entrada por usina térmica de `conft.dat`, ordenada pelo id Novomodelo, com o par estático de geração — o envelope dos limites por estágio — e o custo do primeiro ano de `clast.dat`."

  [[output.field]]
  path = "thermals[].id"
  from = [ { file = "conft", item = "usinas · codigo_usina" } ]
  status = "derived"
  how = "Id 0-based em ordem crescente de `codigo_usina`."

  [[output.field]]
  path = "thermals[].name"
  from = [ { file = "conft", item = "usinas · nome_usina" } ]
  how = "Nome sem espaços nas pontas."

  [[output.field]]
  path = "thermals[].operational_start_date"
  from = [ { file = "dger", item = "ano_inicial_historico" } ]
  status = "derived"
  how = "1º de janeiro de `ano_inicial_historico`: o NEWAVE não tem data de entrada por térmica."

  [[output.field]]
  path = "thermals[].bus_id"
  from = [ { file = "conft", item = "usinas · submercado" } ]
  status = "derived"
  how = "Id Novomodelo do submercado da usina."

  [[output.field]]
  path = "thermals[].cost_per_mwh"
  from = [ { file = "clast", item = "usinas · valor (indice_ano_estudo = 1)" } ]
  how = "Custo do primeiro ano de estudo; 0.0 para usina sem linha em `clast.dat`. Anos com custo diferente e as modificações datadas vão para `constraints/thermal_bounds.parquet`."

  [[output.field]]
  path = "thermals[].generation.min_mw"
  from = [
    { file = "term", item = "usinas · geracao_minima (mes 1 a 12)" },
    { file = "term", item = "usinas · geracao_minima (mes = 13)" },
    { file = "expt", item = "expansoes · tipo = GTMIN · modificacao" },
    { file = "expt", item = "expansoes · data_inicio" },
    { file = "expt", item = "expansoes · data_fim" },
    { file = "conft", item = "usinas · usina_existente" },
    { file = "dger", item = "ano_inicio_estudo" },
    { file = "dger", item = "mes_inicio_estudo" },
  ]
  how = "Menor mínimo do horizonte: o envelope de `min_generation_mw` de `constraints/thermal_bounds.parquet`, que detalha as fontes. Ler só a linha de cadastro do `term.dat` publicaria um par que contradiz a tabela por estágio, porque as janelas de `expt.dat`, o valor dos demais anos de `term.dat`, as manutenções e a regra de IP dos anos de manutenção entram apenas por ela. Usina que nenhuma fonte de capacidade descreve recebe 0."

  [[output.field]]
  path = "thermals[].generation.max_mw"
  from = [
    { file = "term", item = "usinas · potencia_instalada" },
    { file = "term", item = "usinas · fator_capacidade_maximo" },
    { file = "term", item = "usinas · teif" },
    { file = "term", item = "usinas · indisponibilidade_programada" },
    { file = "expt", item = "expansoes · tipo = POTEF · modificacao" },
    { file = "expt", item = "expansoes · tipo = FCMAX · modificacao" },
    { file = "expt", item = "expansoes · tipo = TEIFT · modificacao" },
    { file = "expt", item = "expansoes · tipo = IPTER · modificacao" },
    { file = "manutt", item = "manutencoes · potencia" },
    { file = "conft", item = "usinas · usina_existente" },
    { file = "dger", item = "num_anos_manutencao_utes" },
  ]
  how = "Maior máximo do horizonte: o envelope de `max_generation_mw` de `constraints/thermal_bounds.parquet`, que detalha as fontes — logo já com TEIF, IP e manutenção. Quando a geração mínima de cadastro supera o produto `potencia_instalada` × `fator_capacidade_maximo` / 100, o teto por estágio é elevado ao mínimo inflexível e o envelope herda essa ordenação, em vez de publicar o intervalo vazio que o Novomodelo rejeita (`max_mw` tem de ser ≥ `min_mw`). Usina que nenhuma fonte de capacidade descreve recebe 0."

  [[output.field]]
  path = "thermals[].anticipated_config"
  from = [
    { file = "dger", item = "despacho_antecipado_gnl" },
    { file = "adterm", item = "despachos · codigo_usina" },
  ]
  how = "Nulo quando `despacho_antecipado_gnl` = 0, quando `adterm.dat` está ausente ou quando a usina não tem despacho nele; caso contrário o objeto `anticipated_config.lead_stages`."

  [[output.field]]
  path = "thermals[].anticipated_config.lead_stages"
  from = [ { file = "adterm", item = "despachos · lag" } ]
  when = "somente para térmicas com despacho em `adterm.dat` quando `despacho_antecipado_gnl` ≠ 0"
  how = "Maior `lag` da usina, limitado ao número total de estágios (aviso quando truncado)."

  [[output.field]]
  path = "thermals[].entry_stage_id"
  from = []
  status = "null"
  how = "Sempre nulo: térmicas do NEWAVE não entram dentro do horizonte; a expansão de `expt.dat` é expressa por limites por estágio."

  [[output.field]]
  path = "thermals[].exit_stage_id"
  from = []
  status = "null"
  how = "Sempre nulo: térmicas do NEWAVE não saem dentro do horizonte."

