  [[output.field]]
  path = "non_controllable_sources[].name"
  from = [
    { file = "sistema", item = "geracao_usinas_nao_simuladas · fonte" },
    { file = "sistema", item = "geracao_usinas_nao_simuladas · codigo_submercado" },
  ]
  status = "derived"
  how = "`{fonte}_{codigo_submercado}`, com a primeira `fonte` não nula do grupo (`NCS` quando não há)."

  [[output.field]]
  path = "non_controllable_sources[].operational_start_date"
  from = [ { file = "dger", item = "ano_inicial_historico" } ]
  status = "derived"
  how = "1º de janeiro de `ano_inicial_historico`, como nas barras."

  [[output.field]]
  path = "non_controllable_sources[].bus_id"
  from = [ { file = "sistema", item = "geracao_usinas_nao_simuladas · codigo_submercado" } ]
  status = "derived"
  how = "Id Novomodelo do submercado do grupo."

  [[output.field]]
  path = "non_controllable_sources[].max_generation_mw"
  from = [ { file = "sistema", item = "geracao_usinas_nao_simuladas · valor" } ]
  how = "Maior `valor` não nulo do grupo dentro do horizonte; a disponibilidade por estágio (`valor` / máximo) vai para `scenarios/non_controllable_stats.parquet`."

  [[output.field]]
  path = "non_controllable_sources[].allow_curtailment"
  from = []
  status = "constant"
  how = "Sempre `false`: o NEWAVE abate a geração não simulada do mercado antes do despacho, logo ela é obrigatória; permitir corte desviava o despacho hidráulico."

# =============================================================================
# constraints/generic_parameters.json
# =============================================================================
[[output]]
path = "constraints/generic_parameters.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/novomodelo/scalar_parameters.py"
reads = [
  { file = "confhd" },
  { file = "hidr" },
  { file = "exph" },
  { file = "modif" },
  { file = "curva" },
  { file = "dger" },
  { file = "ree" },
]
summary = "Declara `rho_eq_h{id}` e `rho_acum_h{id}` para toda usina hidráulica ativa; a produtibilidade acumulada vira `per_stage` nas usinas referenciadas pelas restrições VminOP de `curva.dat`."

  [[output.field]]
  path = "scalar_parameters[].id"
  from = [ { file = "confhd", item = "usinas · codigo_usina" } ]
  status = "derived"
  how = "Sequencial de 0, dois por usina (ρ_eq e depois ρ_acum), em ordem crescente de id Novomodelo."

  [[output.field]]
  path = "scalar_parameters[].name"
  from = [ { file = "confhd", item = "usinas · codigo_usina" } ]
  status = "derived"
  how = "`rho_eq_h{id}` e `rho_acum_h{id}` com o id Novomodelo da usina; são os tokens `@name` usados em `constraints/generic_constraints.json`."

  [[output.field]]
  path = "scalar_parameters[].kind"
  from = [
    { file = "curva", item = "curva_seguranca · codigo_ree" },
    { file = "dger", item = "curva_aversao" },
  ]
  how = "`computed` para todo `rho_eq_h{id}` e, por padrão, para `rho_acum_h{id}`; `per_stage` no `rho_acum_h{id}` das usinas que entram numa expressão VminOP (`curva.dat` presente, `curva_aversao` ≠ 0)."

  [[output.field]]
  path = "scalar_parameters[].computed_spec.tag"
  from = []
  status = "constant"
  how = "`equivalent_productivity` na entrada ρ_eq e `accumulated_productivity` na entrada ρ_acum; o Novomodelo calcula o valor a partir da geometria em tempo de solução."

  [[output.field]]
  path = "scalar_parameters[].computed_spec.hydro_id"
  from = [ { file = "confhd", item = "usinas · codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo da usina a que o parâmetro se refere."

  [[output.field]]
  path = "scalar_parameters[].values"
  from = [
    { file = "curva", item = "curva_seguranca · codigo_ree" },
    { file = "confhd", item = "usinas · ree" },
    { file = "confhd", item = "usinas · codigo_usina_jusante" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
    { file = "hidr", item = "cadastro · a0_volume_cota … a4_volume_cota" },
    { file = "modif", item = "VOLCOTA · coeficientes a0 a a4" },
    { file = "hidr", item = "cadastro · canal_fuga_medio" },
    { file = "hidr", item = "cadastro · perdas" },
    { file = "hidr", item = "cadastro · tipo_perda" },
    { file = "hidr", item = "cadastro · volume_minimo" },
    { file = "hidr", item = "cadastro · volume_maximo" },
    { file = "hidr", item = "cadastro · tipo_regulacao" },
    { file = "modif", item = "CFUGA" },
    { file = "modif", item = "CMONT" },
    { file = "modif", item = "VOLMIN · volume" },
    { file = "modif", item = "VOLMAX · volume" },
    { file = "dger", item = "mes_inicio_estudo" },
  ]
  when = "somente nas entradas `rho_acum_h{id}` de usinas referenciadas por uma restrição VminOP"
  how = "Pares [estágio, valor] com a produtibilidade acumulada de cascata na convenção de energia armazenada (média integrada da cota entre `volume_minimo` e `volume_maximo`, como o `produtibilidade_acumulada_calculo_earm` do pmo.dat), recalculada nos estágios com CFUGA/CMONT ativos. Dividida por 2.628 × horas do mês / 730 para ficar em MWmês/hm³ e casar com o lado direito da restrição."

# =============================================================================
# constraints/line_bounds.parquet
# =============================================================================
[[output]]
path = "constraints/line_bounds.parquet"
kind = "parquet"
when = ""
module = "src/novomodelo_bridge/newave/converters/network.py"
reads = [
  { file = "sistema" },
  { file = "patamar" },
  { file = "dger" },
]
summary = "Uma linha base por (linha, estágio) com os limites de intercâmbio do mês, mais uma linha por patamar onde o fator de `patamar.dat` difere de 1."

  [[output.field]]
  path = "line_id"
  from = [
    { file = "sistema", item = "limites_intercambio · submercado_de" },
    { file = "sistema", item = "limites_intercambio · submercado_para" },
  ]
  status = "derived"
  how = "Mesmo mapa de pares canônicos de `system/lines.json`."

  [[output.field]]
  path = "stage_id"
  from = [
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
    { file = "dger", item = "num_anos_estudo" },
    { file = "dger", item = "num_anos_pos_estudo" },
  ]
  status = "derived"
  how = "Todo estágio do estudo e do pós-estudo, para toda linha."

  [[output.field]]
  path = "block_id"
  from = [ { file = "patamar", item = "intercambio_patamares · patamar" } ]
  how = "Nulo na linha base do estágio; `patamar` − 1 nas linhas de sobrescrita por patamar, emitidas só quando o fator direto ou reverso é diferente de 1.0."

  [[output.field]]
  path = "direct_mw"
  from = [
    { file = "sistema", item = "limites_intercambio · valor" },
    { file = "sistema", item = "limites_intercambio · sentido" },
    { file = "patamar", item = "intercambio_patamares · valor" },
  ]
  how = "Linha base: limite menor→maior código no (ano, mês) do estágio, com recuo ao último ano do arquivo no mesmo mês; no pós-estudo congela no valor do último estágio de estudo. Linha por patamar: base × fator de `intercambio_patamares` (de→para com de < para), fator do pós-estudo repetindo o padrão mensal do último ano."

  [[output.field]]
  path = "reverse_mw"
  from = [
    { file = "sistema", item = "limites_intercambio · valor" },
    { file = "sistema", item = "limites_intercambio · sentido" },
    { file = "patamar", item = "intercambio_patamares · valor" },
  ]
  how = "Mesma regra no sentido maior→menor código (fator de `intercambio_patamares` com de > para)."

# =============================================================================
# constraints/thermal_bounds.parquet
# =============================================================================
[[output]]
path = "constraints/thermal_bounds.parquet"
kind = "parquet"
when = "somente quando os limites de alguma térmica variam entre estágios (e diferem, portanto, do envelope publicado em `system/thermals.json`), ou quando alguma térmica tem custo variável por ano de estudo ou modificação datada em `clast.dat`"
module = "src/novomodelo_bridge/newave/converters/thermal.py"
reads = [
  { file = "conft" },
  { file = "clast" },
  { file = "term" },
  { file = "expt" },
  { file = "manutt" },
  { file = "dger" },
]
summary = "Limites de geração por (térmica, estágio) seguindo a ordem do sintetizador do NEWAVE (IP, EXPT, disponibilidade POTEF/GTMIN, MANUTT), com sobrescrita de custo por estágio das térmicas de custo variável. Quando a tabela é emitida, toda térmica de `term.dat`, `expt.dat` ou `manutt.dat` recebe linhas; cada linha fica dentro do envelope de `system/thermals.json`."

  [[output.field]]
  path = "thermal_id"
  from = [ { file = "conft", item = "usinas · codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo da térmica; códigos de `expt.dat`, `manutt.dat` ou `term.dat` ausentes de `conft.dat` são ignorados."

  [[output.field]]
  path = "stage_id"
  from = [
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "ano_inicio_estudo" },
    { file = "dger", item = "num_anos_estudo" },
    { file = "dger", item = "num_anos_pos_estudo" },
  ]
  status = "derived"
  how = "Todo estágio do estudo e do pós-estudo."

  [[output.field]]
  path = "min_generation_mw"
  from = [
    { file = "term", item = "usinas · geracao_minima (mes 1 a 12)" },
    { file = "term", item = "usinas · geracao_minima (mes = 13)" },
    { file = "expt", item = "expansoes · tipo = GTMIN · modificacao" },
    { file = "expt", item = "expansoes · data_inicio" },
    { file = "expt", item = "expansoes · data_fim" },
    { file = "conft", item = "usinas · usina_existente" },
    { file = "dger", item = "ano_inicio_estudo" },
    { file = "dger", item = "mes_inicio_estudo" },
  ]
  how = "`geracao_minima` de `term.dat` em dois regimes: nos estágios do primeiro ano de estudo (o ano de `ano_inicio_estudo`), a coluna do mês calendário do estágio; nos anos seguintes, inclusive o pós-estudo, o valor único dos demais anos (que a inewave entrega como `mes = 13`), independentemente de `num_anos_manutencao_utes`. Usina com esse valor em branco conserva a coluna do mês calendário nos anos seguintes. Em cima disso entram as janelas GTMIN de `expt.dat`. Para usina `EE` ou `NE` em `conft.dat`, o NEWAVE descarta o mínimo de cadastro: fora das janelas, e para usina sem nenhuma janela, vale 0. Usina `EX` conserva o valor do `term.dat` onde o `expt.dat` não declara nada. No pós-estudo congela na configuração do último estágio de estudo (ou do estágio final, para usina que só entra no pós-estudo)."

  [[output.field]]
  path = "max_generation_mw"
  from = [
    { file = "term", item = "usinas · potencia_instalada" },
    { file = "term", item = "usinas · fator_capacidade_maximo" },
    { file = "term", item = "usinas · teif" },
    { file = "term", item = "usinas · indisponibilidade_programada" },
    { file = "expt", item = "expansoes · tipo = POTEF · modificacao" },
    { file = "expt", item = "expansoes · tipo = FCMAX · modificacao" },
    { file = "expt", item = "expansoes · tipo = TEIFT · modificacao" },
    { file = "expt", item = "expansoes · tipo = IPTER · modificacao" },
    { file = "manutt", item = "manutencoes · data_inicio" },
    { file = "manutt", item = "manutencoes · duracao" },
    { file = "manutt", item = "manutencoes · potencia" },
    { file = "conft", item = "usinas · usina_existente" },
    { file = "dger", item = "num_anos_manutencao_utes" },
  ]
  how = "`potencia` × FCMAX/100 × (100 − IP)/100 × (100 − TEIF)/100, com POTEF/FCMAX/TEIFT/IPTER de `expt.dat` aplicados por janela. Para usina `EE` ou `NE` em `conft.dat`, o NEWAVE descarta a potência de cadastro: fora de toda janela POTEF, e sem nenhuma janela, a potência é 0; usina `EX` conserva a do `term.dat`. IP é zerado e a redução de `manutt.dat` (potência × fração do mês em manutenção) subtraída só nos estágios antes do fim de `num_anos_manutencao_utes`; se GTMIN excede a capacidade, o máximo é elevado ao mínimo com aviso."

  [[output.field]]
  path = "cost_per_mwh"
  from = [
    { file = "clast", item = "usinas · valor" },
    { file = "clast", item = "usinas · indice_ano_estudo" },
    { file = "clast", item = "modificacoes · custo" },
    { file = "clast", item = "modificacoes · data_inicio" },
    { file = "clast", item = "modificacoes · data_fim" },
  ]
  how = "Nulo para térmica de custo constante. Para as demais, o `valor` do ano de estudo do estágio, sobrescrito em ordem de arquivo pelas modificações cujo intervalo contém a data do estágio; o pós-estudo congela no custo do último estágio de estudo."

# =============================================================================
# constraints/penalty_overrides_bus.parquet
# =============================================================================
[[output]]
path = "constraints/penalty_overrides_bus.parquet"
kind = "parquet"
when = "somente quando `sistema.dat` marca algum submercado como fictício (`ficticio`) e há custo de déficit positivo"
module = "src/novomodelo_bridge/newave/converters/network.py"
reads = [
  { file = "sistema" },
  { file = "dger" },
  { file = "ree" },
]
summary = "Sobrescrita do custo de excesso nas barras fictícias em todo estágio, para proibir na prática o excesso de energia nesses nós de passagem."

  [[output.field]]
  path = "bus_id"
  from = [
    { file = "sistema", item = "custo_deficit · ficticio" },
    { file = "sistema", item = "custo_deficit · codigo_submercado" },
  ]
  status = "derived"
  how = "Id Novomodelo de cada submercado com `ficticio` verdadeiro, em ordem crescente de código."

  [[output.field]]
  path = "stage_id"
  from = [
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "num_anos_estudo" },
    { file = "dger", item = "num_anos_pos_estudo" },
  ]
  status = "derived"
  how = "Todo estágio do estudo e do pós-estudo, por barra fictícia."

  [[output.field]]
  path = "excess_cost"
  from = [ { file = "sistema", item = "custo_deficit · custo" } ]
  how = "Primeiro custo de déficit positivo do arquivo, o mesmo que `system/buses.json` atribui às barras fictícias, para que excesso e déficit custem o mesmo ali."

# =============================================================================
# constraints/penalty_overrides_hydro.parquet
# =============================================================================
[[output]]
path = "constraints/penalty_overrides_hydro.parquet"
kind = "parquet"
when = "somente quando alguma usina ativa tem registro CFUGA ou CMONT em `modif.dat` que faça a PROD_MEDIA_SIN de algum estágio diferir da global; a tabela é esparsa e só carrega as colunas que diferem"
module = "src/novomodelo_bridge/newave/converters/network.py"
reads = [
  { file = "sistema" },
  { file = "penalid" },
  { file = "hidr" },
  { file = "confhd" },
  { file = "modif" },
  { file = "exph" },
  { file = "dger" },
]
summary = "Recalcula o bloco `hydro` de `penalties.json` com a PROD_MEDIA_SIN de cada estágio (uniforme para todas as usinas, como a constante única do NEWAVE) e emite só o que difere do valor global."

  [[output.field]]
  path = "hydro_id"
  from = [ { file = "confhd", item = "usinas · codigo_usina" } ]
  status = "derived"
  how = "Toda usina hidráulica ativa, em ordem crescente de id, repetida para cada estágio que difere."

  [[output.field]]
  path = "stage_id"
  from = [
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "num_anos_estudo" },
    { file = "dger", item = "num_anos_pos_estudo" },
  ]
  status = "derived"
  how = "Somente os estágios em que ao menos uma coluna difere do valor global."

  [[output.field]]
  path = "spillage_cost"
  from = [
    { file = "modif", item = "CFUGA" },
    { file = "modif", item = "CMONT" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
  ]
  when = "somente quando o valor do estágio difere de `penalties.json`"
  how = "0.000300 × PROD_MEDIA_SIN do estágio (PRODT média com o canal de fuga/cota de montante de CFUGA/CMONT vigentes)."

  [[output.field]]
  path = "turbined_cost"
  from = [
    { file = "modif", item = "CFUGA" },
    { file = "modif", item = "CMONT" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
  ]
  when = "somente quando o valor do estágio difere de `penalties.json`"
  how = "0.000333 × PROD_MEDIA_SIN do estágio."

  [[output.field]]
  path = "diversion_cost"
  from = [
    { file = "modif", item = "CFUGA" },
    { file = "modif", item = "CMONT" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
  ]
  when = "somente quando o valor do estágio difere de `penalties.json`"
  how = "0.000300 × PROD_MEDIA_SIN do estágio."

  [[output.field]]
  path = "turbined_violation_below_cost"
  from = [
    { file = "penalid", item = "TURBMN · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "modif", item = "CFUGA" },
    { file = "modif", item = "CMONT" },
  ]
  when = "somente quando o valor do estágio difere de `penalties.json`"
  how = "TURBMN (ou 10 × maior custo de déficit) × PROD_MEDIA_SIN do estágio."

  [[output.field]]
  path = "outflow_violation_below_cost"
  from = [
    { file = "penalid", item = "VAZMIN · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "modif", item = "CFUGA" },
    { file = "modif", item = "CMONT" },
  ]
  when = "somente quando o valor do estágio difere de `penalties.json`"
  how = "VAZMIN (ou 10 × maior custo de déficit) × PROD_MEDIA_SIN do estágio."

  [[output.field]]
  path = "outflow_violation_above_cost"
  from = [
    { file = "penalid", item = "TURBMX · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "modif", item = "CFUGA" },
    { file = "modif", item = "CMONT" },
  ]
  when = "somente quando o valor do estágio difere de `penalties.json`"
  how = "TURBMX (ou 10 × maior custo de déficit) × PROD_MEDIA_SIN do estágio."

  [[output.field]]
  path = "storage_violation_below_cost"
  from = [
    { file = "penalid", item = "VOLMIN · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
    { file = "confhd", item = "usinas · codigo_usina_jusante" },
  ]
  when = "somente quando o valor do estágio difere de `penalties.json`"
  how = "Mesma fórmula de `penalties.json` com a MAX_PRODTACUM_SIN do estágio. Como o pipeline mantém essa constante fixa em todo o horizonte, na prática a coluna nunca difere e não é emitida."

  [[output.field]]
  path = "evaporation_violation_cost"
  from = [
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
    { file = "confhd", item = "usinas · codigo_usina_jusante" },
  ]
  when = "somente quando o valor do estágio difere de `penalties.json`"
  how = "10 × maior custo de déficit × MAX_PRODTACUM_SIN do estágio; constante no horizonte, logo na prática não emitida."

  [[output.field]]
  path = "water_withdrawal_violation_cost"
  from = [
    { file = "penalid", item = "DESVIO · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
    { file = "confhd", item = "usinas · codigo_usina_jusante" },
  ]
  when = "somente quando o valor do estágio difere de `penalties.json`"
  how = "DESVIO (ou 10 × maior custo de déficit) × MAX_PRODTACUM_SIN do estágio; constante no horizonte, logo na prática não emitida."

  [[output.field]]
  path = "inflow_nonnegativity_cost"
  from = [
    { file = "penalid", item = "DESVIO · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
    { file = "hidr", item = "cadastro · produtibilidade_especifica" },
  ]
  when = "somente quando o valor do estágio difere de `penalties.json`"
  how = "`water_withdrawal_violation_cost` do estágio + 1; segue a constante MAX_PRODTACUM_SIN, logo na prática não emitida."

# ===== frag_B_nw_hydro =====
# Fragment B — NEWAVE hydro outputs (hydros.json, hydro_production_models.json,
# hydro_geometry.parquet, hydro_energy_productivity.parquet, tailrace_curves.parquet,
# constraints/hydro_bounds.parquet). The top-level `track` key is written by the assembler.

# ---------------------------------------------------------------------------
# system/hydros.json
# ---------------------------------------------------------------------------
[[output]]
path = "system/hydros.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/newave/converters/hydro/entity.py"
reads = [
  { file = "hidr" },
  { file = "confhd" },
  { file = "ree" },
  { file = "sistema" },
  { file = "modif" },
  { file = "exph" },
  { file = "dger" },
  { file = "volref_saz" },
]
summary = "Uma entrada por usina hidrelétrica ativa de `confhd.dat` (em operação — `EX` ou `EE` — e não fictícias, mais usinas NE com enchimento de volume morto em `exph.dat`), com o cadastro de `hidr.dat` já corrigido pelos registros permanentes de `modif.dat`, ordenada pelo id Novomodelo."

  [[output.field]]
  path = "hydros[].id"
  from = [
    { file = "confhd", item = "codigo_usina" },
    { file = "confhd", item = "usina_existente" },
    { file = "confhd", item = "posto" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "exph", item = "data_inicio_enchimento" },
  ]
  status = "derived"
  how = "Id 0-based denso atribuído em ordem crescente de `codigo_usina` entre as usinas ativas: `usina_existente` em `EX`/`EE` menos as fictícias (produtibilidade específica zero compartilhando o `posto` de uma usina geradora), mais as usinas NE com registro de enchimento em `exph.dat`."

  [[output.field]]
  path = "hydros[].name"
  from = [ { file = "confhd", item = "nome_usina" } ]
  how = "Nome da usina em `confhd.dat`, sem espaços nas extremidades."

  [[output.field]]
  path = "hydros[].operational_start_date"
  from = [
    { file = "dger", item = "ano_inicial_historico" },
    { file = "exph", item = "data_inicio_enchimento" },
    { file = "exph", item = "duracao_enchimento" },
  ]
  status = "derived"
  how = "Usinas existentes: 1º de janeiro de `ano_inicial_historico` (1931 se ausente). Usina NE em enchimento: primeiro dia do mês em que o enchimento termina (`data_inicio_enchimento` mais `duracao_enchimento` meses). No Novomodelo é chave de ordenação, não porta de entrada em operação."

  [[output.field]]
  path = "hydros[].downstream_id"
  from = [
    { file = "confhd", item = "codigo_usina_jusante" },
    { file = "confhd", item = "usina_existente" },
    { file = "confhd", item = "posto" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "exph", item = "data_inicio_enchimento" },
  ]
  status = "derived"
  how = "Id Novomodelo da próxima usina real a jusante. A cadeia `codigo_usina_jusante` é percorrida de forma transparente através de usinas fictícias e NE/NC; quando o jusante é 0 mas uma usina fictícia compartilha o `posto` da usina, ela é tomada como elo implícito da cascata. Nulo quando a cascata termina no mar."

  [[output.field]]
  path = "hydros[].reservoir.min_storage_hm3"
  from = [
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_referencia" },
    { file = "modif", item = "VOLMIN · volume, unidade" },
  ]
  how = "`volume_minimo` do cadastro (sobrescrito pelo registro permanente `VOLMIN` de `modif.dat`, em hm³ com `unidade` = h ou, com `%`, como percentual do volume útil do cadastro). Usinas `tipo_regulacao` D e S recebem `volume_referencia`, colapsando a faixa útil a um ponto (faixa completa se ausente)."

  [[output.field]]
  path = "hydros[].reservoir.max_storage_hm3"
  from = [
    { file = "hidr", item = "volume_maximo" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_referencia" },
    { file = "modif", item = "VOLMAX · volume, unidade" },
    { file = "modif", item = "VOLMIN · volume" },
  ]
  how = "`volume_maximo` do cadastro (sobrescrito por `VOLMAX` de `modif.dat`, em hm³ com `unidade` = h ou, com `%`, como percentual do volume útil do cadastro). Usinas `D` e `S` recebem `volume_referencia` (faixa completa se ausente), pois o NEWAVE não acumula água entre estágios nessas usinas."

  [[output.field]]
  path = "hydros[].outflow.min_outflow_m3s"
  from = [
    { file = "dger", item = "desconsidera_vazao_minima" },
    { file = "hidr", item = "vazao_minima_historica" },
    { file = "modif", item = "VAZMIN · vazao" },
  ]
  how = "`vazao_minima_historica` (sobrescrita pelo registro permanente `VAZMIN` de `modif.dat`), ou 0 quando não positiva. Os registros temporais `VAZMINT` vão para `constraints/hydro_bounds.parquet`."

  [[output.field]]
  path = "hydros[].outflow.max_outflow_m3s"
  from = []
  status = "null"
  how = "Sempre nulo: o NEWAVE não impõe vazão defluente máxima estática; o registro `VAZMAXT` de `modif.dat` não é convertido."

  [[output.field]]
  path = "hydros[].generation.model"
  from = [
    { file = "dger", item = "funcao_producao_uhe" },
    { file = "hidr", item = "a0_volume_cota … a4_volume_cota" },
    { file = "modif", item = "VOLCOTA · coeficientes a0 a a4" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "exph", item = "data_entrada_operacao" },
  ]
  how = "`fpha` quando `funcao_producao_uhe = 0` e a usina tem polinômio cota-volume não nulo, produtibilidade específica positiva e engolimento e potência nominais (Σ máquinas × nominal por conjunto, após `MODIF NUMCNJ`/`NUMMAQ`, na configuração declarada — a final, para usina `EE` com entrada de máquinas em `exph.dat`) positivos; `constant_productivity` nos demais casos. Uma usina excluída só pela capacidade nula é listada em diagnóstico informativo."

  [[output.field]]
  path = "hydros[].generation.min_turbined_m3s"
  from = []
  status = "constant"
  how = "Sempre 0.0: o NEWAVE não impõe turbinamento mínimo estático; `TURBMINT` por estágio vai para `constraints/hydro_bounds.parquet`."

  [[output.field]]
  path = "hydros[].generation.max_turbined_m3s"
  from = [
    { file = "hidr", item = "numero_conjuntos_maquinas" },
    { file = "hidr", item = "maquinas_conjunto_1 … maquinas_conjunto_5" },
    { file = "hidr", item = "vazao_nominal_conjunto_1 … vazao_nominal_conjunto_5" },
    { file = "hidr", item = "potencia_nominal_conjunto_1 … potencia_nominal_conjunto_5" },
    { file = "modif", item = "POTEFE · potencia, conjunto" },
    { file = "hidr", item = "queda_nominal_conjunto_1 … queda_nominal_conjunto_5" },
    { file = "hidr", item = "teif" },
    { file = "hidr", item = "ip" },
    { file = "hidr", item = "tipo_turbina" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "hidr", item = "volume_referencia" },
    { file = "hidr", item = "a0_volume_cota … a4_volume_cota" },
    { file = "modif", item = "VOLCOTA · coeficientes a0 a a4" },
    { file = "hidr", item = "canal_fuga_medio" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "hidr", item = "tipo_perda" },
    { file = "hidr", item = "perdas" },
    { file = "modif", item = "NUMCNJ · numero" },
    { file = "modif", item = "NUMMAQ · numero_maquinas" },
    { file = "modif", item = "VOLMIN · volume" },
    { file = "modif", item = "VOLMAX · volume" },
    { file = "modif", item = "CFUGA · nivel" },
    { file = "modif", item = "CMONT · nivel" },
    { file = "volref_saz", item = "valor" },
    { file = "dger", item = "sazonaliza_cfuga_cmont" },
    { file = "confhd", item = "usina_existente" },
    { file = "exph", item = "data_entrada_operacao" },
    { file = "exph", item = "conjunto_maquina_entrada" },
  ]
  how = "Engolimento máximo na queda de operação: soma por conjunto de `n · vazao_nominal · (h_op / queda_nominal)^k` (k = 0,5 para Francis/Pelton, 0,2 para Kaplan), limitada por `potência instalada / (ρ_esp · h_op)` e multiplicada pela disponibilidade `(1 − teif/100) · (1 − ip/100)`. `h_op` é a queda líquida média entre `volume_minimo` e 65% do volume útil (regulação `M`) ou na cota de `volume_referencia` (`D`/`S`), descontados canal de fuga e perdas. Usina `EE` com entrada de máquinas em `exph.dat` declara a configuração final, com todas as máquinas em operação; a rampa até ela vai para `hydro_bounds.parquet`. Para usina com `CFUGA`/`CMONT` ou linha em `volref_saz.dat`, o valor é elevado ao máximo dos limites por estágio emitidos em `hydro_bounds.parquet`, pois o Novomodelo não admite limite por estágio acima do declarado."

  [[output.field]]
  path = "hydros[].generation.min_generation_mw"
  from = []
  status = "constant"
  how = "Sempre 0.0: a geração mínima por estágio de `ghmin.dat` é emitida em `constraints/hydro_bounds.parquet`."

  [[output.field]]
  path = "hydros[].generation.max_generation_mw"
  from = [
    { file = "hidr", item = "numero_conjuntos_maquinas" },
    { file = "hidr", item = "maquinas_conjunto_1 … maquinas_conjunto_5" },
    { file = "hidr", item = "potencia_nominal_conjunto_1 … potencia_nominal_conjunto_5" },
    { file = "modif", item = "POTEFE · potencia, conjunto" },
    { file = "modif", item = "NUMCNJ · numero" },
    { file = "modif", item = "NUMMAQ · numero_maquinas" },
    { file = "confhd", item = "usina_existente" },
    { file = "exph", item = "data_entrada_operacao" },
    { file = "exph", item = "conjunto_maquina_entrada" },
  ]
  how = "Potência instalada nominal: soma por conjunto de `maquinas_conjunto · potencia_nominal_conjunto` (potência do conjunto sobrescrita pelo registro permanente `POTEFE` de `modif.dat`), sem desconto de `teif`/`ip` (o teto GHmax da FPHA do NEWAVE). Usina `EE` com entrada de máquinas em `exph.dat` declara a configuração final: a de `modif.dat` no início do estudo mais as máquinas que entram, até o total de `hidr.dat`."

  [[output.field]]
  path = "hydros[].unit_groups[].id"
  from = []
  status = "constant"
  how = "Sempre 0: cada usina recebe um único grupo de unidades espelho."

  [[output.field]]
  path = "hydros[].unit_groups[].name"
  from = [ { file = "confhd", item = "nome_usina" } ]
  how = "Igual ao `name` da usina."

  [[output.field]]
  path = "hydros[].unit_groups[].bus_id"
  from = [
    { file = "confhd", item = "ree" },
    { file = "ree", item = "codigo" },
    { file = "ree", item = "submercado" },
    { file = "sistema", item = "custo_deficit · codigo_submercado" },
  ]
  status = "derived"
  how = "Id Novomodelo do submercado ao qual pertence o REE da usina (`ree` em `confhd.dat` → `submercado` em `ree.dat`). Os ids de barra seguem a ordem crescente dos códigos de submercado de `sistema.dat` e `ree.dat`."

  [[output.field]]
  path = "hydros[].unit_groups[].min_generation_mw"
  from = []
  status = "constant"
  how = "Sempre 0.0: espelha `generation.min_generation_mw`."

  [[output.field]]
  path = "hydros[].unit_groups[].max_generation_mw"
  from = [
    { file = "hidr", item = "numero_conjuntos_maquinas" },
    { file = "hidr", item = "maquinas_conjunto_1 … maquinas_conjunto_5" },
    { file = "hidr", item = "potencia_nominal_conjunto_1 … potencia_nominal_conjunto_5" },
    { file = "modif", item = "POTEFE · potencia, conjunto" },
    { file = "modif", item = "NUMCNJ · numero" },
    { file = "modif", item = "NUMMAQ · numero_maquinas" },
  ]
  how = "Espelha `generation.max_generation_mw` (grupo único, soma dos grupos igual ao envelope da usina)."

  [[output.field]]
  path = "hydros[].unit_groups[].min_turbined_m3s"
  from = []
  status = "constant"
  how = "Sempre 0.0: espelha `generation.min_turbined_m3s`."

  [[output.field]]
  path = "hydros[].unit_groups[].max_turbined_m3s"
  from = [
    { file = "hidr", item = "numero_conjuntos_maquinas" },
    { file = "hidr", item = "maquinas_conjunto_1 … maquinas_conjunto_5" },
    { file = "hidr", item = "vazao_nominal_conjunto_1 … vazao_nominal_conjunto_5" },
    { file = "hidr", item = "potencia_nominal_conjunto_1 … potencia_nominal_conjunto_5" },
    { file = "modif", item = "POTEFE · potencia, conjunto" },
    { file = "hidr", item = "queda_nominal_conjunto_1 … queda_nominal_conjunto_5" },
    { file = "hidr", item = "teif" },
    { file = "hidr", item = "ip" },
    { file = "hidr", item = "tipo_turbina" },
    { file = "hidr", item = "a0_volume_cota … a4_volume_cota" },
    { file = "modif", item = "VOLCOTA · coeficientes a0 a a4" },
    { file = "hidr", item = "canal_fuga_medio" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "modif", item = "CFUGA · nivel" },
    { file = "modif", item = "CMONT · nivel" },
    { file = "volref_saz", item = "valor" },
  ]
  how = "Espelha `generation.max_turbined_m3s`."

  [[output.field]]
  path = "hydros[].specific_productivity_mw_per_m3s_per_m"
  from = [ { file = "hidr", item = "produtibilidade_especifica" } ]
  how = "`produtibilidade_especifica` do cadastro, em MW/((m³/s)·m); nulo quando zero ou ausente."

  [[output.field]]
  path = "hydros[].evaporation"
  from = [ { file = "hidr", item = "evaporacao_JAN … evaporacao_DEZ" } ]
  how = "Nulo quando os doze coeficientes `evaporacao_*` do cadastro são zero; caso contrário, o bloco com `coefficients_mm` (e `reference_volumes_hm3` quando há referência sazonal)."

  [[output.field]]
  path = "hydros[].evaporation.coefficients_mm[]"
  from = [ { file = "hidr", item = "evaporacao_JAN … evaporacao_DEZ" } ]
  how = "Os doze coeficientes mensais de evaporação (mm), de janeiro a dezembro, tal como no cadastro."

  [[output.field]]
  path = "hydros[].evaporation.reference_volumes_hm3[]"
  when = "somente quando a usina tem evaporação e uma linha não nula em `volref_saz.dat`"
  from = [
    { file = "volref_saz", item = "mes" },
    { file = "volref_saz", item = "valor" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
  ]
  how = "Doze volumes absolutos (hm³), um por mês civil: `volume_minimo + valor` (volume útil sazonal de `volref_saz.dat`; 0 para mês ausente, isto é, operar em `volume_minimo`), limitado ao intervalo [`min_storage_hm3`, `max_storage_hm3`]."

  [[output.field]]
  path = "hydros[].tailrace.type"
  from = []
  status = "constant"
  how = "Sempre `polynomial`. O bloco `tailrace` só existe quando `canal_fuga_medio` é positivo; caso contrário é nulo."

  [[output.field]]
  path = "hydros[].tailrace.coefficients[]"
  from = [ { file = "hidr", item = "canal_fuga_medio" } ]
  how = "Polinômio de grau zero: o único coeficiente é `canal_fuga_medio` (m), o nível médio do canal de fuga que o Novomodelo subtrai da cota de montante ao derivar ρ_eq."

  [[output.field]]
  path = "hydros[].diversion"
  from = []
  status = "null"
  how = "Sempre nulo: os desvios de água de `dsvagua.dat` são convertidos como retirada por estágio (`water_withdrawal_m3s` em `constraints/hydro_bounds.parquet`), não como canal de desvio."

  [[output.field]]
  path = "hydros[].filling"
  from = [
    { file = "exph", item = "data_inicio_enchimento" },
    { file = "exph", item = "duracao_enchimento" },
  ]
  how = "Nulo para usinas existentes e para usina NE cujo `duracao_enchimento` é zero; usina NE admitida com enchimento de volume morto recebe o bloco com `start_stage_id` e `filling_min_rate_m3s`."

  [[output.field]]
  path = "hydros[].filling.start_stage_id"
  when = "somente para usina NE com registro de enchimento em `exph.dat` e `duracao_enchimento` maior que zero"
  from = [
    { file = "exph", item = "data_inicio_enchimento" },
    { file = "dger", item = "ano_inicio_estudo" },
    { file = "dger", item = "mes_inicio_estudo" },
  ]
  status = "derived"
  how = "Estágio 0-based do mês de `data_inicio_enchimento`, limitado a 0 quando anterior ao início do estudo."

  [[output.field]]
  path = "hydros[].filling.filling_min_rate_m3s"
  when = "somente para usina NE com registro de enchimento em `exph.dat` e `duracao_enchimento` maior que zero"
  from = [
    { file = "exph", item = "volume_morto" },
    { file = "exph", item = "data_inicio_enchimento" },
    { file = "exph", item = "duracao_enchimento" },
    { file = "hidr", item = "volume_minimo" },
    { file = "dger", item = "ano_inicio_estudo" },
    { file = "dger", item = "mes_inicio_estudo" },
  ]
  how = "Taxa constante (m³/s) que leva o armazenamento de `volume_morto` % de `min_storage_hm3` até `min_storage_hm3` ao longo da janela de enchimento: volume restante dividido pela soma, nos estágios da janela dentro do horizonte, do fator hm³ por (m³/s) de cada mês civil."

  [[output.field]]
  path = "hydros[].efficiency"
  from = [
    { file = "dger", item = "funcao_producao_uhe" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "hidr", item = "a0_volume_cota … a4_volume_cota" },
    { file = "modif", item = "VOLCOTA · coeficientes a0 a a4" },
  ]
  how = "Nulo para usinas fora da FPHA (caso linear ou usina sem polinômio cota-volume / produtibilidade específica / capacidade nominal); para usinas `fpha`, o bloco com `type` e `value`."

  [[output.field]]
  path = "hydros[].efficiency.type"
  from = []
  status = "constant"
  how = "Sempre `constant`."

  [[output.field]]
  path = "hydros[].efficiency.value"
  from = [ { file = "hidr", item = "produtibilidade_especifica" } ]
  how = "Rendimento adimensional da turbina `produtibilidade_especifica / 0,00981` (ρ_esp do NEWAVE já embute g/1000), limitado a 1,0 com aviso quando o cadastro implica valor maior."

  [[output.field]]
  path = "hydros[].hydraulic_losses"
  from = [
    { file = "hidr", item = "tipo_perda" },
    { file = "hidr", item = "perdas" },
  ]
  how = "Nulo quando `tipo_perda` não é 1 nem 2 ou `perdas` não é positivo; caso contrário, o bloco com `type` e `value` ou `value_m`."

  [[output.field]]
  path = "hydros[].hydraulic_losses.type"
  from = [ { file = "hidr", item = "tipo_perda" } ]
  how = "`factor` para `tipo_perda = 1` (perda percentual da queda bruta); `constant` para `tipo_perda = 2` (perda em metros)."

  [[output.field]]
  path = "hydros[].hydraulic_losses.value"
  when = "somente quando `tipo_perda = 1`"
  from = [ { file = "hidr", item = "perdas" } ]
  how = "`perdas / 100`, fração da queda bruta perdida."

  [[output.field]]
  path = "hydros[].hydraulic_losses.value_m"
  from = [ { file = "hidr", item = "perdas" } ]
  how = "`perdas` em metros, quando `tipo_perda = 2`."

  [[output.field]]
  path = "hydros[].penalties"
  from = []
  status = "null"
  how = "Sempre nulo: as penalidades de `penalid.dat` são convertidas uma única vez, com a produtibilidade média do SIN, para os valores globais de `penalties.json`, sem sobrescrita por usina."

  [[output.field]]
  path = "hydros[].entry_stage_id"
  from = [
    { file = "exph", item = "data_inicio_enchimento" },
    { file = "exph", item = "duracao_enchimento" },
    { file = "dger", item = "ano_inicio_estudo" },
    { file = "dger", item = "mes_inicio_estudo" },
  ]
  status = "derived"
  how = "Nulo para usinas existentes. Usina NE em enchimento: estágio 0-based em que o enchimento termina (`data_inicio_enchimento` mais `duracao_enchimento` meses, nunca antes de `start_stage_id`), podendo cair além do horizonte."

  [[output.field]]
  path = "hydros[].exit_stage_id"
  from = []
  status = "null"
  how = "Sempre nulo: usinas hidrelétricas do NEWAVE não saem de operação dentro do horizonte."

# ---------------------------------------------------------------------------
# system/hydro_production_models.json
# ---------------------------------------------------------------------------
[[output]]
path = "system/hydro_production_models.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/newave/converters/hydro/productivity.py"
reads = [
  { file = "dger" },
  { file = "hidr" },
  { file = "modif" },
  { file = "confhd" },
  { file = "exph" },
  { file = "volref_saz" },
  { file = "tratamento_fpha" },
]
summary = "Uma entrada por usina ativa selecionando o modelo de produção (FPHA ou produtividade constante) e o volume de referência; nenhuma produtibilidade numérica é escrita aqui, ela vai para `system/hydro_energy_productivity.parquet`."

  [[output.field]]
  path = "production_models[].hydro_id"
  from = [ { file = "confhd", item = "codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo da usina (mesma numeração de `hydros[].id`)."

  [[output.field]]
  path = "production_models[].selection_mode"
  from = [
    { file = "dger", item = "funcao_producao_uhe" },
    { file = "volref_saz", item = "valor" },
  ]
  how = "`seasonal` quando o caso é FPHA (`funcao_producao_uhe = 0`) e a usina tem linha não nula em `volref_saz.dat` (FPHA ou não, pois o Novomodelo lê o volume de referência da usina de jusante para o remanso); `stage_ranges` nos demais casos."

  [[output.field]]
  path = "production_models[].stage_ranges[].start_stage_id"
  from = []
  status = "constant"
  how = "Sempre 0: uma única faixa novomodelo todo o horizonte."

  [[output.field]]
  path = "production_models[].stage_ranges[].end_stage_id"
  from = []
  status = "null"
  how = "Sempre nulo: a faixa única é aberta até o fim do horizonte."

  [[output.field]]
  path = "production_models[].stage_ranges[].model"
  from = [
    { file = "dger", item = "funcao_producao_uhe" },
    { file = "hidr", item = "a0_volume_cota … a4_volume_cota" },
    { file = "modif", item = "VOLCOTA · coeficientes a0 a a4" },
    { file = "hidr", item = "produtibilidade_especifica" },
  ]
  how = "`fpha` para usina elegível à FPHA (mesmo critério de `hydros[].generation.model`); `constant_productivity` caso contrário."

  [[output.field]]
  path = "production_models[].stage_ranges[].fpha_config.source"
  from = []
  status = "constant"
  how = "Sempre `computed`: o Novomodelo ajusta a FPHA a partir da geometria, das curvas de jusante e do rendimento. Presente só em faixas `fpha`."

  [[output.field]]
  path = "production_models[].stage_ranges[].fpha_config.fitting_window.volume_min_hm3"
  from = [
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_referencia" },
    { file = "modif", item = "VOLMIN · volume" },
  ]
  how = "Limite inferior da janela de ajuste da FPHA: `volume_minimo` para regulação `M`; `volume_referencia` para `D`/`S` (ajuste em volume único, como o NEWAVE)."

  [[output.field]]
  path = "production_models[].stage_ranges[].fpha_config.fitting_window.volume_max_hm3"
  from = [
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_maximo" },
    { file = "hidr", item = "volume_referencia" },
    { file = "modif", item = "VOLMAX · volume" },
  ]
  how = "Limite superior da janela de ajuste: `volume_maximo` para regulação `M`; `volume_referencia` para `D`/`S`."

  [[output.field]]
  path = "production_models[].stage_ranges[].reference_volume.percentile"
  from = []
  status = "constant"
  how = "Sempre 0.65 (altura a 65% do volume útil, convenção do NEWAVE e padrão do Novomodelo). Presente só em faixas `fpha` de usina sem linha em `volref_saz.dat`."

  [[output.field]]
  path = "production_models[].default_model"
  when = "somente em caso FPHA para usina com linha não nula em `volref_saz.dat`"
  from = []
  status = "constant"
  how = "Sempre `constant_productivity`: as doze estações são listadas, logo o padrão nunca é consultado."

  [[output.field]]
  path = "production_models[].seasons[].season_id"
  when = "somente em caso FPHA para usina com linha não nula em `volref_saz.dat`"
  from = [ { file = "volref_saz", item = "mes" } ]
  status = "derived"
  how = "`mes − 1` (0 = janeiro), alinhado ao mapa de estações de `stages.json`."

  [[output.field]]
  path = "production_models[].seasons[].model"
  when = "somente em caso FPHA para usina com linha não nula em `volref_saz.dat`"
  from = [
    { file = "dger", item = "funcao_producao_uhe" },
    { file = "hidr", item = "a0_volume_cota … a4_volume_cota" },
    { file = "modif", item = "VOLCOTA · coeficientes a0 a a4" },
    { file = "hidr", item = "produtibilidade_especifica" },
  ]
  how = "`fpha` ou `constant_productivity`, igual em todas as estações, pelo critério de elegibilidade da usina."

  [[output.field]]
  path = "production_models[].seasons[].reference_volume.volume_hm3"
  when = "somente em caso FPHA para usina com linha não nula em `volref_saz.dat`"
  from = [
    { file = "volref_saz", item = "valor" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "modif", item = "VOLMIN · volume" },
    { file = "modif", item = "VOLMAX · volume" },
  ]
  how = "Volume de referência absoluto do mês: `volume_minimo + valor` (volume útil sazonal; mês ausente ou zero significa operar em `volume_minimo`), limitado a [`volume_minimo`, `volume_maximo`]."

  [[output.field]]
  path = "production_models[].seasons[].fpha_config.source"
  when = "somente em caso FPHA para usina `fpha` com linha não nula em `volref_saz.dat`"
  from = []
  status = "constant"
  how = "Sempre `computed`."

  [[output.field]]
  path = "production_models[].seasons[].fpha_config.fitting_window.volume_min_hm3"
  when = "somente em caso FPHA para usina `fpha` com linha não nula em `volref_saz.dat`"
  from = [
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_referencia" },
    { file = "modif", item = "VOLMIN · volume" },
  ]
  how = "Igual a `stage_ranges[].fpha_config.fitting_window.volume_min_hm3`, repetido em cada estação."

  [[output.field]]
  path = "production_models[].seasons[].fpha_config.fitting_window.volume_max_hm3"
  when = "somente em caso FPHA para usina `fpha` com linha não nula em `volref_saz.dat`"
  from = [
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_maximo" },
    { file = "hidr", item = "volume_referencia" },
    { file = "modif", item = "VOLMAX · volume" },
  ]
  how = "Igual a `stage_ranges[].fpha_config.fitting_window.volume_max_hm3`, repetido em cada estação."

  [[output.field]]
  path = "fpha_plane_reduction.method"
  when = "somente em caso FPHA com ao menos uma usina `fpha` e `tratamento-fpha.csv` com linha de método ativa"
  from = [ { file = "tratamento_fpha", item = "HIDRELETRICA-FPHA-METODO-REDUCAO-CORTES-ANGULO-PADRAO / HIDRELETRICA-FPHA-METODO-REDUCAO-CORTES-DISTANCIA-PADRAO" } ]
  how = "`angle` para a linha `…-ANGULO-PADRAO`, `distance` para `…-DISTANCIA-PADRAO`; linhas iniciadas por `&` são comentários. Com mais de uma linha ativa, a primeira vale e um aviso é emitido."

  [[output.field]]
  path = "fpha_plane_reduction.tolerance_deg"
  when = "somente quando o método ativo em `tratamento-fpha.csv` é o de ângulo"
  from = [ { file = "tratamento_fpha", item = "HIDRELETRICA-FPHA-METODO-REDUCAO-CORTES-ANGULO-PADRAO" } ]
  how = "Tolerância angular (graus) lida após o `;` da linha."

  [[output.field]]
  path = "fpha_plane_reduction.tolerance_pct"
  when = "somente quando o método ativo em `tratamento-fpha.csv` é o de distância"
  from = [ { file = "tratamento_fpha", item = "HIDRELETRICA-FPHA-METODO-REDUCAO-CORTES-DISTANCIA-PADRAO" } ]
  how = "Tolerância de distância lida após o `;` da linha."

  [[output.field]]
  path = "fpha_plane_reduction.n_samples"
  when = "somente quando o método ativo em `tratamento-fpha.csv` é o de distância"
  from = []
  status = "constant"
  how = "Sempre 100: o NEWAVE não define o número de amostras da distância quadrática média exigido pelo Novomodelo, e a ponte fornece este padrão."

# ---------------------------------------------------------------------------
# system/hydro_geometry.parquet
# ---------------------------------------------------------------------------
[[output]]
path = "system/hydro_geometry.parquet"
kind = "parquet"
when = ""
module = "src/novomodelo_bridge/newave/converters/hydro/geometry.py"
reads = [
  { file = "hidr" },
  { file = "modif" },
  { file = "confhd" },
  { file = "exph" },
]
summary = "Curva volume-cota-área amostrada por usina ativa: 100 pontos uniformes entre `volume_minimo` e `volume_maximo` (um único ponto quando iguais); usinas com polinômio cota-volume nulo são omitidas com aviso."

  [[output.field]]
  path = "hydro_id"
  from = [ { file = "confhd", item = "codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo da usina, repetido em cada ponto amostrado; a tabela é ordenada por usina e depois por volume."

  [[output.field]]
  path = "volume_hm3"
  from = [
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "modif", item = "VOLMIN · volume" },
    { file = "modif", item = "VOLMAX · volume" },
  ]
  how = "Grade de 100 volumes igualmente espaçados em [`volume_minimo`, `volume_maximo`] do cadastro corrigido por `modif.dat`; um único ponto em `volume_minimo` quando a faixa é nula. Não aplica o colapso das usinas `D`/`S` feito em `hydros.json`."

  [[output.field]]
  path = "height_m"
  from = [
    { file = "hidr", item = "a0_volume_cota … a4_volume_cota" },
    { file = "modif", item = "VOLCOTA · coeficientes a0 a a4" },
  ]
  how = "Cota de montante (m): polinômio `a0 + a1·V + a2·V² + a3·V³ + a4·V⁴` (coeficientes sobrescritos pelo registro permanente `VOLCOTA` de `modif.dat`) avaliado em cada volume, com valores negativos levados a 0."

  [[output.field]]
  path = "area_km2"
  from = [
    { file = "hidr", item = "a0_cota_area … a4_cota_area" },
    { file = "modif", item = "COTAREA · coeficientes a0 a a4" },
  ]
  how = "Área do espelho d'água (km²): polinômio cota-área (coeficientes sobrescritos pelo registro permanente `COTAREA` de `modif.dat`) avaliado na cota calculada, com valores negativos levados a 0."

# ---------------------------------------------------------------------------
# system/hydro_energy_productivity.parquet
# ---------------------------------------------------------------------------
[[output]]
path = "system/hydro_energy_productivity.parquet"
kind = "parquet"
when = ""
module = "src/novomodelo_bridge/newave/converters/hydro/productivity.py"
reads = [
  { file = "hidr" },
  { file = "modif" },
  { file = "confhd" },
  { file = "exph" },
  { file = "volref_saz" },
  { file = "dger" },
]
summary = "Produtibilidade equivalente ρ_eq (MW por m³/s) por usina ativa, fonte única do coeficiente `geração = ρ_eq · Q` (inclusive para usinas FPHA): uma linha padrão com `stage_id` nulo por usina sem variação temporal, ou uma linha por estágio para usina com `CFUGA`/`CMONT` em `modif.dat` ou linha em `volref_saz.dat`."

  [[output.field]]
  path = "hydro_id"
  from = [ { file = "confhd", item = "codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo da usina."

  [[output.field]]
  path = "stage_id"
  from = [
    { file = "modif", item = "CFUGA · data_inicio" },
    { file = "modif", item = "CMONT · data_inicio" },
    { file = "volref_saz", item = "valor" },
    { file = "dger", item = "ano_inicio_estudo" },
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "num_anos_estudo" },
    { file = "dger", item = "num_anos_pos_estudo" },
  ]
  status = "derived"
  how = "Nulo (valor padrão para todo o horizonte) quando a usina não tem `CFUGA`/`CMONT` nem linha não nula em `volref_saz.dat`; caso contrário, um estágio 0-based por mês do estudo e do pós-estudo."

  [[output.field]]
  path = "equivalent_productivity_mw_per_m3s"
  from = [
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "hidr", item = "a0_volume_cota … a4_volume_cota" },
    { file = "modif", item = "VOLCOTA · coeficientes a0 a a4" },
    { file = "hidr", item = "canal_fuga_medio" },
    { file = "hidr", item = "tipo_perda" },
    { file = "hidr", item = "perdas" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "hidr", item = "volume_referencia" },
    { file = "modif", item = "VOLMIN · volume" },
    { file = "modif", item = "VOLMAX · volume" },
    { file = "modif", item = "CFUGA · nivel" },
    { file = "modif", item = "CMONT · nivel" },
    { file = "volref_saz", item = "valor" },
    { file = "dger", item = "sazonaliza_cfuga_cmont" },
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "confhd", item = "codigo_usina_jusante" },
    { file = "confhd", item = "posto" },
  ]
  how = "`ρ_esp · (cota(V_ref) − canal de fuga − perdas)`, com V_ref = `volume_minimo` + 65% do volume útil para regulação `M` (altura 65 do NEWAVE) e `volume_referencia` para `D`/`S`. Por estágio, `CFUGA` substitui o canal de fuga e `CMONT` fixa a cota de montante (função degrau a partir de `data_inicio`, repetida sazonalmente após o último registro se `sazonaliza_cfuga_cmont = 1`), e a linha de `volref_saz.dat` fixa V_ref = `volume_minimo + valor` do mês civil. Soma-se a ρ_eq das usinas fictícias atravessadas na cascata (zero nos decks reais)."

  [[output.field]]
  path = "reference_outflow_m3s"
  from = []
  status = "null"
  how = "Sempre nulo: o volume de referência é declarado em `system/hydro_production_models.json`, não por vazão de referência."

  [[output.field]]
  path = "specific_productivity_mw_per_m3s_per_m"
  from = []
  status = "null"
  how = "Sempre nulo aqui: a produtibilidade específica é declarada em `hydros[].specific_productivity_mw_per_m3s_per_m`."

# ---------------------------------------------------------------------------
# system/tailrace_curves.parquet
# ---------------------------------------------------------------------------
[[output]]
path = "system/tailrace_curves.parquet"
kind = "parquet"
when = "somente quando o caso traz `polinjus.csv` e ao menos um segmento pertence a uma usina convertida"
module = "src/novomodelo_bridge/newave/converters/tailrace.py"
reads = [
  { file = "polinjus" },
  { file = "confhd" },
  { file = "hidr" },
  { file = "exph" },
]
summary = "Famílias de curvas de nível de jusante (polinômios por partes na vazão defluente total) de `polinjus.csv`, uma linha por segmento, ordenadas por (`hydro_id`, `family_id`, `segment_id`); os índices 1-based do NEWAVE são mantidos e segmentos de usinas fora do mapa de ids (fictícias) são descartados."

  [[output.field]]
  path = "hydro_id"
  from = [ { file = "polinjus", item = "HIDRELETRICA-CURVAJUSANTE-POLINOMIOPORPARTES-SEGMENTO · codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo da usina correspondente ao `codigo_usina` do segmento."

  [[output.field]]
  path = "family_id"
  from = [ { file = "polinjus", item = "HIDRELETRICA-CURVAJUSANTE-POLINOMIOPORPARTES-SEGMENTO · indice_familia" } ]
  how = "`indice_familia` tal como no arquivo (1-based); o Novomodelo o trata como chave opaca de agrupamento por usina."

  [[output.field]]
  path = "downstream_reference_level_m"
  from = [ { file = "polinjus", item = "HIDRELETRICA-CURVAJUSANTE · nivel_montante_referencia" } ]
  how = "Nível de referência da usina de jusante que identifica a família (`nivel_montante_referencia` do registro de família, associado ao segmento por `codigo_usina` e `indice_familia`); nulo quando o registro de família não existe."

  [[output.field]]
  path = "segment_id"
  from = [ { file = "polinjus", item = "HIDRELETRICA-CURVAJUSANTE-POLINOMIOPORPARTES-SEGMENTO · indice_polinomio" } ]
  how = "`indice_polinomio` tal como no arquivo (1-based)."

  [[output.field]]
  path = "outflow_min_m3s"
  from = [ { file = "polinjus", item = "HIDRELETRICA-CURVAJUSANTE-POLINOMIOPORPARTES-SEGMENTO · limite_inferior_vazao_jusante" } ]
  how = "Limite inferior de vazão defluente (m³/s) do segmento, sem transformação."

  [[output.field]]
  path = "outflow_max_m3s"
  from = [ { file = "polinjus", item = "HIDRELETRICA-CURVAJUSANTE-POLINOMIOPORPARTES-SEGMENTO · limite_superior_vazao_jusante" } ]
  how = "Limite superior de vazão defluente (m³/s) do segmento, sem transformação."

  [[output.field]]
  path = "coefficient_0"
  from = [ { file = "polinjus", item = "HIDRELETRICA-CURVAJUSANTE-POLINOMIOPORPARTES-SEGMENTO · coeficiente_a0" } ]
  how = "`coeficiente_a0` do polinômio do segmento, sem transformação."

  [[output.field]]
  path = "coefficient_1"
  from = [ { file = "polinjus", item = "HIDRELETRICA-CURVAJUSANTE-POLINOMIOPORPARTES-SEGMENTO · coeficiente_a1" } ]
  how = "`coeficiente_a1` do polinômio do segmento, sem transformação."

  [[output.field]]
  path = "coefficient_2"
  from = [ { file = "polinjus", item = "HIDRELETRICA-CURVAJUSANTE-POLINOMIOPORPARTES-SEGMENTO · coeficiente_a2" } ]
  how = "`coeficiente_a2` do polinômio do segmento, sem transformação."

  [[output.field]]
  path = "coefficient_3"
  from = [ { file = "polinjus", item = "HIDRELETRICA-CURVAJUSANTE-POLINOMIOPORPARTES-SEGMENTO · coeficiente_a3" } ]
  how = "`coeficiente_a3` do polinômio do segmento, sem transformação."

  [[output.field]]
  path = "coefficient_4"
  from = [ { file = "polinjus", item = "HIDRELETRICA-CURVAJUSANTE-POLINOMIOPORPARTES-SEGMENTO · coeficiente_a4" } ]
  how = "`coeficiente_a4` do polinômio do segmento, sem transformação."

# ---------------------------------------------------------------------------
# constraints/hydro_bounds.parquet (conditional)
# ---------------------------------------------------------------------------
[[output]]
path = "constraints/hydro_bounds.parquet"
kind = "parquet"
when = "somente quando ao menos uma fonte produz linhas: `dsvagua.dat` com desvios (e `outros_usos_da_agua` de `dger.dat` diferente de 0), registros temporais `VMAXT`/`VMINT`/`TURBMAXT`/`TURBMINT`/`VAZMINT` em `modif.dat`, `ghmin.dat`, usina NE com enchimento ou usina EE com entrada de máquinas em `exph.dat`, ou usina com `CFUGA`/`CMONT`/linha em `volref_saz.dat`"
module = "src/novomodelo_bridge/newave/converters/hydro/bounds.py"
reads = [
  { file = "dsvagua" },
  { file = "dger" },
  { file = "confhd" },
  { file = "hidr" },
  { file = "modif" },
  { file = "ghmin" },
  { file = "exph" },
  { file = "volref_saz" },
]
summary = "Limites por (usina, estágio) que apertam o envelope de `hydros.json`, resultado da junção externa de três tabelas: retirada de água (`dsvagua.dat`), limites temporais (`modif.dat`, `ghmin.dat`, rampa de máquinas de `exph.dat`) e turbinamento máximo corrigido pela queda por estágio (`CFUGA`/`CMONT`/`volref_saz.dat`). Colunas de máximo acima do valor declarado em `hydros.json` são limitadas ao declarado, com aviso. A coluna `max_generation_mw` só existe quando há usina NE em enchimento ou usina EE com entrada de máquinas."

  [[output.field]]
  path = "hydro_id"
  from = [ { file = "confhd", item = "codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo da usina. Desvios de `dsvagua.dat` em usina NC são atribuídos à primeira usina existente a jusante na cadeia `codigo_usina_jusante`; desvios em usina fictícia são descartados."

  [[output.field]]
  path = "stage_id"
  from = [
    { file = "dger", item = "ano_inicio_estudo" },
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "num_anos_estudo" },
    { file = "dger", item = "num_anos_pos_estudo" },
    { file = "dsvagua", item = "data" },
    { file = "modif", item = "VMAXT · data_inicio" },
    { file = "ghmin", item = "data" },
    { file = "exph", item = "data_entrada_operacao" },
  ]
  status = "derived"
  how = "Estágio 0-based contado a partir de `mes_inicio_estudo`/`ano_inicio_estudo`, cobrindo estudo e pós-estudo; cada fonte ocupa os estágios em que tem valor ativo e a junção mantém as linhas de qualquer uma delas."

  [[output.field]]
  path = "water_withdrawal_m3s"
  from = [
    { file = "dsvagua", item = "codigo_usina" },
    { file = "dsvagua", item = "data" },
    { file = "dsvagua", item = "valor" },
    { file = "dger", item = "outros_usos_da_agua" },
    { file = "confhd", item = "codigo_usina_jusante" },
  ]
  how = "Retirada de água (m³/s) de `dsvagua.dat`: soma de `valor` por (`codigo_usina`, `data`) com o sinal invertido (no NEWAVE retirada é negativa). Ignorado quando `outros_usos_da_agua = 0`. Estágios de pós-estudo repetem o padrão mensal do último ano civil presente no arquivo para a usina. Nulo nas linhas vindas das demais fontes."

  [[output.field]]
  path = "min_storage_hm3"
  from = [
    { file = "modif", item = "VMINT · volume, unidade" },
    { file = "modif", item = "VMINT · data_inicio" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "modif", item = "VOLMIN · volume" },
    { file = "modif", item = "VOLMAX · volume" },
    { file = "dger", item = "sazonaliza_vmint" },
  ]
  how = "Armazenamento mínimo (hm³) de `VMINT`: o `volume` em hm³ quando `unidade` = h ou, com `%`, `volume_minimo + (volume / 100) · volume útil`; função degrau a partir de `data_inicio` até o próximo registro; valor maior ou igual a 99990 restaura o padrão (linha sem valor). No pós-estudo repete o padrão mensal do último ano de estudo se `sazonaliza_vmint = 1`, senão congela o último estágio. Ignorado para usina sem volume útil."

  [[output.field]]
  path = "max_storage_hm3"
  from = [
    { file = "modif", item = "VMAXT · volume, unidade" },
    { file = "modif", item = "VMAXT · data_inicio" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "modif", item = "VOLMIN · volume" },
    { file = "modif", item = "VOLMAX · volume" },
    { file = "dger", item = "sazonaliza_vmaxt" },
  ]
  how = "Armazenamento máximo (hm³) de `VMAXT` (volume de espera): o `volume` em hm³ quando `unidade` = h ou, com `%`, `volume_minimo + (volume / 100) · volume útil`; função degrau a partir de `data_inicio`; valor maior ou igual a 99990 restaura o padrão. No pós-estudo repete o padrão mensal do último ano de estudo se `sazonaliza_vmaxt = 1`, senão congela o último estágio."

  [[output.field]]
  path = "min_turbined_m3s"
  from = [
    { file = "dger", item = "restricao_turbinamento" },
    { file = "modif", item = "TURBMINT · turbinamento" },
    { file = "modif", item = "TURBMINT · data_inicio" },
  ]
  how = "Turbinamento mínimo (m³/s) de `TURBMINT`, valor absoluto em função degrau a partir de `data_inicio`; valor maior ou igual a 99990 (família 99999) restaura o padrão. No pós-estudo congela o último estágio de estudo."

  [[output.field]]
  path = "max_turbined_m3s"
  from = [
    { file = "dger", item = "restricao_turbinamento" },
    { file = "modif", item = "TURBMAXT · turbinamento" },
    { file = "modif", item = "TURBMAXT · data_inicio" },
    { file = "modif", item = "CFUGA · nivel" },
    { file = "modif", item = "CMONT · nivel" },
    { file = "volref_saz", item = "valor" },
    { file = "dger", item = "sazonaliza_cfuga_cmont" },
    { file = "hidr", item = "maquinas_conjunto_1 … maquinas_conjunto_5" },
    { file = "hidr", item = "vazao_nominal_conjunto_1 … vazao_nominal_conjunto_5" },
    { file = "hidr", item = "potencia_nominal_conjunto_1 … potencia_nominal_conjunto_5" },
    { file = "modif", item = "POTEFE · potencia, conjunto" },
    { file = "hidr", item = "queda_nominal_conjunto_1 … queda_nominal_conjunto_5" },
    { file = "hidr", item = "teif" },
    { file = "hidr", item = "ip" },
    { file = "hidr", item = "tipo_turbina" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "exph", item = "data_entrada_operacao" },
    { file = "exph", item = "conjunto_maquina_entrada" },
    { file = "exph", item = "data_inicio_enchimento" },
    { file = "exph", item = "duracao_enchimento" },
  ]
  how = "Três origens, nesta precedência: (1) `TURBMAXT` de `modif.dat`, valor absoluto em degrau (valor maior ou igual a 99990 restaura o padrão; pós-estudo congelado); (2) para usina NE em enchimento, o engolimento corrigido pela queda com apenas as máquinas já em operação (`data_entrada_operacao` por conjunto, nunca antes do fim do enchimento), 0 antes de entrar em operação, e esta linha prevalece sobre qualquer outra no mesmo estágio; (3) onde ainda vazio, o engolimento corrigido pela queda do estágio (`h = ρ_eq / ρ_esp`, com `CFUGA`/`CMONT` e `volref_saz.dat`), pela mesma fórmula de `hydros[].generation.max_turbined_m3s`, com as máquinas em operação no estágio para usina `EE`; usina `EE` sem queda por estágio recebe linha só nos estágios anteriores à entrada da última máquina de `exph.dat`, na mesma queda de referência do valor declarado. Valores acima do declarado em `hydros.json` são reduzidos ao declarado."

  [[output.field]]
  path = "min_outflow_m3s"
  from = [
    { file = "dger", item = "desconsidera_vazao_minima" },
    { file = "modif", item = "VAZMINT · vazao" },
    { file = "modif", item = "VAZMINT · data_inicio" },
    { file = "modif", item = "VAZMINT · periodo" },
  ]
  how = "Vazão defluente mínima (m³/s) de `VAZMINT`, valor absoluto em função degrau a partir de `data_inicio`; valor maior ou igual a 99990 (família 99999) restaura o padrão. Registros com ano `PRE` ou `POS` formam degraus sobre um ano que se repete: o valor `PRE` vigente no mês anterior ao início do estudo vale até o primeiro registro datado, e os degraus `POS` definem cada mês do pós-estudo. Sem `POS`, o pós-estudo congela o último estágio de estudo."

  [[output.field]]
  path = "min_generation_mw"
  from = [
    { file = "dger", item = "considera_ghmin" },
    { file = "ghmin", item = "codigo_usina" },
    { file = "ghmin", item = "data" },
    { file = "ghmin", item = "patamar" },
    { file = "ghmin", item = "geracao" },
    { file = "exph", item = "data_inicio_enchimento" },
  ]
  how = "Geração mínima (MW) de `ghmin.dat`, somente linhas com `patamar = 0` (média dos patamares): função degrau a partir de `data` até o próximo registro; registros de ano 9999 valem para o mês civil correspondente no pós-estudo, e meses sem registro repetem o último ano de estudo. Linhas de rampa de usina NE em enchimento recebem 0."

  [[output.field]]
  path = "max_generation_mw"
  when = "somente quando o caso tem usina NE com registro de enchimento ou usina EE com entrada de máquinas em `exph.dat` (a coluna é omitida nos demais casos)"
  from = [
    { file = "exph", item = "data_entrada_operacao" },
    { file = "exph", item = "conjunto_maquina_entrada" },
    { file = "exph", item = "data_inicio_enchimento" },
    { file = "exph", item = "duracao_enchimento" },
    { file = "confhd", item = "usina_existente" },
    { file = "hidr", item = "maquinas_conjunto_1 … maquinas_conjunto_5" },
    { file = "hidr", item = "potencia_nominal_conjunto_1 … potencia_nominal_conjunto_5" },
    { file = "modif", item = "POTEFE · potencia, conjunto" },
    { file = "modif", item = "NUMCNJ · numero" },
    { file = "modif", item = "NUMMAQ · numero_maquinas" },
  ]
  how = "Potência nominal (MW) das máquinas em operação em cada estágio anterior à entrada da última máquina: soma de `n_online · potencia_nominal_conjunto` por conjunto. Para usina NE, 0 antes do fim do enchimento; para usina EE, a configuração de `modif.dat` no início do estudo mais as máquinas de `exph.dat` já entradas, na mesma linha de qualquer limite de `modif.dat`/`ghmin.dat` do estágio. Nulo nas demais linhas de `modif.dat`/`ghmin.dat`. Valores acima do declarado em `hydros.json` são reduzidos ao declarado."

# ===== frag_C_nw_scenarios_constraints =====
# Fragment C — NEWAVE: scenarios/* e constraints/generic_constraint*.
# Sem a chave `track` (escrita pelo assembler).

# ---------------------------------------------------------------------------
# scenarios/inflow_history.parquet
# ---------------------------------------------------------------------------
[[output]]
path = "scenarios/inflow_history.parquet"
kind = "parquet"
when = ""
module = "src/novomodelo_bridge/newave/converters/inflow_windows.py"
reads = [
  { file = "vazoes" },
  { file = "confhd" },
  { file = "dger" },
  { file = "hidr" },
  { file = "exph" },
]
summary = "Histórico de vazões incrementais mensais de `vazoes.dat`, uma linha por usina e mês-calendário, de janeiro do primeiro ano do histórico até o mês anterior ao início do estudo. A largura da matriz (320 ou 600 postos) não é declarada em nenhum lugar do deck e vem do tamanho do arquivo, descartada a largura cujo histórico, contado a partir de `ano_inicial_historico`, terminaria depois do ano de início do estudo; um tamanho que ainda sirva às duas larguras é lido como 320, com aviso."

  [[output.field]]
  path = "hydro_id"
  from = [
    { file = "confhd", item = "codigo_usina" },
    { file = "confhd", item = "posto" },
  ]
  status = "derived"
  how = "Id Novomodelo 0-based da usina (ordem crescente de `codigo_usina` entre as usinas ativas). A coluna de `vazoes.dat` é escolhida pelo `posto` da usina em `confhd.dat`; a série é emitida uma vez por posto, de modo que, se dois códigos ativos compartilham o posto, só o último na ordem de `confhd.dat` recebe linhas."

  [[output.field]]
  path = "start_date"
  from = [ { file = "dger", item = "ano_inicial_historico" } ]
  status = "derived"
  how = "Primeiro dia do mês. A linha i de `vazoes.dat` é tomada como o mês i contado a partir de janeiro de `ano_inicial_historico`."

  [[output.field]]
  path = "end_date"
  from = [ { file = "dger", item = "ano_inicial_historico" } ]
  status = "derived"
  how = "Primeiro dia do mês seguinte (janela semiaberta `[start_date, end_date)`)."

  [[output.field]]
  path = "value_m3s"
  from = [
    { file = "vazoes", item = "1..N (coluna por posto)" },
    { file = "confhd", item = "posto" },
    { file = "confhd", item = "codigo_usina_jusante" },
    { file = "confhd", item = "usina_existente" },
    { file = "dger", item = "ano_inicio_estudo" },
    { file = "dger", item = "mes_inicio_estudo" },
  ]
  how = "Vazão incremental (m³/s): vazão natural do posto menos a soma das vazões naturais dos postos imediatamente a montante na cascata de `confhd.dat` (usinas NE/NC no caminho são atravessadas; usinas NE com enchimento em `exph.dat` contam como nó da cascata). A série é truncada no mês anterior ao início do estudo."

# ---------------------------------------------------------------------------
# scenarios/inflow_seasonal_stats.parquet
# ---------------------------------------------------------------------------
[[output]]
path = "scenarios/inflow_seasonal_stats.parquet"
kind = "parquet"
when = ""
module = "src/novomodelo_bridge/newave/converters/stochastic.py"
reads = [
  { file = "vazoes" },
  { file = "confhd" },
  { file = "dger" },
  { file = "hidr" },
  { file = "exph" },
]
summary = "Média e desvio-padrão da vazão incremental histórica por usina e estágio, calculados por mês-calendário sobre `vazoes.dat`. A largura da matriz (320 ou 600 postos) não é declarada em nenhum lugar do deck e vem do tamanho do arquivo, descartada a largura cujo histórico, contado a partir de `ano_inicial_historico`, terminaria depois do ano de início do estudo; um tamanho que ainda sirva às duas larguras é lido como 320, com aviso."

  [[output.field]]
  path = "hydro_id"
  from = [ { file = "confhd", item = "codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo 0-based da usina (ordem crescente de `codigo_usina` entre as usinas ativas). Toda usina ativa recebe uma linha por estágio."

  [[output.field]]
  path = "stage_id"
  from = [
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "num_anos_estudo" },
    { file = "dger", item = "num_anos_pos_estudo" },
  ]
  status = "derived"
  how = "Índice 0-based do estágio ao longo de todo o horizonte (estudo mais pós-estudo) definido em `dger.dat`; o estágio determina o mês-calendário usado na estatística."

  [[output.field]]
  path = "mean_m3s"
  from = [
    { file = "vazoes", item = "1..N (coluna por posto)" },
    { file = "confhd", item = "posto" },
    { file = "confhd", item = "codigo_usina_jusante" },
    { file = "dger", item = "ano_inicial_historico" },
    { file = "dger", item = "ano_inicio_estudo" },
    { file = "dger", item = "mes_inicio_estudo" },
  ]
  how = "Média, ao longo dos anos do histórico (até o mês anterior ao início do estudo), da vazão incremental do posto da usina no mês-calendário do estágio. A vazão incremental é a natural menos as naturais dos postos imediatamente a montante em `confhd.dat`. Usina cujo posto não tem coluna em `vazoes.dat` recebe 0."

  [[output.field]]
  path = "std_m3s"
  from = [
    { file = "vazoes", item = "1..N (coluna por posto)" },
    { file = "confhd", item = "posto" },
    { file = "confhd", item = "codigo_usina_jusante" },
  ]
  how = "Desvio-padrão amostral (n − 1) da mesma amostra de vazões incrementais do mês-calendário; 0 quando há uma única observação ou quando o posto não tem série."

# ---------------------------------------------------------------------------
# scenarios/load_seasonal_stats.parquet
# ---------------------------------------------------------------------------
[[output]]
path = "scenarios/load_seasonal_stats.parquet"
kind = "parquet"
when = ""
module = "src/novomodelo_bridge/newave/converters/stochastic.py"
reads = [
  { file = "sistema" },
