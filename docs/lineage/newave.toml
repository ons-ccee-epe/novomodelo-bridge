  [[output.field]]
  path = "bus_id"
  from = [ { file = "sistema", item = "mercado_energia · codigo_submercado" } ]
  status = "derived"
  how = "Id Novomodelo 0-based do submercado (ordem crescente de `codigo_submercado`, incluindo submercados fictícios de `custo_deficit`). Submercados sem mercado em `sistema.dat` também recebem linhas."

  [[output.field]]
  path = "stage_id"
  from = [
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "num_anos_estudo" },
    { file = "dger", item = "num_anos_pos_estudo" },
  ]
  status = "derived"
  how = "Índice 0-based do estágio ao longo de todo o horizonte (estudo mais pós-estudo) de `dger.dat`."

  [[output.field]]
  path = "mean_mw"
  from = [
    { file = "dger", item = "considera_carga_adicional" },
    { file = "sistema", item = "mercado_energia · valor" },
    { file = "sistema", item = "mercado_energia · data" },
    { file = "c_adic", item = "valor" },
    { file = "c_adic", item = "data" },
    { file = "c_adic", item = "codigo_submercado" },
  ]
  how = "Mercado do submercado no mês (MWmédio, já convertido pelo leitor) somado às cargas adicionais de `c_adic.dat` do mesmo submercado e mês, todas as razões. Pós-estudo: valor do ano 9999 de `sistema.dat` ou, na falta, o do último ano de estudo no mesmo mês-calendário, mais a parcela POS de `c_adic.dat`. Submercado sem mercado (fictício) recebe 0."

  [[output.field]]
  path = "std_mw"
  from = []
  status = "constant"
  how = "Sempre 0.0: o mercado do NEWAVE é determinístico, sem dispersão por estágio."

