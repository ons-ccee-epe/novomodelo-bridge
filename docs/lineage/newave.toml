# ---------------------------------------------------------------------------
# constraints/generic_constraints.json  (condicional)
# ---------------------------------------------------------------------------
[[output]]
path = "constraints/generic_constraints.json"
kind = "json"
when = "somente quando alguma família gera restrições: curva de segurança (`curva.dat` presente, `curva_aversao` de `dger.dat` diferente de 0 e ao menos um REE com reservatório de regularização mensal com volume útil), restrições elétricas (`restricao-eletrica.csv` apontado por `indices.csv`, ou `re.dat`, com ao menos um limite válido) ou agrupamentos de intercâmbio (`agrint.dat` com grupos e limites); cada família só é lida se o flag correspondente de `dger.dat` estiver ligado (`agrupamento_livre`, `restricoes_eletricas`, `restricoes_eletricas_especiais`)"
module = "src/novomodelo_bridge/newave/converters/constraints.py"
reads = [
  { file = "curva" },
  { file = "dger" },
  { file = "confhd" },
  { file = "hidr" },
  { file = "modif" },
  { file = "ree" },
  { file = "exph" },
  { file = "restricao_eletrica" },
  { file = "re_dat" },
  { file = "sistema" },
  { file = "patamar" },
  { file = "penalid" },
  { file = "agrint" },
]
summary = "Restrições genéricas de três famílias concatenadas nesta ordem: curva de segurança (VminOP, uma por REE de `curva.dat`), restrições elétricas (`restricao-eletrica.csv` e `re.dat`) e agrupamentos de intercâmbio (`agrint.dat`). Os limites ficam em `constraints/generic_constraint_bounds.parquet`."

  [[output.field]]
  path = "constraints[].id"
  from = [
    { file = "curva", item = "curva_seguranca · codigo_ree" },
    { file = "restricao_eletrica", item = "RE · cod_rest" },
    { file = "re_dat", item = "usinas_conjuntos · conjunto" },
    { file = "agrint", item = "agrupamentos · agrupamento" },
  ]
  status = "derived"
  how = "Id 0-based contíguo, compartilhado pelas três famílias na ordem de emissão: uma restrição por REE da curva (ordem crescente de `codigo_ree`); para cada código de restrição elétrica (ordem crescente), uma restrição para o teto e, se houver piso, outra de mesmo nome; uma por grupo de `agrint.dat` (ordem crescente). Restrições sem nenhum limite não recebem id."

  [[output.field]]
  path = "constraints[].name"
  from = [
    { file = "ree", item = "nome" },
    { file = "restricao_eletrica", item = "RE · cod_rest" },
    { file = "re_dat", item = "usinas_conjuntos · conjunto" },
    { file = "agrint", item = "agrupamentos · agrupamento" },
  ]
  status = "derived"
  how = "`VminOP_<nome do REE>` (nome de `ree.dat`; o código quando ausente), `RE_<código>` ou `AGRINT_<grupo>`."

  [[output.field]]
  path = "constraints[].description"
  from = [
    { file = "curva", item = "curva_seguranca · codigo_ree" },
    { file = "ree", item = "nome" },
    { file = "restricao_eletrica", item = "RE · cod_rest" },
    { file = "re_dat", item = "usinas_conjuntos · conjunto" },
    { file = "agrint", item = "agrupamentos · agrupamento" },
  ]
  status = "derived"
  how = "Texto fixo em inglês com o código da origem: energia armazenada mínima do REE (código e nome), restrição elétrica (código) ou grupo de intercâmbio (número)."

  [[output.field]]
  path = "constraints[].expression"
  from = [
    { file = "dger", item = "agrupamento_livre · restricoes_eletricas · restricoes_eletricas_especiais" },
    { file = "confhd", item = "ree" },
    { file = "confhd", item = "codigo_usina" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "modif", item = "VOLMAX · volume" },
    { file = "modif", item = "VOLMIN · volume" },
    { file = "restricao_eletrica", item = "RE · formula" },
    { file = "re_dat", item = "usinas_conjuntos · codigo_usina" },
    { file = "agrint", item = "agrupamentos · submercado_de" },
    { file = "agrint", item = "agrupamentos · submercado_para" },
    { file = "agrint", item = "agrupamentos · coeficiente" },
    { file = "sistema", item = "limites_intercambio · submercado_de" },
    { file = "sistema", item = "limites_intercambio · submercado_para" },
  ]
  how = "Curva de segurança: soma de `@rho_acum_h<id> * hydro_storage_final(<id>)` sobre as usinas do REE (`ree` de `confhd.dat`) que são reservatório de regularização mensal (`tipo_regulacao` M) com volume útil positivo (após VOLMAX/VOLMIN de `modif.dat`) e produtibilidade acumulada positiva. Restrição elétrica: termos `ger_usih(cod)` da fórmula viram `hydro_generation(id)` e `ener_interc(A, B)` viram `line_direct(id)` ou `line_reverse(id)` conforme A < B, com o coeficiente e o sinal preservados; termos com usina fora do caso ou par sem linha em `sistema.dat` são descartados. Restrição só em `re.dat`: soma de `hydro_generation` das usinas do conjunto. Agrupamento: soma ponderada por `coeficiente` de `line_direct`/`line_reverse` do par de submercados."

  [[output.field]]
  path = "constraints[].slack.enabled"
  from = [
    { file = "penalid", item = "ELETRI · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
  ]
  status = "derived"
  how = "Verdadeiro para a curva de segurança; para restrições elétricas, verdadeiro quando há penalidade ELETRI em `penalid.dat` ou, na falta, custo de déficit positivo em `sistema.dat`; falso para agrupamentos de intercâmbio (limite rígido)."

  [[output.field]]
  path = "constraints[].slack.penalty"
  when = "somente quando `slack.enabled` é verdadeiro (curva de segurança e restrições elétricas)"
  from = [
    { file = "curva", item = "custos_penalidades · penalidade" },
    { file = "penalid", item = "ELETRI · valor_R$_MWh" },
    { file = "sistema", item = "custo_deficit · custo" },
  ]
  how = "Curva de segurança: `penalidade` do REE em `curva.dat` (R$/MWh); 1000.0 quando o REE não tem entrada ou o valor declarado não é positivo. Restrição elétrica: valor ELETRI de `penalid.dat` (primeiro patamar de penalidade) ou, na falta, 10 vezes o maior custo de déficit de `sistema.dat`."

# ---------------------------------------------------------------------------
# constraints/generic_constraint_bounds.parquet  (condicional)
# ---------------------------------------------------------------------------
[[output]]
path = "constraints/generic_constraint_bounds.parquet"
kind = "parquet"
when = "escrito junto com `constraints/generic_constraints.json`, sob a mesma condição"
module = "src/novomodelo_bridge/newave/converters/constraints.py"
reads = [
  { file = "curva" },
  { file = "dger" },
  { file = "confhd" },
  { file = "hidr" },
  { file = "modif" },
  { file = "ree" },
  { file = "exph" },
  { file = "restricao_eletrica" },
  { file = "re_dat" },
  { file = "sistema" },
  { file = "patamar" },
  { file = "penalid" },
  { file = "agrint" },
]
summary = "Limites por restrição, estágio e patamar das três famílias, concatenados na mesma ordem de `constraints/generic_constraints.json`. O sentido é dado pelo preenchimento: só `bound_lower` para maior-ou-igual, só `bound_upper` para menor-ou-igual."

  [[output.field]]
  path = "constraint_id"
  from = [
    { file = "curva", item = "curva_seguranca · codigo_ree" },
    { file = "restricao_eletrica", item = "RE · cod_rest" },
    { file = "re_dat", item = "usinas_conjuntos · conjunto" },
    { file = "agrint", item = "agrupamentos · agrupamento" },
  ]
  status = "derived"
  how = "O `id` da restrição em `constraints/generic_constraints.json`."

  [[output.field]]
  path = "stage_id"
  from = [
    { file = "curva", item = "curva_seguranca · data" },
    { file = "curva", item = "configuracoes_penalizacao" },
    { file = "restricao_eletrica", item = "RE-LIM-FORM-PER-PAT · PerIni" },
    { file = "restricao_eletrica", item = "RE-LIM-FORM-PER-PAT · PerFin" },
    { file = "restricao_eletrica", item = "RE-HORIZ-PER · PerIni" },
    { file = "restricao_eletrica", item = "RE-HORIZ-PER · PerFin" },
    { file = "re_dat", item = "restricoes · mes_inicio" },
    { file = "re_dat", item = "restricoes · ano_inicio" },
    { file = "re_dat", item = "restricoes · mes_fim" },
    { file = "re_dat", item = "restricoes · ano_fim" },
    { file = "ree", item = "mes_fim_individualizado" },
    { file = "ree", item = "ano_fim_individualizado" },
    { file = "agrint", item = "limites_agrupamentos · data_inicio" },
    { file = "agrint", item = "limites_agrupamentos · data_fim" },
    { file = "dger", item = "mes_inicio_estudo" },
    { file = "dger", item = "num_anos_estudo" },
    { file = "dger", item = "num_anos_pos_estudo" },
  ]
  status = "derived"
  how = "Índice 0-based do estágio de `dger.dat`. Curva: estágio da `data` de cada registro; estágios de estudo sem registro e o pós-estudo repetem o último ano por mês-calendário quando o terceiro campo da linha de penalização de `curva.dat` é 1, senão o pós-estudo congela o percentual do último estágio de estudo. Elétricas: somente os estágios cobertos pela janela de vigência do próprio limite — `mes_inicio`/`ano_inicio` a `mes_fim`/`ano_fim` no `re.dat`, `PerIni`/`PerFin` do `RE-LIM-FORM-PER-PAT` interseccionado com o `RE-HORIZ-PER` no CSV; estágio fora de toda janela declarada não recebe limite. Os limites de `re.dat` valem só a partir do fim do período individualizado (`ree.dat`). Agrupamentos: estágios de estudo cobertos pelos limites (fim aberto vai até o fim do horizonte) e congelamento do último estágio de estudo no pós-estudo."

  [[output.field]]
  path = "block_id"
  from = [
    { file = "restricao_eletrica", item = "RE-LIM-FORM-PER-PAT · pat" },
    { file = "re_dat", item = "restricoes · patamar" },
    { file = "patamar", item = "numero_patamares" },
  ]
  status = "derived"
  how = "Nulo para a curva de segurança (limite por estágio, todos os patamares). Elétricas: `pat` menos 1; `patamar` 0 de `re.dat` expande para todos os `numero_patamares` patamares. Agrupamentos: posição da coluna de limite na linha de `agrint.dat` (uma por patamar; colunas faltantes repetem a última)."

  [[output.field]]
  path = "bound_lower"
  from = [
    { file = "curva", item = "curva_seguranca · valor" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "hidr", item = "a0_volume_cota..a4_volume_cota" },
    { file = "modif", item = "VOLCOTA · coeficientes a0 a a4" },
    { file = "hidr", item = "canal_fuga_medio" },
    { file = "hidr", item = "tipo_perda" },
    { file = "hidr", item = "perdas" },
    { file = "hidr", item = "volume_referencia" },
    { file = "confhd", item = "codigo_usina_jusante" },
    { file = "modif", item = "VOLMAX · volume" },
    { file = "modif", item = "VOLMIN · volume" },
    { file = "modif", item = "CFUGA · nivel" },
    { file = "modif", item = "CMONT · nivel" },
    { file = "dger", item = "sazonaliza_cfuga_cmont" },
    { file = "restricao_eletrica", item = "RE-LIM-FORM-PER-PAT · lim_inf" },
  ]
  how = "Curva de segurança: energia armazenada mínima do REE em MWmês, `valor` (%) aplicado ao volume útil de cada reservatório do REE mais a parcela do volume mínimo, ambos ponderados pela produtibilidade acumulada integrada da cascata (vol. mínimo ao máximo, com FICT dobradas na usina real a montante, e CFUGA/CMONT de `modif.dat` por estágio), convertida de MW/(m³/s)·hm³ para MWmês com as horas reais do mês do estágio. Elétricas: `lim_inf` de `restricao-eletrica.csv` quando maior que −1e29 (valores abaixo são ilimitados). Nulo para tetos elétricos, `re.dat` e agrupamentos."

  [[output.field]]
  path = "bound_upper"
  from = [
    { file = "restricao_eletrica", item = "RE-LIM-FORM-PER-PAT · lim_sup" },
    { file = "re_dat", item = "restricoes · restricao" },
    { file = "agrint", item = "limites_agrupamentos · valor" },
  ]
  how = "Elétricas: `lim_sup` de `restricao-eletrica.csv` (quando maior que −1e29) nos estágios individualizados; a partir do fim do período individualizado prevalece `restricao` de `re.dat`, propagado até o fim do horizonte. Agrupamentos: limite do patamar (MWmédio) de `agrint.dat`. Nulo para a curva de segurança e para pisos elétricos."

# ===== frag_G_nw_inventory =====
# Fragmento G — inventário de fontes NEWAVE: arquivos e registros/colunas que o
# bridge NÃO converte. Itens convertidos são derivados dos fragmentos de campos e
# não aparecem aqui.

# ---------------------------------------------------------------------------
# Arquivos de entrada que o bridge não resolve nem lê
# ---------------------------------------------------------------------------

[[source]]
file = "saidas_newave"
label = "arquivos de saída do NEWAVE"
status = "unread"
covers = ["pmo", "parp", "forward", "forwardh", "newdesp", "cortes", "cortesh", "cortes_pos_estudo", "cortesh_pos_estudo", "dados_simulacao_final"]
note = "Entradas de `arquivos.dat` que são resultados de uma execução, não dados do caso: `pmo.dat`, `parp.dat`, `forward.dat`, `forwardh.dat`, `newdesp.dat`, `cortes.dat`, `cortesh.dat`, `cortes_pos_estudo`, `cortesh_pos_estudo` e `dados_simulacao_final`. A conversão não os consome; o comando de comparação de resultados lê `pmo.dat` e os CSV `MEDIAS-*` apenas para confrontar com a saída do Novomodelo."

[[source]]
file = "gtminpat"
label = "gtminpat.dat"
status = "unread"
note = "Geração térmica mínima por patamar de carga (usina × mês × patamar). O bridge só lê o GTMIN mensal de `expt.dat`; converter exigiria emitir `min_generation_mw` por bloco em `constraints/thermal_bounds.parquet`, que hoje é por estágio."

[[source]]
file = "itaipu"
label = "itaipu.dat"
status = "unread"
note = "Restrições operativas de Itaipu (parcelas 50 Hz/60 Hz e limites de intercâmbio associados). Ativado por `restricao_itaipu` em `dger.dat`; o bridge trata Itaipu como usina comum, sem partição de geração."

[[source]]
file = "perda"
label = "perda.dat"
status = "unread"
note = "Fatores de perda na rede de transmissão por patamar. Ativado por `perdas_rede_transmissao` em `dger.dat`; o Novomodelo não modela perdas de intercâmbio e o bridge não emite nenhum equivalente."

[[source]]
file = "tecno"
label = "tecno.dat"
status = "unread"
note = "Tecnologia e combustível das classes térmicas (base para emissões e gás). Sem uso: o Novomodelo não distingue tecnologia térmica."

[[source]]
file = "clasgas"
label = "clasgas.dat"
status = "unread"
note = "Restrições de fornecimento de gás natural por classe térmica. Ativado por `restricoes_fornecimento_gas`; converter exigiria restrições genéricas sobre `thermal_generation` agrupadas por classe."

[[source]]
file = "gee"
label = "gee.dat"
status = "unread"
note = "Limites de emissão de gases de efeito estufa por submercado ou SIN. Ativado por `restricoes_emissao_gee`; não há contraparte no Novomodelo."

[[source]]
file = "sar"
label = "sar.dat"
status = "unread"
note = "Superfície de aversão a risco (SAR). Ativado por `sar` em `dger.dat`; o bridge só representa aversão a risco via CVaR (`cvar.dat`) e curva de segurança (`curva.dat`)."

[[source]]
file = "bid"
label = "bid.dat"
status = "unread"
note = "Dados de ofertas (bid) de geração. Ativado por `bid` em `dger.dat`; sem uso no bridge."

[[source]]
file = "abertura"
label = "abertura.dat"
status = "unread"
note = "Número de aberturas variável por período. O bridge lê apenas `num_aberturas` de `dger.dat` e escreve o mesmo `num_openings` em todos os estágios; converter exigiria mapear a tabela por período para `stages[].num_openings`."

[[source]]
file = "elnino"
label = "elnino.dat"
status = "unread"
note = "Índices de El Niño para o modelo de afluências. Ativado por `el_nino` em `dger.dat`; o Novomodelo estima o PAR(p) sem covariáveis climáticas."

[[source]]
file = "ensoaux"
label = "ensoaux.dat"
status = "unread"
note = "Dados auxiliares de ENSO. Ativado por `enso` em `dger.dat`; mesma situação de `elnino.dat`."

[[source]]
file = "eliminacao_cortes"
label = "eliminacao-cortes.dat"
status = "unread"
note = "Parâmetros do algoritmo de eliminação de cortes de Benders. O bridge espelha apenas o liga/desliga da seleção de cortes (`selecao_de_cortes_*` de `dger.dat`) em `config.json`; os parâmetros finos ficam nos defaults do Novomodelo."

[[source]]
file = "volumes_referencia"
label = "volumes-referencia.csv"
status = "unread"
note = "Arquivo LIBs apontado por `indices.csv` (chave `HIDRELETRICA-CADASTRO-RESERVATORIO`) com `VOLUME-REFERENCIAL-TIPO-PADRAO` e `CADH-VOL-REF-PER` (volume de referência por usina e período). O bridge deriva o volume de referência de `hidr.dat` (`volume_referencia`) e de `volref_saz.dat`; a chave não é seguida em `indices.csv`."

# ---------------------------------------------------------------------------
# Arquivos resolvidos: registros/colunas não convertidos
# ---------------------------------------------------------------------------

[[source]]
file = "dger"
note = "O bridge lê cerca de trinta campos (horizonte, aberturas, forwards, iterações, CVaR, curva de aversão, simulação final, reamostragem, seleção de cortes, GNL antecipado, FPHA, outros usos, sazonalização de VMAXT/VMINT/CFUGA-CMONT, estados dos cortes). Os demais flags são agrupados abaixo por tema."

  [[source.item]]
  item = "execução, impressão e memória (nome_caso, duracao_periodo, imprime_*, impressao_operacao/ena/convergencia/cortes_ativos_sim_final, gera_arquivo_cortes_unico, mantem_arquivos_*, alocacao_memoria_*, memoria_calculo_cortes, armazenamento_local_arquivos_temporarios, utiliza_gerenciamento_pls, comunicacao_dois_niveis, intervalo_para_gravar, tamanho_registro_arquivo_historico, consulta_fcf)"
  status = "unread"
  note = "Controles de relatório, disco e memória do executável NEWAVE. Não têm contraparte no caso Novomodelo."

  [[source.item]]
  item = "convergência e gestão de cortes (tolerancia, delta_zinf, delta_zsup, deltas_consecutivos, converge_no_zero, num_minimo_iteracoes, inicio_teste_convergencia, desconsidera_convergencia_estatistica, considera_zsup_min_convergencia, iteracao_para_simulacao_final, aproveitamento_bases_backward, janela_de_cortes, periodos_manutencao_cortes, eliminacao_cortes, fcf_pos_estudo, mes_inicio_pre_estudo)"
  status = "unread"
  note = "O bridge fixa apenas `iteration_limit` (de `num_max_iteracoes`) e o liga/desliga da seleção de cortes; critérios de parada por gap e janelas de cortes ficam nos defaults do Novomodelo. `num_anos_pre_estudo` é convertido em `pre_study_stages`, mas `mes_inicio_pre_estudo` não é lido."

  [[source.item]]
  item = "modelo estocástico de afluências (tipo_geracao_enas, matriz_correlacao_espacial, reducao_automatica_ordem, considera_tendencia_hidrologica_calculo_politica, considera_tendencia_hidrologica_sim_final, tipo_reamostragem_cenarios, passo_reamostragem_cenarios, momento_reamostragem, aberturas_variaveis, num_anos_pos_sim_final, agregacao_simulacao_final, simulacao_final_com_data, representacao_agregacao, el_nino, enso)"
  status = "unread"
  note = "O Novomodelo estima o PAR(p) a partir de `scenarios/inflow_history.parquet` com sua própria seleção de ordem (`estimation.order_selection`); só `ordem_maxima_parp`, `consideracao_media_anual_afluencias`, `num_series_sinteticas` e `considera_reamostragem_cenarios` são espelhados. A tendência hidrológica é sempre emitida (`recent_observations`) quando `vazpast.dat` existe, sem consultar os flags."

  [[source.item]]
  item = "flags de recursos não convertidos (restricao_defluencia, restricao_itaipu, restricoes_rhq, restricoes_rhv, restricao_lpp_*, restricoes_emissao_gee, restricoes_fornecimento_gas, sar, bid, modif_automatica_adterm, sazonaliza_vminp, canal_desvio, correcao_desvio)"
  status = "unread"
  note = "Ativam recursos que o conversor não converte (vazão máxima `VAZMAXT`, RHQ/RHV, LPP, SAR, GEE, gás, canal de desvio, ADTERM automático), logo não há o que ligar ou desligar. Os flags de `ghmin.dat`, `c_adic.dat`, `agrint.dat`, `re.dat`, `restricao-eletrica.csv`, vazão mínima e turbinamento são honrados: um arquivo presente com o flag desligado é ignorado e reportado (diagnóstico `dger-switch-off`); linha ausente conta como ligada."

  [[source.item]]
  item = "operação e penalidades internas (perdas_rede_transmissao, considera_geracao_eolica, penalidade_corte_geracao_eolica, estacoes_bombeamento, representacao_submotorizacao, calcula_volume_inicial, volume_inicial_subsistema, ordenacao_automatica, calcula_prodt_media_sin, racionamento_preventivo, primeira_profundidade_risco_deficit, segunda_profundidade_risco_deficit, equalizacao_penal_intercambio)"
  status = "unread"
  note = "As micro-penalidades de intercâmbio, vertimento, turbinamento, corte de eólica e excesso são escritas com os defaults internos do manual NEWAVE v30, não com o valor de `penalidade_corte_geracao_eolica`. O volume inicial vem de `confhd.dat` (`volume_inicial_percentual`); `calcula_volume_inicial`/`volume_inicial_subsistema` não são lidos."

[[source]]
file = "confhd"
note = "Entram no caso as usinas em operação e não fictícias — `usina_existente` igual a `EX` ou a `EE` (existente em expansão) —, mais as usinas `NE` com registro de enchimento de volume morto em `exph.dat`. A usina `EE` opera desde o primeiro estágio e sua capacidade cresce conforme as máquinas de `exph.dat` entram."

  [[source.item]]
  item = "usinas fictícias (produtibilidade_especifica = 0 no mesmo posto de uma usina geradora)"
  status = "deferred"
  note = "Excluídas do mapa de ids com o diagnóstico `fictitious-plants-excluded`. São nós contábeis de cascata energética; o bridge preserva a topologia religando `downstream_id` à próxima usina real e somando a produtibilidade da cadeia fictícia à usina de montante."

  [[source.item]]
  item = "usinas NE sem registro de enchimento em exph.dat e usinas NC"
  status = "unread"
  note = "Não entram no LP; a cascata é religada através delas (log informativo apenas). Converter uma expansão sem enchimento exigiria `entry_stage_id` sem bloco `filling`."

  [[source.item]]
  item = "usina_modificada"
  status = "unread"
  note = "Indica se a usina tem registros em `modif.dat`; o bridge aplica os registros de `modif.dat` a toda usina cadastrada, sem consultar o flag."

  [[source.item]]
  item = "ano_inicio_historico · ano_fim_historico"
  status = "unread"
  note = "Janela do histórico de vazões por usina. O bridge usa o histórico completo de `vazoes.dat` desde `ano_inicial_historico` até o mês anterior ao início do estudo para todas as usinas."

[[source]]
file = "conft"

  [[source.item]]
  item = "usina_existente · classe"
  status = "unread"
  note = "Toda usina listada vira uma térmica do Novomodelo; o estado `EX`/`NE`/`EE` e a classe térmica não são consultados. A disponibilidade efetiva vem das janelas POTEF de `expt.dat`."

[[source]]
file = "sistema"

  [[source.item]]
  item = "numero_patamares_deficit"
  status = "unread"
  note = "Os segmentos de déficit são derivados das linhas de `custo_deficit` (`patamar_deficit`, `custo`, `corte`); a contagem declarada não é lida."

  [[source.item]]
  item = "limites_intercambio · flag"
  status = "unread"
  note = "Coluna de flag do bloco de limites de intercâmbio; o bridge usa apenas `submercado_de`, `submercado_para`, `sentido`, `data` e `valor`."

[[source]]
file = "clast"

  [[source.item]]
  item = "tipo_combustivel"
  status = "unread"
  note = "Combustível da classe térmica. O Novomodelo não distingue combustível; só o custo por ano de estudo e as modificações por data são convertidos."

[[source]]
file = "term"
note = "Todas as colunas de `usinas` são lidas (potência, FCMAX, TEIF, IP, GTMIN por mês do primeiro ano de estudo e GTMIN dos demais anos). Para usina `EE` ou `NE` em `conft.dat`, o NEWAVE descarta o GTMIN de `term.dat` e só valem as janelas GTMIN de `expt.dat`."

[[source]]
file = "ree"

  [[source.item]]
  item = "remocao_ficticias"
  status = "unread"
  note = "Flag de remoção de usinas fictícias do REE; o bridge identifica as fictícias estruturalmente (posto compartilhado e ρ_esp = 0), sem consultar o flag."

[[source]]
file = "hidr"
note = "Cadastro binário lido integralmente pelo `inewave`; as colunas abaixo não alimentam nenhuma saída."

  [[source.item]]
  item = "posto · submercado · codigo_usina_jusante (do cadastro)"
  status = "unread"
  note = "Posto, submercado e jusante são tomados de `confhd.dat` (jusante) e de `ree.dat` via o REE de `confhd.dat` (barra); as colunas homônimas do cadastro são ignoradas."

  [[source.item]]
  item = "numero_polinomios_jusante · a0..a4_jusante_1..6 · referencia_jusante_1..6"
  status = "unread"
  note = "Polinômios cota de jusante × defluência do cadastro. O bridge escreve `tailrace` como constante `canal_fuga_medio` em `hydros.json` e, quando há `polinjus.csv`, as famílias por partes em `system/tailrace_curves.parquet`; os polinômios do `hidr.dat` não são usados."

  [[source.item]]
  item = "influencia_vertimento_canal_fuga"
  status = "unread"
  note = "Flag de influência do vertimento no canal de fuga. O Novomodelo avalia as curvas de jusante sobre a defluência total; o flag não é consultado."

  [[source.item]]
  item = "fator_carga_maximo · fator_carga_minimo"
  status = "unread"
  note = "Fatores de carga da usina hidráulica; o limite de turbinamento vem do engolimento corrigido pela queda e o de geração da potência nominal dos conjuntos."

  [[source.item]]
  item = "volume_vertedouro · volume_desvio · cota_minima · cota_maxima · desvio"
  status = "unread"
  note = "Volumes de vertedouro e de desvio, cotas limite e o código de desvio. O Novomodelo não modela vertedouro nem canal de desvio (`diversion` é sempre nulo); as cotas são avaliadas pelo polinômio cota × volume."

  [[source.item]]
  item = "numero_unidades_base · representacao_conjunto · empresa · observacao · data"
  status = "unread"
  note = "Dados cadastrais sem contraparte: unidades-base para submotorização, forma de representação dos conjuntos, empresa proprietária e observações."

[[source]]
file = "modif"
note = "Registros permanentes `VAZMIN`, `VOLMAX`, `VOLMIN`, `NUMCNJ`, `NUMMAQ`, `POTEFE`, `VOLCOTA`, `COTAREA` são aplicados ao cadastro; `VMAXT`, `VMINT`, `TURBMAXT`, `TURBMINT`, `VAZMINT` viram limites por estágio e `CFUGA`/`CMONT` alteram a produtibilidade por estágio."

  [[source.item]]
  item = "VMINP"
  status = "deferred"
  note = "Volume mínimo com penalidade (meta operativa suave por estágio). Reportado por `modif-permanent-override-unsupported` e ignorado; converter exigiria uma restrição genérica com folga sobre `hydro_storage_final` penalizada pelo custo VOLMIN de `penalid.dat`, honrando `sazonaliza_vminp`."

  [[source.item]]
  item = "VAZMAXT"
  status = "deferred"
  note = "Defluência máxima por período. Reportado por `modif-permanent-override-unsupported` e ignorado; o Novomodelo aceita `max_outflow_m3s`, mas o bridge escreve sempre nulo em `hydros.json` e não emite coluna correspondente em `constraints/hydro_bounds.parquet`."

[[source]]
file = "ghmin"

  [[source.item]]
  item = "linhas com patamar ≠ 0"
  status = "unread"
  note = "Só as linhas de patamar 0 (média dos patamares) alimentam `min_generation_mw` em `constraints/hydro_bounds.parquet`; valores por patamar de carga são descartados porque a tabela é por estágio, não por bloco."

[[source]]
file = "penalid"
note = "O bridge toma, por variável, o primeiro valor `R$/MWh` não nulo do primeiro patamar de penalidade e o aplica ao SIN inteiro após multiplicar pela produtibilidade média ou máxima acumulada."

  [[source.item]]
  item = "codigo_ree_submercado"
  status = "unread"
  note = "Diferenciação da penalidade por REE ou submercado. O leitor por REE existe no código mas não é chamado; `penalties.json` recebe um único valor por variável."

  [[source.item]]
  item = "patamar_penalidade = 2"
  status = "unread"
  note = "Segundo patamar de penalidade (custo por violação adicional). O Novomodelo tem uma única folga linear por variável; só o primeiro patamar é lido."

  [[source.item]]
  item = "patamar_carga · valor_R$_hm3"
  status = "unread"
  note = "Penalidade específica por patamar de carga e o valor já convertido em R$/hm³. O bridge parte sempre de `valor_R$_MWh` e faz a própria conversão de unidades."

  [[source.item]]
  item = "variáveis além de DESVIO, VAZMIN, GHMIN, TURBMN, TURBMX, VOLMIN e ELETRI"
  status = "unread"
  note = "Qualquer outra variável presente (por exemplo penalidades de intercâmbio ou de excesso) é ignorada; essas micro-penalidades são escritas com os defaults internos do NEWAVE."

[[source]]
file = "vazpast"
note = "Lido integralmente: as vazões naturais por posto são convertidas em incrementais e recortadas aos 12 meses anteriores ao início do estudo para `initial_conditions.recent_observations`."

[[source]]
file = "dsvagua"
note = "Ignorado por inteiro quando `outros_usos_da_agua = 0` em `dger.dat`."

  [[source.item]]
  item = "considera_desvio_usina_NC"
  status = "unread"
  note = "Flag que decide se o desvio de uma usina `NC` é aplicado à usina existente a jusante. O bridge propaga sempre o desvio de uma usina fora do LP para a primeira usina existente a jusante, sem consultar o flag."

  [[source.item]]
  item = "comentario"
  status = "unread"
  note = "Texto livre da linha; sem contraparte."

[[source]]
file = "curva"
note = "A curva de segurança vira uma restrição genérica `VminOP_<REE>` por REE com folga penalizada pelo custo de `custos_penalidades`."

  [[source.item]]
  item = "configuracoes_penalizacao · TIPO DE PENALIZACAO ≠ 0"
  status = "deferred"
  note = "Penalização iterativa/variável da curva (etapa 2). O bridge modela apenas a penalização FIXA e emite `vminop-penalization-not-fixa` quando o deck seleciona outro tipo; a diferença na penalidade de violação é esperada."

  [[source.item]]
  item = "configuracoes_penalizacao · MES PENALIZACAO"
  status = "unread"
  note = "Mês a partir do qual a penalização passa a valer. A restrição é emitida em todos os estágios cobertos pela curva; só o primeiro campo (tipo) e o terceiro (sazonalização no pós-estudo) são lidos."

  [[source.item]]
  item = "iteracao_a_partir_etapa2 · maximo_iteracoes_etapa2 · tolerancia_processo_etapa2 · impressao_relatorio_etapa2"
  status = "unread"
  note = "Parâmetros do processo iterativo da etapa 2 da curva; sem contraparte na penalização fixa."

[[source]]
file = "expt"
note = "Os cinco tipos (`POTEF`, `FCMAX`, `TEIFT`, `GTMIN`, `IPTER`) são aplicados em `constraints/thermal_bounds.parquet` na ordem do arquivo; usinas presentes sem `POTEF` são tratadas como não instaladas (`thermal-expt-without-potef`). A coluna `nome_usina` não é lida."

[[source]]
file = "exph"
note = "Só o registro de enchimento (`data_inicio_enchimento`, `duracao_enchimento`, `volume_morto`) e as datas de entrada de máquinas (`data_entrada_operacao`, `conjunto_maquina_entrada`) são lidos. A usina EE não traz registro de enchimento: apenas linhas de entrada de máquina."

  [[source.item]]
  item = "potencia_instalada · maquina_entrada"
  status = "unread"
  note = "Potência e número da máquina que entra. A rampa de capacidade é recalculada a partir dos conjuntos do `hidr.dat` (máquinas por conjunto, vazão e potência nominais), contando as máquinas por `conjunto_maquina_entrada`. Vale para a usina NE em enchimento e para a usina EE em expansão; nesta a contagem nunca passa do cadastro de `hidr.dat`."

[[source]]
file = "manutt"
note = "Cada linha reduz a potência da usina proporcionalmente aos dias de sobreposição com o mês, somando unidades em manutenção simultânea; só até `num_anos_manutencao_utes`."

  [[source.item]]
  item = "codigo_empresa · nome_empresa · codigo_unidade · nome_usina"
  status = "unread"
  note = "Identificação da empresa e da unidade geradora; as reduções são somadas por usina sem distinguir a unidade."

[[source]]
file = "c_adic"

  [[source.item]]
  item = "razao · nome_submercado"
  status = "unread"
  note = "Motivo da carga adicional. Todas as razões do mesmo submercado e mês são somadas à carga em `scenarios/load_seasonal_stats.parquet`; a razão não é preservada."

[[source]]
file = "cvar"
note = "Lido integralmente: `valores_constantes` para `cvar = 1` e `alfa_variavel`/`lambda_variavel` para `cvar = 2` em `dger.dat`; linhas do ano 9999 (pós-estudo) recaem nos valores constantes."

[[source]]
file = "agrint"
note = "Lido por um parser próprio de texto, não pelo `inewave`. Limites pós-estudo do arquivo são ignorados: o bridge congela o último estágio de estudo, como o NEWAVE."

  [[source.item]]
  item = "limites_agrupamentos · comentario"
  status = "unread"
  note = "Descrição livre do limite; sem contraparte."

[[source]]
file = "re_dat"
note = "Fornece o conjunto de usinas e os limites superiores das restrições elétricas no período pós-individualizado; limites inferiores só existem em `restricao-eletrica.csv`."

  [[source.item]]
  item = "restricoes · motivo"
  status = "unread"
  note = "Justificativa textual da restrição; sem contraparte."

[[source]]
file = "volref_saz"
note = "Lido integralmente. Uma linha inteiramente zerada é tratada como ausência de referência sazonal (a usina recai em `volume_referencia`/altura 65%)."

[[source]]
file = "shist"
note = "Lido integralmente. `varredura`, `ano_inicio_varredura` e `anos_inicio_simulacoes` definem `historical_years` e o modo determinístico em `config.json`."

[[source]]
file = "adterm"
note = "Lido integralmente quando `despacho_antecipado_gnl ≠ 0`; despachos por patamar são ponderados pela duração dos patamares e lags além do horizonte são truncados com aviso."

[[source]]
file = "polinjus"
note = "Só as famílias de curva de jusante (`HidreletricaCurvaJusante` e `HidreletricaCurvaJusantePolinomioPorPartesSegmento`) alimentam `system/tailrace_curves.parquet`."

  [[source.item]]
  item = "HidreletricaCurvaJusanteAfogamentoExplicitoPadrao · HidreletricaCurvaJusanteAfogamentoExplicitoUsina"
  status = "unread"
  note = "Flag de afogamento explícito do canal de fuga. O Novomodelo escolhe a família pelo nível de referência de jusante; o flag não é consultado."

  [[source.item]]
  item = "HidreletricaPerdaHidraulicaGrade · HidreletricaProdutibilidadeEspecificaGrade"
  status = "unread"
  note = "Grades de perda hidráulica e de produtibilidade específica por turbinamento. O bridge usa os valores constantes do `hidr.dat` (`perdas`, `tipo_perda`, `produtibilidade_especifica`)."

  [[source.item]]
  item = "VolumeReferencialPeriodo · VolumeReferencialTipoPadrao · EstacaoBombeamento*"
  status = "unread"
  note = "Volumes de referência por período e estações de bombeamento. O volume de referência vem de `hidr.dat`/`volref_saz.dat`; bombeamento não é modelado."

[[source]]
file = "tratamento_fpha"
note = "Só a linha ativa terminada em `ANGULO-PADRAO` ou `DISTANCIA-PADRAO` vira `fpha_plane_reduction` em `system/hydro_production_models.json`; o número de amostras do método por distância é uma constante do bridge."

  [[source.item]]
  item = "linhas por usina (sufixo diferente de -PADRAO)"
  status = "unread"
  note = "Ajustes do método de redução de cortes por usina; o Novomodelo só aceita um método por caso."

[[source]]
file = "restricao_eletrica"
note = "Localizado pela chave `RESTRICAO-ELETRICA-ESPECIAL` de `indices.csv` e lido por um parser próprio; as demais chaves de `indices.csv` não são seguidas."

  [[source.item]]
  item = "funções de fórmula além de ger_usih e ener_interc"
  status = "unread"
  note = "Só termos `ger_usih(usina)` e `ener_interc(de, para)` são traduzidos para `hydro_generation` e `line_direct`/`line_reverse`; qualquer outra função (térmica, eólica, carga) é descartada silenciosamente pelo parser de fórmula."

  [[source.item]]
  item = "registros RHE, RHQ, RHV e seus RHE/RHQ/RHV-HORIZ-PER, -LIM-FORM-PER, -LS-LPP-*"
  status = "unread"
  note = "Restrições hidráulicas de energia, vazão e volume (inclusive as LPP lineares por partes). O parser ignora toda linha cujo primeiro campo não seja `RE`, `RE-HORIZ-PER` ou `RE-LIM-FORM-PER-PAT`; converter exigiria restrições genéricas sobre `hydro_storage_final`/`hydro_outflow`."

[[source]]
file = "caso"
status = "index"
note = "Nomeia o arquivo de índice (`arquivos.dat` por padrão). Lido apenas para localizar os demais arquivos do caso."

[[source]]
file = "arquivos"
status = "index"
note = "Índice que nomeia cada arquivo de dados do caso. Lido apenas para localizar os demais arquivos; os nomes que aponta são resolvidos sem distinção de maiúsculas."

[[source]]
file = "indices"
status = "index"
note = "Índice dos arquivos LIBs. Lido apenas para localizar `restricao-eletrica.csv`."
