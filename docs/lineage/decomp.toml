  { file = "dadger", register = "DT" },
  { file = "hidr" },
]
summary = "Uma linha por par de submercados de `IA`. Quando Itaipu (código 66) é operada e `IA` não liga `IV` ao submercado dela, a conversão acrescenta a linha `IV-SE` com a capacidade de 60 Hz de `RI`. Um deck sem `IA` ainda gera o arquivo com lista vazia (TRACKED NOVOMODELO-GAP C4)."

  [[output.field]]
  path = "lines[].id"
  from = [ { file = "dadger", register = "IA", item = "nome_submercado_de, nome_submercado_para" } ]
  status = "derived"
  how = "Pares ordenados por (id da barra de origem, id da barra de destino); a linha `IV-SE` criada pela conversão recebe o id seguinte ao último par de `IA`."

  [[output.field]]
  path = "lines[].name"
  from = [ { file = "dadger", register = "IA", item = "nome_submercado_de, nome_submercado_para" } ]
  status = "derived"
