  note = "Tipo dos valores de produtibilidade; capturado e não consumido, como `forma_calculo_produtibilidades`."

  [[source.item]]
  register = "HE"
  item = "arquivo_produtibilidades"
  status = "unread"
  note = "Arquivo externo de produtibilidades da restrição; capturado e não consumido, e o arquivo nunca é aberto."

  [[source.item]]
  register = "HE"
  item = "tipo_penalidade"
  status = "unread"
