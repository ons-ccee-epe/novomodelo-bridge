  [[output.field]]
  path = "non_controllable_sources[].name"
  from = [ { file = "dadger", register = "PQ", item = "nome, codigo_submercado" }, { file = "renovaveis", item = "PEE-CAD · nome_pee" }, { file = "renovaveis", item = "PEE-SUBM · codigo_submercado" } ]
  status = "derived"
  how = "`{nome}_{codigo_submercado}` para `PQ`; `{nome_pee}_{codigo_submercado}` para os parques (`PEE_{codigo}` sem cadastro de nome)."

  [[output.field]]
  path = "non_controllable_sources[].operational_start_date"
  from = [ { file = "dadger", register = "DT", item = "dia, mes, ano" } ]
