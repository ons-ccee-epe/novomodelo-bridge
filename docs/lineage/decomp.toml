[[output]]
path = "scenarios/load_seasonal_stats.parquet"
kind = "parquet"
when = ""
module = "src/novomodelo_bridge/decomp/load.py"
reads = [
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "DT" },
  { file = "dadger", register = "RI" },
  { file = "hidr" },
]
summary = "Uma linha por barra (inclusive a barra de transbordo `IV`) e estágio, com a carga média do estágio e desvio zero: a carga do DECOMP é determinística."

  [[output.field]]
  path = "bus_id"
  from = [ { file = "dadger", register = "SB", item = "codigo_submercado" } ]
  status = "derived"
  how = "Id 0-based dos submercados `SB` em ordem crescente de código, seguido da barra de transbordo `IV` (última), criada pelo conversor e ausente do `DP`."

  [[output.field]]
  path = "stage_id"
  from = [ { file = "dadger", register = "DP", item = "estagio" } ]
  status = "derived"
  how = "Índice 0-based do estágio (`estagio` − 1); o número de patamares do `DP` deve coincidir com o calendário."

  [[output.field]]
  path = "mean_mw"
  from = [
    { file = "dadger", register = "DP", item = "carga" },
    { file = "dadger", register = "DP", item = "duracao" },
    { file = "dadger", register = "RI", item = "carga_ande" },
    { file = "hidr", item = "submercado" },
  ]
  how = "Média do estágio ponderada pelas horas dos patamares, `Σ_b carga_b·duracao_b / Σ_b duracao_b`; campo de carga em branco lê 0. Quando Itaipu é operada e o `RI` declara `carga_ande`, esse valor por patamar (herdado adiante entre estágios) soma-se à carga `DP` do submercado de Itaipu (`submercado` do `hidr`); uma barra sem linha no `DP` recebe 0."

  [[output.field]]
  path = "std_mw"
  from = []
  status = "constant"
  how = "Sempre 0.0: a carga do DECOMP é determinística, sem espalhamento estocástico."

