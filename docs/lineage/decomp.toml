  { file = "cortes" },
  { file = "dadger", register = "FC" },
  { file = "dadger", register = "CX" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
  { file = "dadger", register = "AC" },
  { file = "dadgnl", register = "TG" },
  { file = "dadgnl", register = "GL" },
  { file = "dadgnl", register = "GS" },
  { file = "dadgnl", register = "NL" },
  { file = "vazoes" },
  { file = "hidr" },
  { file = "mlt" },
]
summary = "Importa a função de custo futuro de fronteira do modelo de origem: lê o cabeçalho `cortesh.dat` e os cortes do estágio de acoplamento em `cortes*.dat`, executa uma iteração do novomodelo sobre uma cópia do caso para ler o manifesto de estados terminal, mapeia os termos de armazenamento por código de usina (replicando complexos `CX`), os termos de vazão defasada por profundidade de mês (com a média de longo termo de `mlt.dat`, incrementalizada pela cascata efetiva, dobrada no RHS) e os termos GNL do `dadgnl` no anel antecipado, e grava `boundary/{manifest.bin, cuts/, basis/}` via novomodelo-python. Reescreve `config.json` apontando `policy.boundary` (`path = \"boundary\"`, `source_stage`) para o checkpoint e, quando há `mlt.dat`, `initial_conditions.json` com as janelas `recent_observations` das observações mensais e semanais de `vazoes`; o caso deve ser executado com `novomodelo run <caso> --output <caso>`."

# ===== frag_H_dc_inventory =====
# Fragment H — DECOMP source inventory: what the bridge does NOT convert.
# Only unconverted files / registers / fields are listed here; converted items
# are derived from the field fragments.

# ---------------------------------------------------------------------------
# dadger.rvN — registers and fields the bridge reads but does not convert
# (`deferred`) or never touches (`unread`).
# ---------------------------------------------------------------------------
[[source]]
file = "dadger"
note = "Arquivo principal de registros do DECOMP. Os registros abaixo são os que o conversor lê sem converter (`deferred`, sempre com diagnóstico) ou nunca lê (`unread`). Registros ausentes desta lista são convertidos e aparecem na matriz de campos."

  # --- deferred: read, reported, not emitted ---------------------------------

  [[source.item]]
  register = "VI"
  status = "deferred"
  note = "Tempo de viagem da água até a usina de jusante e defluências das semanas anteriores ao estudo. O conversor lê o registro e monta `travel_time_hours` e `initial_conditions.past_defluences`, mas a emissão está desligada por um defeito na geração de cortes com água em trânsito no novomodelo (gap rastreado C-travel-time): o `convert decomp` apenas avisa `deferred at this milestone: water travel time (VI present)`."

  [[source.item]]
  register = "FE"
  status = "deferred"
  note = "Coeficientes de participação elétrica de uma restrição `RE`. O idecomp não expõe leitor para este registro; o bridge detecta sua presença por varredura textual e emite `decomp-fe-participation-unreadable`, pois uma `RE` com termo `FE` fica sub-lida. Converter exige um leitor próprio e o descarte, por restrição, das `RE` que carregam `FE`."

  [[source.item]]
  register = "HA"
  status = "deferred"
  note = "Cadastro da família de restrições `HA`/`LA`/`CA` (declaração, limites e coeficientes), sem leitor no idecomp. Detectada por varredura textual; diagnóstico `decomp-rha-family-unconverted`. Converter exige leitor próprio e um emissor equivalente ao das famílias `RE`/`HQ`/`HV`."

  [[source.item]]
  register = "LA"
  status = "deferred"
  note = "Limites por estágio da família `HA`/`LA`/`CA`; ver `HA`."

  [[source.item]]
  register = "CA"
  status = "deferred"
  note = "Coeficientes da família `HA`/`LA`/`CA`; ver `HA`."

  [[source.item]]
  register = "AC"
  item = "ALTEFE"
  status = "deferred"
  note = "Alteração da altura efetiva de queda de um conjunto de máquinas. O leitor idecomp expõe só as colunas de identificação e data, sem a coluna de valor, logo o conversor não consegue ingerir a alteração: o `check decomp` emite `decomp-ac-altefe-uningestable` e a queda nominal de `hidr.dat` é mantida. Depende de o idecomp expor o valor."

  [[source.item]]
  register = "AC"
  item = "COFEVA"
  status = "deferred"
  note = "Alteração do coeficiente de evaporação mensal. Lido pelo `check decomp` (diagnóstico `decomp-ac-overrides-deferred`), sem consumidor no conversor: a evaporação usa os coeficientes mensais de `hidr.dat`. Converter exige sobrepor o coeficiente do mês na tabela efetiva antes de emitir os coeficientes de evaporação."

  [[source.item]]
  register = "AC"
  item = "COTARE"
  status = "deferred"
  note = "Alteração de um coeficiente do polinômio cota-área. Lido pelo `check decomp`, sem consumidor: a FPHA usa o polinômio de `hidr.dat`. Converter exige sobrepor o coeficiente na tabela efetiva usada pelo ajuste da FPHA."

  [[source.item]]
  register = "AC"
  item = "COTVAZ"
  status = "deferred"
  note = "Alteração de um coeficiente do polinômio cota-vazão (curva de jusante). Lido pelo `check decomp`, sem consumidor: as curvas de jusante vêm de `polinjus`. Converter exige aplicar a alteração sobre a família de `tailrace_curves.parquet` da usina."

  [[source.item]]
  register = "AC"
  item = "JUSENA"
  status = "deferred"
  note = "Alteração do índice de aproveitamento de jusante para o cálculo de energia armazenada e afluente. Lido pelo `check decomp`, sem consumidor: o Novomodelo não agrega energia por REE."

  [[source.item]]
  register = "AC"
  item = "NCHAVE"
  status = "deferred"
  note = "Alteração do número da curva-chave (cota-vazão) e do nível de jusante da faixa. Lido pelo `check decomp`, sem consumidor: a seleção de família de jusante segue `polinjus`."

  [[source.item]]
  register = "AC"
  item = "NPOSNW"
  status = "deferred"
  note = "Alteração do posto de acoplamento com o NEWAVE. Lido pelo `check decomp`, sem consumidor: o acoplamento da FCF de fronteira usa o `posto` de `hidr.dat` (com `NUMPOS`) e o registro `CX`."

  [[source.item]]
  register = "AC"
  item = "TIPERH"
  status = "deferred"
  note = "Alteração do tipo de perdas hidráulicas. Lido pelo `check decomp`, sem consumidor: o conversor usa o `tipo_perda` de `hidr.dat`. Converter exige sobrepor o tipo na tabela efetiva antes de calcular perdas e produtibilidade."

  [[source.item]]
  register = "AC"
  item = "VERTJU"
  status = "deferred"
  note = "Consideração da influência do vertimento no canal de fuga. Lido pelo `check decomp`, sem consumidor: o Novomodelo não modela essa influência na cota de jusante."

  [[source.item]]
  register = "CE"
  item = "fator_perdas"
  status = "deferred"
  note = "Fator de perdas do contrato de exportação. Lido e ignorado com o diagnóstico `contract-loss-factor-unmapped`: `energy_contracts` do Novomodelo não tem campo equivalente e o fator não é dobrado no preço nem nos limites."

  [[source.item]]
  register = "CI"
  item = "fator_perdas"
  status = "deferred"
  note = "Fator de perdas do contrato de importação; mesmo tratamento do `CE`."

  [[source.item]]
  register = "FU"
  item = "frequencia"
  status = "deferred"
  note = "Frequência (50/60 Hz) do termo de geração hidráulica de uma `RE`. Uma restrição genérica com termo dividido por frequência é descartada com `decomp-re-frequency-split-deferred`, pois o conversor não constrói o mapa frequência-barra; no caminho de limite simples a frequência é ignorada e o termo vale para a usina inteira."

  [[source.item]]
  register = "CV"
  item = "tipo (VDEF, VDES, VBOM)"
  status = "deferred"
  note = "Tipos de volume de uma `HV` além de `VARM`. A forma hm³-para-vazão exige coeficiente por estágio (horas de patamar variam), que a expressão de restrição genérica do Novomodelo não carrega; a restrição é descartada com `decomp-rhv-volume-tipo-deferred`."

