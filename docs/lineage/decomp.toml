    { file = "dadger", register = "CM", item = "coeficiente" },
    { file = "dadger", register = "UH", item = "codigo_ree" },
    { file = "dadger", register = "IA", item = "nome_submercado_de" },
    { file = "dadger", register = "IA", item = "nome_submercado_para" },
    { file = "dadger", register = "UE", item = "codigo_usina" },
    { file = "libs_restricao_eletrica", item = "RESTRICAO-ELETRICA-FORMULA · formula" },
    { file = "libs_restricao_eletrica", item = "RESTRICAO-ELETRICA-INEQUACAO · formula" },
    { file = "libs_restricao_eletrica", item = "RESTRICAO-ELETRICA-INEQUACAO · formula_limite" },
    { file = "libs_restricao_eletrica", item = "EXPRESSAO-ELETRICA · formula" },
    { file = "renovaveis", item = "PEE-CAD · codigo_pee" },
  ]
  how = "Soma linear de termos `coeficiente * token`, com coeficiente unitário omitido: `FU` → `hydro_generation(id)`, `FT` → `thermal_generation(id)`, `FI` → `line_direct(id)`/`line_reverse(id)` pela orientação do par nas linhas `IA`, `CQ.tipo` `QDEF`/`QTUR`/`QVER`/`QDES` → `hydro_outflow`/`hydro_turbined`/`hydro_spillage`/`hydro_diversion(id)`, `QBOM` → `pumping_flow(id)` da estação `UE`, `CV.tipo` `VARM` → `hydro_storage(id)`; `HE` expande cada REE (`CM`) em `@rho_acum_h<id> * hydro_storage(id)` sobre os reservatórios (`M` ou `S`) com volume útil positivo ligados ao REE por `UH.codigo_ree`, com o sinal do `CM`. Nas restrições LIBs a fórmula (com `EXPRESSAO-ELETRICA` expandida) mantém apenas os termos de decisão `ger_usih`/`ger_usit`/`ger_pee`/`ger_conjh`/`ener_interc`, mapeados para os mesmos tokens (`ger_pee` → `non_controllable_generation`, `ger_conjh` → `hydro_generation(id, bus=…)`); os termos de dados (`demanda`, `carga_ande`, aliases, `disp_usih`) são dobrados no limite."

  [[output.field]]
  path = "constraints[].slack.enabled"
  from = []
  status = "constant"
  how = "Sempre `true`: toda restrição genérica é flexível, penalizada em vez de infactível."

  [[output.field]]
  path = "constraints[].slack.penalty"
  from = [
    { file = "dadger", register = "CD", item = "custo" },
    { file = "dadger", register = "HE", item = "valor_penalidade" },
    { file = "libs_restricao_eletrica", item = "RESTRICAO-ELETRICA-TRATAMENTO-VIOLACAO · custo_violacao" },
  ]
  how = "`RE`/`HQ`/`HV`: 10 × o maior custo de déficit do `CD` entre os submercados. `RHE`: `valor_penalidade` do `HE`, ou 1000.0 (com aviso) quando ausente ou não positivo. LIBs: `custo_violacao` do `TRATAMENTO-VIOLACAO` quando positivo, senão o mesmo 10 × déficit."

