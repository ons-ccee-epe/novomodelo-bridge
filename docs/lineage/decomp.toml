  { file = "hidr" },
]
summary = "Limites de intercâmbio por linha e estágio a partir de `IA` (estágios não declarados herdam o último declarado; estágio 1 obrigatório). Por (linha, estágio) há uma única linha de base quando os patamares são uniformes, ou uma linha por patamar quando não são, nunca ambas."

  [[output.field]]
  path = "line_id"
  from = [ { file = "dadger", register = "IA", item = "nome_submercado_de, nome_submercado_para" } ]
  status = "derived"
  how = "Id da linha em `system/lines.json`."

  [[output.field]]
  path = "stage_id"
  from = [ { file = "dadger", register = "IA", item = "estagio" } ]
  status = "derived"
  how = "Índice 0-based do estágio; uma linha para cada estágio do calendário, com herança dos estágios `IA` não declarados."

  [[output.field]]
  path = "block_id"
  from = [ { file = "dadger", register = "DP", item = "numero_patamares" } ]
  status = "derived"
  how = "Nulo na linha de base (todos os patamares); `0..n-1` quando os limites de `IA` variam entre patamares naquele estágio, caso em que cada patamar recebe a sua própria linha e a base é descartada."

  [[output.field]]
  path = "direct_mw"
  from = [ { file = "dadger", register = "IA", item = "limite_de_para" }, { file = "dadger", register = "RI", item = "geracao_maxima_60_hz" } ]
  how = "Linha de base: o maior `limite_de_para_k` do estágio; linhas por patamar: o `limite_de_para_k` do próprio patamar, em MW absolutos. O sentinela 99999 passa como capacidade grande. A linha `IV-SE` criada pela conversão recebe o maior `geracao_maxima_60_hz` de `RI` em todos os estágios (99999 sem `RI`)."

  [[output.field]]
  path = "reverse_mw"
  from = [ { file = "dadger", register = "IA", item = "limite_para_de" }, { file = "dadger", register = "RI", item = "geracao_maxima_60_hz" } ]
  how = "Mesma regra de `direct_mw` com `limite_para_de_k`; a linha `IV-SE` criada usa o mesmo valor do sentido direto."

# ---------------------------------------------------------------------------
# constraints/thermal_bounds.parquet
# ---------------------------------------------------------------------------
[[output]]
path = "constraints/thermal_bounds.parquet"
kind = "parquet"
when = ""
module = "src/novomodelo_bridge/decomp/converters/thermal.py"
reads = [
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "RE" },
  { file = "dadger", register = "LU" },
  { file = "dadger", register = "FU" },
  { file = "dadger", register = "FT" },
  { file = "dadger", register = "FI" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
]
summary = "Limites de geração e CVU de cada térmica de `CT` em cada estágio (estágios não declarados herdam o último; estágio 1 obrigatório), intersectados com as restrições elétricas `RE` de termo único sobre uma térmica (`FT` com coeficiente ±1 e limites `LU`). Térmicas GNL não recebem linhas."

  [[output.field]]
  path = "thermal_id"
  from = [ { file = "dadger", register = "CT", item = "codigo_usina" } ]
  status = "derived"
  how = "Id da térmica em `system/thermals.json`."

  [[output.field]]
  path = "stage_id"
  from = [ { file = "dadger", register = "CT", item = "estagio" }, { file = "dadger", register = "RE", item = "estagio_inicial, estagio_final" } ]
  status = "derived"
  how = "Índice 0-based do estágio; uma linha de custo para cada estágio do calendário."

  [[output.field]]
  path = "block_id"
  from = [ { file = "dadger", register = "DP", item = "numero_patamares" } ]
  status = "derived"
  how = "Nulo quando `disponibilidade` e `inflexibilidade` são uniformes entre patamares e nenhuma `RE` por patamar atinge a térmica; senão `0..n-1`, uma linha por patamar com os limites exatos do patamar, mais uma linha de `block_id` nulo carregando apenas o custo do estágio."

  [[output.field]]
  path = "min_generation_mw"
  from = [ { file = "dadger", register = "CT", item = "inflexibilidade" }, { file = "dadger", register = "DP", item = "duracao" }, { file = "dadger", register = "LU", item = "limite_inferior" }, { file = "dadger", register = "FT", item = "coeficiente" } ]
  how = "Inflexibilidade por patamar de `CT` (ponderada por horas na linha de base, exata por patamar); quando uma `RE` de termo único `FT` limita a térmica, o maior entre os limites inferiores (coeficiente −1 troca e inverte os lados). Nulo na linha que só carrega custo."

  [[output.field]]
  path = "max_generation_mw"
  from = [ { file = "dadger", register = "CT", item = "disponibilidade" }, { file = "dadger", register = "DP", item = "duracao" }, { file = "dadger", register = "LU", item = "limite_superior" }, { file = "dadger", register = "FT", item = "coeficiente" } ]
  how = "Disponibilidade por patamar de `CT` (ponderada por horas na linha de base, exata por patamar); com `RE`/`FT`, o menor entre os limites superiores. Nulo na linha que só carrega custo."

  [[output.field]]
  path = "cost_per_mwh"
  from = [ { file = "dadger", register = "CT", item = "cvu" }, { file = "dadger", register = "DP", item = "duracao" } ]
  how = "CVU do estágio ponderado pelas horas de patamar (`cvu_k`, em branco lido como 0), sempre em uma linha de `block_id` nulo; nulo nas linhas por patamar, pois o custo não é elegível a patamar no Novomodelo."

# ---------------------------------------------------------------------------
# constraints/pumping_bounds.parquet
# ---------------------------------------------------------------------------
[[output]]
path = "constraints/pumping_bounds.parquet"
kind = "parquet"
when = "somente quando alguma restrição hidráulica `HQ` de termo único `QBOM` (coeficiente ±1 em `CQ`) limita uma estação de bombeamento declarada em `UE`"
module = "src/novomodelo_bridge/decomp/converters/single_term_bounds.py"
reads = [
  { file = "dadger", register = "HQ" },
  { file = "dadger", register = "LQ" },
  { file = "dadger", register = "CQ" },
  { file = "dadger", register = "UE" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
]
summary = "Limites de vazão bombeada por estação, estágio e patamar, oriundos exclusivamente das restrições `HQ`/`LQ`/`CQ` cujo único termo é `QBOM`. Os limites de `UE` ficam em `system/pumping_stations.json`. Um `QBOM` sem estação correspondente é avisado e ignorado."

  [[output.field]]
  path = "pumping_station_id"
  from = [ { file = "dadger", register = "CQ", item = "codigo_usina" }, { file = "dadger", register = "UE", item = "codigo_usina" } ]
  status = "derived"
  how = "Id da estação em `system/pumping_stations.json`, resolvido pelo `codigo_usina` do termo `QBOM`."

  [[output.field]]
  path = "stage_id"
  from = [ { file = "dadger", register = "HQ", item = "estagio_inicial, estagio_final" }, { file = "dadger", register = "LQ", item = "estagio" } ]
  status = "derived"
  how = "Índice 0-based de cada estágio entre `estagio_inicial` e `estagio_final` da `HQ`; estágios sem `LQ` herdam o limite declarado mais recente (os anteriores à primeira declaração herdam a primeira)."

  [[output.field]]
  path = "block_id"
  from = [ { file = "dadger", register = "DP", item = "numero_patamares" } ]
  status = "derived"
  how = "Sempre `0..n-1`: os limites `LQ` são por patamar, logo cada estágio se materializa em uma linha por patamar do calendário."

  [[output.field]]
  path = "min_m3s"
  from = [ { file = "dadger", register = "LQ", item = "limite_inferior" }, { file = "dadger", register = "CQ", item = "coeficiente" } ]
  how = "`limite_inferior_k` da `LQ` (coeficiente −1 troca e inverte os lados); nulo quando em branco ou no sentinela ilimitado. Com mais de uma restrição sobre a mesma estação, o maior dos limites inferiores."

  [[output.field]]
  path = "max_m3s"
  from = [ { file = "dadger", register = "LQ", item = "limite_superior" }, { file = "dadger", register = "CQ", item = "coeficiente" } ]
  how = "`limite_superior_k` da `LQ`; nulo quando em branco ou no sentinela ilimitado. Com mais de uma restrição sobre a mesma estação, o menor dos limites superiores."

# ---------------------------------------------------------------------------
# post_study_stages.json (conditional)
# ---------------------------------------------------------------------------
[[output]]
path = "post_study_stages.json"
kind = "json"
when = "somente quando `dadgnl` declara despacho GNL comprometido (algum `GL` com `geracao` não nula) e um calendário `GS`"
module = "src/novomodelo_bridge/decomp/converters/anticipated.py"
reads = [
  { file = "dadgnl", register = "TG" },
  { file = "dadgnl", register = "GL" },
  { file = "dadgnl", register = "GS" },
  { file = "dadgnl", register = "NL" },
  { file = "dadger", register = "DT" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "AR" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "UH" },
]
summary = "Calendário pós-estudo na grade semanal (sábados): preenche as semanas já comandadas de `GL` após o fim do horizonte e depois espelha os estágios do estudo; cada térmica GNL recebe limites de preço apenas nos estágios sinalizados (classe 3), nunca nos já comandados."

  [[output.field]]
  path = "stages[].start_date"
  from = [ { file = "dadger", register = "DT", item = "dia, mes, ano" }, { file = "dadger", register = "DP", item = "duracao" }, { file = "dadgnl", register = "GL", item = "data_inicio" } ]
  status = "derived"
  how = "Começa no fim do horizonte do estudo: um stub até o sábado seguinte (se necessário), semanas de 168 h até o corte já comandado comum a todas as usinas (`data_inicio` da última semana `GL` mais uma semana) e, a partir dele, um estágio espelhando cada estágio do estudo."

  [[output.field]]
  path = "stages[].duration_hours"
  from = [ { file = "dadger", register = "DP", item = "duracao" } ]
  status = "derived"
  how = "Horas até o próximo sábado no stub; `168` nas semanas; no espelho do estágio mensal do estudo, as horas até o último dia do mês civil do próprio estágio espelhado."

  [[output.field]]
  path = "thermal_bounds[].thermal_id"
  from = [ { file = "dadgnl", register = "TG", item = "codigo_usina" } ]
  status = "derived"
  how = "Id da térmica GNL em `system/thermals.json`."

  [[output.field]]
  path = "thermal_bounds[].post_study_stage_index"
  from = [ { file = "dadgnl", register = "GL", item = "data_inicio" } ]
  status = "derived"
  how = "Índice 0-based do estágio pós-estudo; apenas os estágios cujo início é igual ou posterior ao corte já comandado da usina recebem uma linha."

  [[output.field]]
  path = "thermal_bounds[].cost_per_mwh"
  from = [ { file = "dadgnl", register = "TG", item = "cvu" }, { file = "dadger", register = "DP", item = "duracao" } ]
  how = "`cvu_1..3` do `TG` vigente no último estágio do estudo (o último declarado), ponderados pelas horas de patamar desse estágio."

  [[output.field]]
  path = "thermal_bounds[].min_mw"
  from = [ { file = "dadgnl", register = "TG", item = "inflexibilidade" }, { file = "dadger", register = "DP", item = "duracao" } ]
  how = "`inflexibilidade_1..3` do mesmo `TG`, com a mesma ponderação."

  [[output.field]]
  path = "thermal_bounds[].max_mw"
  from = [ { file = "dadgnl", register = "TG", item = "disponibilidade" }, { file = "dadger", register = "DP", item = "duracao" } ]
  how = "`disponibilidade_1..3` do mesmo `TG`, com a mesma ponderação."

# ---------------------------------------------------------------------------
# system/energy_contracts.json (conditional)
# ---------------------------------------------------------------------------
[[output]]
path = "system/energy_contracts.json"
kind = "json"
when = "somente quando `dadger` declara ao menos um contrato `CI`/`CE` real (linha com nome ou com algum limite não nulo)"
module = "src/novomodelo_bridge/decomp/converters/contracts.py"
reads = [
  { file = "dadger", register = "CI" },
  { file = "dadger", register = "CE" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
]
summary = "Contratos de importação (`CI`) e exportação (`CE`) de energia com os valores do estágio 1; uma linha sem nome e com todos os limites nulos é um placeholder e é ignorada. O `fator_perdas` não tem contraparte no Novomodelo e gera apenas um aviso."

  [[output.field]]
  path = "contracts[].id"
  from = [ { file = "dadger", register = "CI", item = "numero_contrato" }, { file = "dadger", register = "CE", item = "numero_contrato" } ]
  status = "derived"
  how = "Id 0-based denso: importações antes de exportações, cada grupo em ordem crescente de `numero_contrato` (os dois espaços de numeração colidem)."

  [[output.field]]
  path = "contracts[].name"
  from = [ { file = "dadger", register = "CI", item = "nome_contrato" }, { file = "dadger", register = "CE", item = "nome_contrato" } ]
  how = "Nome do contrato sem espaços laterais; `CI {numero}` ou `CE {numero}` quando em branco."

  [[output.field]]
  path = "contracts[].operational_start_date"
  from = [ { file = "dadger", register = "DT", item = "dia, mes, ano" } ]
  status = "derived"
  how = "Data de início do estudo; todo contrato é sempre ativo (`entry_stage_id`/`exit_stage_id` omitidos)."

  [[output.field]]
  path = "contracts[].bus_id"
  from = [ { file = "dadger", register = "CI", item = "codigo_submercado" }, { file = "dadger", register = "CE", item = "codigo_submercado" } ]
  how = "Barra do submercado declarado."

  [[output.field]]
  path = "contracts[].type"
  from = []
  status = "derived"
  how = "`import` para registros `CI`, `export` para registros `CE`."

  [[output.field]]
  path = "contracts[].price_per_mwh"
  from = [ { file = "dadger", register = "CI", item = "custo" }, { file = "dadger", register = "CE", item = "custo" }, { file = "dadger", register = "DP", item = "duracao" } ]
  how = "`custo_k` do estágio 1 ponderado pelas horas de patamar; negativo nas exportações (receita), positivo nas importações."

  [[output.field]]
  path = "contracts[].limits.min_mw"
  from = [ { file = "dadger", register = "CI", item = "limite_inferior" }, { file = "dadger", register = "CE", item = "limite_inferior" }, { file = "dadger", register = "DP", item = "duracao" } ]
  how = "`limite_inferior_k` do estágio 1 ponderado pelas horas de patamar (em branco lido como 0)."

  [[output.field]]
  path = "contracts[].limits.max_mw"
  from = [ { file = "dadger", register = "CI", item = "limite_superior" }, { file = "dadger", register = "CE", item = "limite_superior" }, { file = "dadger", register = "DP", item = "duracao" } ]
  how = "`limite_superior_k` do estágio 1 ponderado pelas horas de patamar (em branco lido como 0)."

# ---------------------------------------------------------------------------
# constraints/contract_bounds.parquet (conditional)
# ---------------------------------------------------------------------------
[[output]]
path = "constraints/contract_bounds.parquet"
kind = "parquet"
when = "somente quando `dadger` declara ao menos um contrato `CI`/`CE` real (tabela não vazia)"
module = "src/novomodelo_bridge/decomp/converters/contracts.py"
reads = [
  { file = "dadger", register = "CI" },
  { file = "dadger", register = "CE" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
]
summary = "Limites e preço de cada contrato por estágio (estágios não declarados herdam o último; estágio 1 obrigatório). Por (contrato, estágio) há uma única linha de base quando `limite_inferior`, `limite_superior` e `custo` são uniformes entre patamares, ou uma linha por patamar quando não são, nunca ambas."

  [[output.field]]
  path = "contract_id"
  from = [ { file = "dadger", register = "CI", item = "numero_contrato" }, { file = "dadger", register = "CE", item = "numero_contrato" } ]
  status = "derived"
  how = "Id do contrato em `system/energy_contracts.json`."

  [[output.field]]
  path = "stage_id"
  from = [ { file = "dadger", register = "CI", item = "estagio" }, { file = "dadger", register = "CE", item = "estagio" } ]
  status = "derived"
  how = "Índice 0-based do estágio; uma entrada para cada estágio do calendário."

  [[output.field]]
  path = "block_id"
  from = [ { file = "dadger", register = "DP", item = "numero_patamares" } ]
  status = "derived"
  how = "Nulo na linha de base (todos os patamares); `0..n-1` quando algum dos três valores varia entre patamares naquele estágio, caso em que cada patamar recebe a sua própria linha e a base é descartada."

  [[output.field]]
  path = "min_mw"
  from = [ { file = "dadger", register = "CI", item = "limite_inferior" }, { file = "dadger", register = "CE", item = "limite_inferior" }, { file = "dadger", register = "DP", item = "duracao" } ]
  how = "Linha de base: `limite_inferior_k` ponderado pelas horas de patamar; linhas por patamar: o valor exato do patamar."

  [[output.field]]
  path = "max_mw"
  from = [ { file = "dadger", register = "CI", item = "limite_superior" }, { file = "dadger", register = "CE", item = "limite_superior" }, { file = "dadger", register = "DP", item = "duracao" } ]
  how = "Linha de base: `limite_superior_k` ponderado pelas horas de patamar; linhas por patamar: o valor exato do patamar."

  [[output.field]]
  path = "price_per_mwh"
  from = [ { file = "dadger", register = "CI", item = "custo" }, { file = "dadger", register = "CE", item = "custo" }, { file = "dadger", register = "DP", item = "duracao" } ]
  how = "Linha de base: `custo_k` ponderado pelas horas de patamar; linhas por patamar: o custo exato do patamar. Negativo nas exportações, positivo nas importações."

# ===== frag_E_dc_hydro =====
# Fragment E — DECOMP hydro outputs (hydros.json, production models, geometry,
# energy productivity, tailrace curves, hydro_bounds, hydro_unit_group_bounds).

[[output]]
path = "system/hydros.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/decomp/converters/hydro/entity.py"
reads = [
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
  { file = "dadger", register = "AC" },
  { file = "dadger", register = "MP" },
  { file = "dadger", register = "FD" },
  { file = "dadger", register = "HQ" },
  { file = "dadger", register = "LQ" },
  { file = "dadger", register = "CQ" },
  { file = "hidr" },
]
summary = "Uma entrada por usina hidráulica operada (registro `UH` com `volume_inicial` preenchido), ordenada pelo id Novomodelo; o cadastro vem do `hidr.dat` com as modificações `AC` já resolvidas por estágio, e o bloco `diversion` é acoplado só depois da resolução dos limites."

  [[output.field]]
  path = "hydros[].id"
  from = [ { file = "dadger", register = "UH", item = "codigo_usina" } ]
  status = "derived"
  how = "Id 0-based denso, atribuído na ordem crescente do `codigo_usina` dos registros `UH` operados (com `volume_inicial`). Registros `UH` sem volume inicial são só de acoplamento e ficam fora do conjunto operado, com aviso."

  [[output.field]]
  path = "hydros[].name"
  from = [ { file = "hidr", item = "nome_usina" } ]
  how = "Nome cadastral da usina no `hidr.dat`, sem espaços nas pontas."

  [[output.field]]
  path = "hydros[].operational_start_date"
  from = [
    { file = "dadger", register = "DT", item = "dia" },
    { file = "dadger", register = "DT", item = "mes" },
    { file = "dadger", register = "DT", item = "ano" },
  ]
  status = "derived"
  how = "Data de início do estudo (`DT`), em ISO 8601, igual para todas as usinas: nenhuma usina entra em operação dentro do horizonte."

  [[output.field]]
  path = "hydros[].downstream_id"
  from = [
    { file = "hidr", item = "codigo_usina_jusante" },
    { file = "dadger", register = "AC", item = "NUMJUS" },
    { file = "dadger", register = "UH", item = "codigo_usina" },
  ]
  how = "Id Novomodelo da primeira usina operada encontrada descendo a cascata pela jusante efetiva (`codigo_usina_jusante`, sobrescrito por `AC NUMJUS`) do estágio inicial; usinas não operadas no caminho são atravessadas e o código 0 (foz) resulta em nulo. Um `AC NUMJUS` que varia ao longo do horizonte gera aviso e só o vínculo do estágio inicial é usado."

  [[output.field]]
  path = "hydros[].reservoir.min_storage_hm3"
  from = [
    { file = "hidr", item = "volume_minimo" },
    { file = "dadger", register = "AC", item = "VOLMIN" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_referencia" },
  ]
  how = "Menor valor, ao longo dos estágios, do `volume_minimo` efetivo (`AC VOLMIN` em vigor a partir do estágio resolvido pelo trio mês/semana/ano). Usina a fio d'água (`tipo_regulacao` = D) colapsa para `volume_referencia` (ou `volume_minimo` quando ausente ou não positivo)."

  [[output.field]]
  path = "hydros[].reservoir.max_storage_hm3"
  from = [
    { file = "hidr", item = "volume_maximo" },
    { file = "dadger", register = "AC", item = "VOLMAX" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_referencia" },
  ]
  how = "Maior valor, ao longo dos estágios, do `volume_maximo` efetivo (`AC VOLMAX` em vigor a partir do estágio resolvido). Usina a fio d'água (`tipo_regulacao` = D) colapsa para `volume_referencia`, igual ao mínimo; estágios com faixa mais estreita que o envelope vão para `constraints/hydro_bounds.parquet`."

  [[output.field]]
  path = "hydros[].outflow.min_outflow_m3s"
  from = [ { file = "dadger", register = "UH", item = "vazao_defluente_minima" } ]
  how = "Vazão defluente mínima declarada no `UH` da usina; 0.0 quando o campo está em branco. O mínimo por REE do `RQ` não entra aqui: vai para `constraints/hydro_bounds.parquet`."

  [[output.field]]
  path = "hydros[].outflow.max_outflow_m3s"
  from = []
  status = "null"
  how = "Sempre nulo: o DECOMP não declara defluência máxima cadastral. Um teto de `QDEF` (RHQ de termo único) vai para `constraints/hydro_bounds.parquet`."

  [[output.field]]
  path = "hydros[].generation.model"
  from = [
    { file = "hidr", item = "a0_volume_cota..a4_volume_cota" },
    { file = "dadger", register = "AC", item = "COTVOL" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "dadger", register = "AC", item = "PROESP" },
  ]
  status = "derived"
  how = "`fpha` quando o polinômio cota-volume efetivo (pós `AC COTVOL`) do estágio inicial não é identicamente nulo, a produtibilidade específica efetiva (pós `AC PROESP`) é positiva e o engolimento e a potência nominais efetivos (maior valor ao longo dos estágios, pós `AC NUMCON`/`NUMMAQ`/`POTEFE`/`VAZEFE`) são positivos; caso contrário `constant_productivity`, e a usina excluída só pela capacidade nula é listada em diagnóstico informativo, com o ρ_eq em `system/hydro_energy_productivity.parquet`."

  [[output.field]]
  path = "hydros[].generation.min_turbined_m3s"
  from = []
  status = "constant"
  how = "Sempre 0.0: o cadastro não traz engolimento mínimo; pisos de `QTUR` (RHQ) vão para `constraints/hydro_bounds.parquet`."

  [[output.field]]
  path = "hydros[].generation.max_turbined_m3s"
  from = [
    { file = "hidr", item = "numero_conjuntos_maquinas" },
    { file = "hidr", item = "maquinas_conjunto_1..5" },
    { file = "hidr", item = "vazao_nominal_conjunto_1..5" },
    { file = "hidr", item = "potencia_nominal_conjunto_1..5" },
    { file = "hidr", item = "queda_nominal_conjunto_1..5" },
    { file = "hidr", item = "tipo_turbina" },
    { file = "hidr", item = "a0_volume_cota..a4_volume_cota" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "hidr", item = "canal_fuga_medio" },
    { file = "hidr", item = "perdas" },
    { file = "hidr", item = "tipo_perda" },
    { file = "dadger", register = "AC", item = "NUMCON" },
    { file = "dadger", register = "AC", item = "NUMMAQ" },
    { file = "dadger", register = "AC", item = "VAZEFE" },
    { file = "dadger", register = "AC", item = "POTEFE" },
    { file = "dadger", register = "AC", item = "COTVOL" },
    { file = "dadger", register = "AC", item = "VOLMIN" },
    { file = "dadger", register = "AC", item = "VOLMAX" },
    { file = "dadger", register = "AC", item = "PROESP" },
    { file = "dadger", register = "AC", item = "JUSMED" },
    { file = "dadger", register = "AC", item = "PERHID" },
  ]
  how = "Engolimento máximo corrigido pela queda: por estágio, min(Σ máquinas × vazão nominal × (h_op/h_nom)^k, potência instalada / ρ_eq), com h_op = ρ_eq/ρ_esp, ρ_eq = ρ_esp × (cota média sobre [`volume_minimo`, `volume_maximo`] − `canal_fuga_medio`, descontadas as perdas), h_nom = `queda_nominal_conjunto_k` e k = 0,5 (Francis/Pelton) ou 0,2 (Kaplan, `tipo_turbina` = 2); máximo ao longo do horizonte, sem desconto de TEIF/IP. Para Itaipu (código 66) é a soma dos envelopes dos dois grupos. `AC ALTEFE` não é consumido (o idecomp não expõe seu valor) e só gera aviso."

  [[output.field]]
  path = "hydros[].generation.min_generation_mw"
  from = []
  status = "constant"
  how = "Sempre 0.0: o cadastro não traz geração mínima; pisos de `RE`/`FU` de termo único vão para `constraints/hydro_bounds.parquet` e os pisos `RI` de Itaipu para `constraints/hydro_unit_group_bounds.parquet`."

  [[output.field]]
  path = "hydros[].generation.max_generation_mw"
  from = [
    { file = "hidr", item = "numero_conjuntos_maquinas" },
    { file = "hidr", item = "maquinas_conjunto_1..5" },
    { file = "hidr", item = "potencia_nominal_conjunto_1..5" },
    { file = "dadger", register = "AC", item = "NUMCON" },
    { file = "dadger", register = "AC", item = "NUMMAQ" },
    { file = "dadger", register = "AC", item = "POTEFE" },
  ]
  how = "Potência instalada nominal: soma, sobre os conjuntos efetivos, de máquinas × potência unitária (com `AC NUMCON`/`NUMMAQ`/`POTEFE` por estágio), tomando o máximo ao longo do horizonte; sem desconto de TEIF/IP nem de manutenção (`MP`/`FD` vão para `constraints/hydro_unit_group_bounds.parquet`). Para Itaipu (código 66) é a soma dos envelopes dos dois grupos por frequência."

  [[output.field]]
  path = "hydros[].unit_groups[].id"
  from = [
    { file = "dadger", register = "MP", item = "frequencia" },
    { file = "dadger", register = "FD", item = "frequencia" },
  ]
  status = "derived"
  how = "Um único grupo espelho com id 0 por usina. Itaipu (código 66) declara um grupo por frequência dos registros `MP`/`FD`, ids 0 e 1 em ordem crescente de frequência (0 = 50 Hz, conjunto 1 do cadastro; 1 = 60 Hz, conjunto 2); `MP` e `FD` precisam concordar no conjunto de frequências."

  [[output.field]]
  path = "hydros[].unit_groups[].name"
  from = [ { file = "hidr", item = "nome_usina" } ]
  how = "Nome da usina, copiado para cada grupo."

  [[output.field]]
  path = "hydros[].unit_groups[].bus_id"
  from = [
    { file = "hidr", item = "submercado" },
    { file = "dadger", register = "SB", item = "codigo_submercado" },
  ]
  status = "derived"
  how = "Id da barra do submercado da usina (`submercado` do `hidr.dat`, mapeado pela ordem crescente dos `SB`). O grupo de 60 Hz de Itaipu (id 1) é colocado na barra de transbordo `IV` criada pelo conversor (corredor para Ivaiporã); o de 50 Hz fica na barra do submercado da usina."

  [[output.field]]
  path = "hydros[].unit_groups[].min_generation_mw"
  from = []
  status = "constant"
  how = "Sempre 0.0, espelhando o envelope da usina."

  [[output.field]]
  path = "hydros[].unit_groups[].max_generation_mw"
  from = [
    { file = "hidr", item = "numero_conjuntos_maquinas" },
    { file = "hidr", item = "maquinas_conjunto_1..5" },
    { file = "hidr", item = "potencia_nominal_conjunto_1..5" },
    { file = "dadger", register = "AC", item = "NUMCON" },
    { file = "dadger", register = "AC", item = "NUMMAQ" },
    { file = "dadger", register = "AC", item = "POTEFE" },
  ]
  how = "Espelha `generation.max_generation_mw` da usina no grupo único. Para Itaipu, cada grupo recebe o envelope nominal (máximo ao longo dos estágios) do seu próprio conjunto; a soma dos dois é o envelope da usina por construção."

  [[output.field]]
  path = "hydros[].unit_groups[].min_turbined_m3s"
  from = []
  status = "constant"
  how = "Sempre 0.0, espelhando o envelope da usina."

  [[output.field]]
  path = "hydros[].unit_groups[].max_turbined_m3s"
  from = [
    { file = "hidr", item = "numero_conjuntos_maquinas" },
    { file = "hidr", item = "maquinas_conjunto_1..5" },
    { file = "hidr", item = "vazao_nominal_conjunto_1..5" },
    { file = "hidr", item = "potencia_nominal_conjunto_1..5" },
    { file = "hidr", item = "queda_nominal_conjunto_1..5" },
    { file = "hidr", item = "tipo_turbina" },
    { file = "hidr", item = "a0_volume_cota..a4_volume_cota" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "hidr", item = "canal_fuga_medio" },
    { file = "hidr", item = "perdas" },
    { file = "hidr", item = "tipo_perda" },
    { file = "dadger", register = "AC", item = "NUMCON" },
    { file = "dadger", register = "AC", item = "NUMMAQ" },
    { file = "dadger", register = "AC", item = "VAZEFE" },
    { file = "dadger", register = "AC", item = "POTEFE" },
    { file = "dadger", register = "AC", item = "COTVOL" },
    { file = "dadger", register = "AC", item = "VOLMIN" },
    { file = "dadger", register = "AC", item = "VOLMAX" },
    { file = "dadger", register = "AC", item = "PROESP" },
    { file = "dadger", register = "AC", item = "JUSMED" },
    { file = "dadger", register = "AC", item = "PERHID" },
  ]
  how = "Espelha `generation.max_turbined_m3s` da usina no grupo único. Para Itaipu, cada grupo recebe o engolimento corrigido pela queda do seu próprio conjunto, com o teto de potência aplicado por conjunto (não por usina), máximo ao longo dos estágios."

  [[output.field]]
  path = "hydros[].specific_productivity_mw_per_m3s_per_m"
  when = "somente para usinas com `generation.model` = `fpha`"
  from = [
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "dadger", register = "AC", item = "PROESP" },
  ]
  how = "Produtibilidade específica efetiva do estágio inicial (`AC PROESP` aplicado), em MW/(m³/s)/m, copiada sem conversão; o Novomodelo deriva ρ_eq dela na FPHA computada."

  [[output.field]]
  path = "hydros[].efficiency.type"
  when = "somente para usinas com `generation.model` = `fpha`"
  from = []
  status = "constant"
  how = "Sempre `constant`: o DECOMP não traz curva de rendimento por vazão ou queda."

  [[output.field]]
  path = "hydros[].efficiency.value"
  when = "somente para usinas com `generation.model` = `fpha`"
  from = [
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "dadger", register = "AC", item = "PROESP" },
  ]
  how = "Rendimento adimensional da turbina η = ρ_esp / 0,00981 (a produtibilidade específica já embute g/1000 × η); um valor acima de 1,0 é truncado para 1,0 com aviso."

  [[output.field]]
  path = "hydros[].tailrace.type"
  when = "somente para usinas FPHA cujo `canal_fuga_medio` efetivo é positivo"
  from = []
  status = "constant"
  how = "Sempre `polynomial`: o nível de jusante de reserva é um polinômio de grau zero."

  [[output.field]]
  path = "hydros[].tailrace.coefficients[]"
  when = "somente para usinas FPHA cujo `canal_fuga_medio` efetivo é positivo"
  from = [
    { file = "hidr", item = "canal_fuga_medio" },
    { file = "dadger", register = "AC", item = "JUSMED" },
  ]
  how = "Lista com um único coeficiente: o nível médio do canal de fuga efetivo (`AC JUSMED` aplicado) do estágio inicial, em metros. É o nível de jusante de reserva que o Novomodelo usa quando a usina não tem família em `system/tailrace_curves.parquet`."

  [[output.field]]
  path = "hydros[].hydraulic_losses.type"
  when = "somente para usinas com `generation.model` = `fpha`"
  from = [
    { file = "hidr", item = "tipo_perda" },
    { file = "hidr", item = "perdas" },
    { file = "dadger", register = "AC", item = "PERHID" },
  ]
  how = "`factor` quando `tipo_perda` = 1 e a perda efetiva (`AC PERHID` aplicado) é positiva; `constant` quando `tipo_perda` = 2 e a perda é positiva; nos demais casos `factor` com valor 0.0, porque o Novomodelo exige o bloco em toda usina FPHA."

  [[output.field]]
  path = "hydros[].hydraulic_losses.value"
  when = "somente para usinas FPHA com `hydraulic_losses.type` = `factor`"
  from = [
    { file = "hidr", item = "perdas" },
    { file = "hidr", item = "tipo_perda" },
    { file = "dadger", register = "AC", item = "PERHID" },
  ]
  how = "Fração da queda bruta perdida: `perdas`/100 quando `tipo_perda` = 1; 0.0 quando a usina não tem perda modelada."

  [[output.field]]
  path = "hydros[].hydraulic_losses.value_m"
  when = "somente para usinas FPHA com `tipo_perda` = 2 e perda positiva"
  from = [
    { file = "hidr", item = "perdas" },
    { file = "hidr", item = "tipo_perda" },
    { file = "dadger", register = "AC", item = "PERHID" },
  ]
  how = "Perda de carga constante em metros, igual ao `perdas` efetivo (`AC PERHID` aplicado)."

  [[output.field]]
  path = "hydros[].evaporation.coefficients_mm[]"
  when = "somente quando o `UH` da usina liga o flag `evaporacao` e o `hidr.dat` traz ao menos um coeficiente mensal não nulo"
  from = [
    { file = "dadger", register = "UH", item = "evaporacao" },
    { file = "hidr", item = "evaporacao_JAN..evaporacao_DEZ" },
  ]
  how = "Os 12 coeficientes mensais de evaporação (mm/mês) do `hidr.dat`, de janeiro (índice 0) a dezembro, sem conversão; o Novomodelo os combina com a área de `system/hydro_geometry.parquet` e rateia cada estágio pela sua fração de horas do mês. `AC COFEVA` não é consumido."

  [[output.field]]
  path = "hydros[].diversion.downstream_id"
  when = "somente quando a usina tem piso positivo em `min_diversion_m3s` (RHQ `QDES` de termo único) com canal resolúvel, ou um `desvio` de base sem limite explícito cuja usina receptora é operada"
  from = [
    { file = "hidr", item = "desvio" },
    { file = "dadger", register = "AC", item = "DESVIO" },
    { file = "dadger", register = "HQ", item = "codigo_restricao" },
    { file = "dadger", register = "LQ", item = "limite_inferior" },
    { file = "dadger", register = "CQ", item = "codigo_usina" },
    { file = "dadger", register = "CQ", item = "tipo" },
  ]
  how = "Id Novomodelo da usina que recebe a água desviada: o `codigo_usina_jusante` do primeiro `AC DESVIO` em vigor ou, na falta dele, o `desvio` do `hidr.dat`. Um piso de desvio sem canal resolúvel (limite ausente ou receptora não operada) gera aviso e o bloco fica nulo; uma usina com desvio mas sem piso nem canal de base fica com `diversion` nulo."

  [[output.field]]
  path = "hydros[].diversion.max_flow_m3s"
  when = "somente quando a usina tem piso positivo em `min_diversion_m3s` (RHQ `QDES` de termo único) com canal resolúvel, ou um `desvio` de base sem limite explícito cuja usina receptora é operada"
  from = [
    { file = "dadger", register = "AC", item = "DESVIO" },
    { file = "hidr", item = "desvio" },
  ]
  how = "`limite_vazao` do `AC DESVIO` em vigor. Para um `desvio` de base sem limite explícito, o canal é limitado pelo `generation.max_turbined_m3s` da usina receptora, para que a água desviada chegue a ela (caso MOXOTÓ → P.AFONSO 4); esse teto também vira `max_diversion_m3s` em `constraints/hydro_bounds.parquet`."

[[output]]
path = "system/hydro_production_models.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/decomp/converters/hydro/productivity.py"
reads = [
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
  { file = "dadger", register = "AC" },
  { file = "hidr" },
]
summary = "Uma entrada por usina operada com um único intervalo de estágios cobrindo todo o horizonte; as usinas elegíveis recebem a FPHA computada pelo Novomodelo ajustada em torno do volume inicial, as demais produtibilidade constante."

  [[output.field]]
  path = "production_models[].hydro_id"
  from = [ { file = "dadger", register = "UH", item = "codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo da usina, na mesma ordem de `system/hydros.json`."

  [[output.field]]
  path = "production_models[].selection_mode"
  from = []
  status = "constant"
  how = "Sempre `stage_ranges`: o modelo é escolhido por intervalo de estágios."

  [[output.field]]
  path = "production_models[].stage_ranges[].start_stage_id"
  from = []
  status = "constant"
  how = "Sempre 0: o intervalo único começa no primeiro estágio."

  [[output.field]]
  path = "production_models[].stage_ranges[].end_stage_id"
  from = []
  status = "constant"
  how = "Sempre nulo: o intervalo único é aberto e vale até o fim do horizonte."

  [[output.field]]
  path = "production_models[].stage_ranges[].model"
  from = [
    { file = "hidr", item = "a0_volume_cota..a4_volume_cota" },
    { file = "dadger", register = "AC", item = "COTVOL" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "dadger", register = "AC", item = "PROESP" },
  ]
  status = "derived"
  how = "`fpha` para as usinas com polinômio cota-volume efetivo não nulo e produtibilidade específica positiva no estágio inicial e engolimento e potência nominais efetivos positivos; `constant_productivity` para as demais. É o mesmo critério de `generation.model` em `system/hydros.json`."

  [[output.field]]
  path = "production_models[].stage_ranges[].fpha_config.source"
  when = "somente para usinas com modelo `fpha`"
  from = []
  status = "constant"
  how = "Sempre `computed`: o Novomodelo ajusta os hiperplanos da FPHA a partir de `system/hydro_geometry.parquet` e `system/tailrace_curves.parquet`; os registros `FP` do DECOMP não são lidos."

  [[output.field]]
  path = "production_models[].stage_ranges[].fpha_config.fitting_window.volume_min_hm3"
  when = "somente para usinas com modelo `fpha`"
  from = [
    { file = "dadger", register = "UH", item = "volume_inicial" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "dadger", register = "AC", item = "VOLMIN" },
    { file = "dadger", register = "AC", item = "VOLMAX" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_referencia" },
  ]
  how = "max(V_min, V_ini − 0,10 × (V_max − V_min)), com V_ini o volume inicial da usina em hm³ e [V_min, V_max] a faixa efetiva do estágio inicial. A meia-largura de 10 % do volume útil é um parâmetro de modelagem do novomodelo-bridge; fio d'água colapsa para o volume de referência."

  [[output.field]]
  path = "production_models[].stage_ranges[].fpha_config.fitting_window.volume_max_hm3"
  when = "somente para usinas com modelo `fpha`"
  from = [
    { file = "dadger", register = "UH", item = "volume_inicial" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "dadger", register = "AC", item = "VOLMIN" },
    { file = "dadger", register = "AC", item = "VOLMAX" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_referencia" },
  ]
  how = "min(V_max, V_ini + 0,10 × (V_max − V_min)), com V_ini o volume inicial da usina em hm³ e [V_min, V_max] a faixa efetiva do estágio inicial (mesma construção de `volume_min_hm3`)."

  [[output.field]]
  path = "production_models[].stage_ranges[].reference_volume.volume_hm3"
  when = "somente para usinas com modelo `fpha`"
  from = [
    { file = "dadger", register = "UH", item = "volume_inicial" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "dadger", register = "AC", item = "VOLMIN" },
    { file = "dadger", register = "AC", item = "VOLMAX" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_referencia" },
  ]
  how = "Volume inicial em hm³: V_min + `volume_inicial`/100 × (V_max − V_min) na faixa efetiva do estágio inicial; fio d'água colapsa para `volume_referencia`. É o mesmo valor de `storage` em `initial_conditions.json`, o ponto em que o DECOMP ancora a FPHA."

[[output]]
path = "system/hydro_geometry.parquet"
kind = "parquet"
when = ""
module = "src/novomodelo_bridge/decomp/converters/fpha.py"
reads = [
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
  { file = "dadger", register = "AC" },
  { file = "hidr" },
]
summary = "Curva volume → cota → área amostrada em 100 pontos por usina operada com polinômio cota-volume não nulo (também para as de produtibilidade constante, que servem de referência de remanso); usina a fio d'água contribui um único ponto."

  [[output.field]]
  path = "hydro_id"
  from = [ { file = "dadger", register = "UH", item = "codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo da usina; usinas com polinômio cota-volume identicamente nulo não têm linhas."

  [[output.field]]
  path = "volume_hm3"
  from = [
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "dadger", register = "AC", item = "VOLMIN" },
    { file = "dadger", register = "AC", item = "VOLMAX" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_referencia" },
  ]
  status = "derived"
  how = "Malha uniforme de 100 volumes sobre a faixa efetiva [`volume_minimo`, `volume_maximo`] do estágio inicial; faixa degenerada (fio d'água) produz um único ponto."

  [[output.field]]
  path = "height_m"
  from = [
    { file = "hidr", item = "a0_volume_cota..a4_volume_cota" },
    { file = "dadger", register = "AC", item = "COTVOL" },
  ]
  how = "Cota de montante do polinômio cota-volume efetivo (pós `AC COTVOL`, ordem 1..5 do registro mapeada em a0..a4) avaliado em cada volume da malha, truncada em 0."

  [[output.field]]
  path = "area_km2"
  from = [ { file = "hidr", item = "a0_cota_area..a4_cota_area" } ]
