# Linhagem de dados da conversão DECOMP → Novomodelo.
#
# Fonte única de docs/decomp-data-map.md (gerado por scripts/gen-lineage-docs.py;
# nunca edite a página). Um [[output]] por arquivo escrito, um [[output.field]] por
# campo ou coluna, e [[source]] para o que o deck traz e o conversor ainda não lê ou
# não converte. Chaves em inglês; prosa em pt-BR. Validado por tests/test_lineage.py.
track = "decomp"

# ===== frag_D_dc_root_network =====
# Fragment D — DECOMP: root files, network, thermals, NCS, scalar parameters,
# the three per-entity bound tables and the conditional GNL/contract outputs.

# ---------------------------------------------------------------------------
# config.json
# ---------------------------------------------------------------------------
[[output]]
path = "config.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/decomp/converters/config.py"
reads = [
  { file = "dadger", register = "GP" },
  { file = "dadger", register = "NI" },
]
summary = "Critérios de parada (`GP` como gap relativo e `NI` como limite de iterações) e fontes externas de cenários; todo o restante é fixo."

  [[output.field]]
  path = "simulation.enabled"
  from = []
  status = "constant"
  how = "Sempre `true`: a simulação final é executada sobre a árvore explícita."

  [[output.field]]
  path = "simulation.selection.method"
  from = []
  status = "constant"
  how = "Sempre `enumerated`: a simulação percorre cada caminho raiz-folha do grafo de nós com a probabilidade do próprio nó."

  [[output.field]]
  path = "training.scenario_source.inflow.scheme"
  from = []
  status = "constant"
  how = "Sempre `external`: as vazões vêm da árvore explícita em `scenarios/external_inflow_scenarios.parquet`."

  [[output.field]]
  path = "training.scenario_source.load.scheme"
  from = []
  status = "constant"
  how = "Sempre `external`: a carga determinística de `DP` é replicada em `scenarios/external_load_scenarios.parquet`."

  [[output.field]]
  path = "training.scenario_source.ncs.scheme"
  from = []
  status = "constant"
  how = "Sempre `external`: a geração não controlável determinística é replicada em `scenarios/external_ncs_scenarios.parquet`."

  [[output.field]]
  path = "training.scenario_source.seed"
  from = []
  status = "constant"
  how = "Sempre `0`. Com todas as classes externas e seleção enumerada nada é sorteado; o campo é exigido pelo esquema do Novomodelo e o valor é inerte."

  [[output.field]]
  path = "training.selection.method"
  from = []
  status = "constant"
  how = "Sempre `enumerated`: o treinamento percorre o tronco determinístico e o leque terminal por completo."

  [[output.field]]
  path = "training.stopping_rules[].type"
  from = []
  status = "constant"
  how = "Duas regras fixas, nesta ordem: `gap` (tolerância relativa) e `iteration_limit`."

  [[output.field]]
  path = "training.stopping_rules[].relative_tolerance"
  from = [ { file = "dadger", register = "GP", item = "gap" } ]
  how = "O critério de convergência `GP` do deck, usado como gap relativo (`Zsup/Zinf - 1 <= GP`). O Novomodelo acrescenta por conta própria uma regra de estagnação de limites."

  [[output.field]]
  path = "training.stopping_rules[].limit"
  from = [ { file = "dadger", register = "NI", item = "iteracoes" } ]
  how = "Número máximo de iterações de `NI`; `500` quando o campo está em branco."

# ---------------------------------------------------------------------------
# stages.json
# ---------------------------------------------------------------------------
[[output]]
path = "stages.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/decomp/temporal.py"
reads = [
  { file = "dadger", register = "DT" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "TX" },
  { file = "dadger", register = "AR" },
  { file = "dadger", register = "FC" },
  { file = "vazoes" },
  { file = "cortesh" },
]
summary = "Calendário operativo semanal a partir de `DT` e das durações de patamar de `DP`; grafo de nós com tronco determinístico e leque terminal ponderado pelas probabilidades do arquivo de vazões; medida de risco de `AR`."

  [[output.field]]
  path = "policy_graph.type"
  from = []
  status = "constant"
  how = "Sempre `finite_horizon`."

  [[output.field]]
  path = "policy_graph.annual_discount_rate"
  from = [ { file = "dadger", register = "TX", item = "taxa" } ]
  how = "Taxa de desconto anual de `TX`, em percentual no deck, dividida por 100."

  [[output.field]]
  path = "policy_graph.nodes[].id"
  from = [ { file = "dadger", register = "DP", item = "estagio" }, { file = "vazoes", item = "probabilidades · cenario" } ]
  status = "derived"
  how = "Id próprio do nó: os nós do tronco (estágios 0 a T-2) recebem `id` igual ao índice do estágio; os nós do leque terminal recebem `(T-1) + k`, com `k` o índice 0-based do cenário."

  [[output.field]]
  path = "policy_graph.nodes[].stage_id"
  from = [ { file = "dadger", register = "DP", item = "estagio" } ]
  status = "derived"
  how = "Índice 0-based do estágio a que o nó pertence; todos os nós do leque apontam para o último estágio."

  [[output.field]]
  path = "policy_graph.nodes[].scenario_id"
  from = [ { file = "vazoes", item = "probabilidades · cenario" } ]
  status = "derived"
  how = "Coluna da biblioteca externa de vazões que o nó lê: `0` em todo o tronco; `cenario - 1` em cada nó do leque terminal."

  [[output.field]]
  path = "policy_graph.nodes[].label"
  from = []
  status = "derived"
  how = "Rótulo `trunk-{estágio}` nos nós do tronco e `fan-{cenário}` nos nós do leque."

  [[output.field]]
  path = "policy_graph.transitions[].source_id"
  from = []
  status = "derived"
  how = "Nó de origem: cada nó do tronco liga-se ao seguinte; o último nó do tronco liga-se a todos os nós do leque."

  [[output.field]]
  path = "policy_graph.transitions[].target_id"
  from = []
  status = "derived"
  how = "Nó de destino da aresta, na ordem canônica dos sucessores."

  [[output.field]]
  path = "policy_graph.transitions[].probability"
  from = [ { file = "vazoes", item = "probabilidades · probabilidade (estagio terminal)" } ]
  how = "`1.0` nas arestas do tronco; nas arestas para o leque, a probabilidade de cada cenário do estágio terminal na tabela de probabilidades do arquivo de vazões (validadas como somando 1)."

  [[output.field]]
  path = "season_definitions.cycle_type"
  from = []
  status = "constant"
  how = "Sempre `monthly`."

  [[output.field]]
  path = "season_definitions.seasons[].id"
  from = []
  status = "constant"
  how = "Doze estações fixas, ids 0 a 11 (janeiro = 0)."

  [[output.field]]
  path = "season_definitions.seasons[].month_start"
  from = []
  status = "constant"
  how = "Mês de início de cada estação, 1 a 12."

  [[output.field]]
  path = "season_definitions.seasons[].label"
  from = []
  status = "constant"
  how = "Nome do mês em inglês (`January` … `December`), convenção compartilhada com a conversão NEWAVE."

  [[output.field]]
  path = "stages[].id"
  from = [ { file = "dadger", register = "DP", item = "estagio" } ]
  status = "derived"
  how = "`estagio - 1`; os estágios de `DP` devem ser contíguos a partir de 1."

  [[output.field]]
  path = "stages[].start_date"
  from = [ { file = "dadger", register = "DT", item = "dia, mes, ano" }, { file = "dadger", register = "DP", item = "duracao" } ]
  status = "derived"
  how = "Data de `DT` no primeiro estágio (obrigatoriamente um sábado); nos demais, a data final do estágio anterior. Cada estágio dura a soma das durações de patamar de `DP` convertida em dias inteiros."

  [[output.field]]
  path = "stages[].end_date"
  from = [ { file = "dadger", register = "DT", item = "dia, mes, ano" }, { file = "dadger", register = "DP", item = "duracao" } ]
  status = "derived"
  how = "Data de início mais a duração do estágio (exclusiva). Todo estágio exceto o último deve somar 168 h; o último deve terminar em fronteira de mês civil e cobrir o segundo mês operativo."

  [[output.field]]
  path = "stages[].season_id"
  from = [ { file = "dadger", register = "DT", item = "dia, mes, ano" } ]
  status = "derived"
  how = "Estações semanais recebem o mês da sexta-feira da primeira semana (data de `DT` + 6 dias) menos 1; o estágio mensal final recebe o mês do seu próprio início menos 1."

  [[output.field]]
  path = "stages[].blocks[].id"
  from = [ { file = "dadger", register = "DP", item = "numero_patamares" } ]
  status = "derived"
  how = "Índice 0-based do patamar dentro do estágio."

  [[output.field]]
  path = "stages[].blocks[].name"
  from = [ { file = "dadger", register = "DP", item = "numero_patamares" } ]
  status = "derived"
  how = "Nome canônico pelo número de patamares: `HEAVY`/`MEDIUM`/`LIGHT` para três, `HEAVY`/`LIGHT` para dois, `SINGLE` para um, `BLOCK_i` para outros valores."

  [[output.field]]
  path = "stages[].blocks[].hours"
  from = [ { file = "dadger", register = "DP", item = "duracao" } ]
  how = "Duração em horas de cada patamar (`duracao_k`). As durações devem coincidir entre todos os submercados do mesmo estágio; o deck define uma única grade temporal."

  [[output.field]]
  path = "stages[].risk_measure"
  from = [ { file = "dadger", register = "AR", item = "estagio, lamb, alfa" }, { file = "cortesh", item = "alfa_cvar, lambda_cvar" } ]
  how = "`expectation` quando não há registro `AR` ou quando λ/α não se resolvem a valores positivos; caso contrário um objeto `cvar` com `alpha`/`lambda`. λ/α em branco em `AR` são lidos do cabeçalho `cortesh.dat` (localizado pelo registro `FC NEWV21`); valores > 1 são tratados como percentuais. A medida é emitida uniformemente em todos os estágios, não apenas a partir do estágio de `AR`, porque colapsa em esperança no tronco determinístico."

  [[output.field]]
  path = "stages[].risk_measure.cvar.alpha"
  from = [ { file = "dadger", register = "AR", item = "alfa" }, { file = "cortesh", item = "alfa_cvar" } ]
  when = "somente quando o deck resolve um CVaR ativo via `AR` (ou `AR` com λ/α em branco e `cortesh.dat` com CVaR habilitado)"
  how = "Fração da cauda (α) do CVaR, mesma convenção do DECOMP; dividida por 100 quando declarada em percentual."

  [[output.field]]
  path = "stages[].risk_measure.cvar.lambda"
  from = [ { file = "dadger", register = "AR", item = "lamb" }, { file = "cortesh", item = "lambda_cvar" } ]
  when = "somente quando o deck resolve um CVaR ativo via `AR` (ou `AR` com λ/α em branco e `cortesh.dat` com CVaR habilitado)"
  how = "Peso de aversão a risco (λ) do CVaR; dividido por 100 quando declarado em percentual."

  [[output.field]]
  path = "stages[].state_variables.storage"
  from = []
  status = "constant"
  how = "Sempre `true`: o armazenamento é variável de estado em todos os estágios."

  [[output.field]]
  path = "stages[].state_variables.inflow_lags"
  from = []
  status = "constant"
  how = "Sempre `false`: o modelo de vazões é de ordem 0 e as defasagens só são precificadas pela FCF de fronteira, quando importada."

# ---------------------------------------------------------------------------
# penalties.json
# ---------------------------------------------------------------------------
[[output]]
path = "penalties.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/decomp/converters/config.py"
reads = [
  { file = "dadger", register = "CD" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "AC" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
  { file = "hidr" },
]
summary = "Custo de déficit de `CD` e micro-penalidades fixas do modelo de origem; o bloco hidráulico é escalado pela produtibilidade equivalente média (ρ_avg) e máxima (ρ_max) das usinas operadas, calculadas do cadastro `hidr.dat` ancorado no volume inicial de `UH`."

  [[output.field]]
  path = "bus.deficit_segments[].cost"
  from = [ { file = "dadger", register = "CD", item = "custo" } ]
  how = "O maior custo de déficit entre os submercados de `CD` (cada submercado deve ter um único custo, uniforme entre patamares e estágios). É o `MAX_CUSTO_DEFICIT` que ancora as penalidades hidráulicas abaixo."

  [[output.field]]
  path = "bus.deficit_segments[].depth_mw"
  from = []
  status = "null"
  how = "Sempre nulo: segmento único de profundidade total (`CD` deve declarar `limite_superior` = 100 %)."

  [[output.field]]
  path = "bus.excess_cost"
  from = []
  status = "constant"
  how = "Micro-penalidade fixa `0.000355` R$/MWh (excesso de energia, manual do modelo de origem)."

  [[output.field]]
  path = "hydro.spillage_cost"
  from = [ { file = "hidr", item = "produtibilidade_especifica" }, { file = "hidr", item = "a0_volume_cota … a4_volume_cota" }, { file = "hidr", item = "canal_fuga_medio" }, { file = "hidr", item = "perdas, tipo_perda" }, { file = "dadger", register = "UH", item = "volume_inicial" } ]
  status = "derived"
  how = "`0.000300 × ρ_avg`, com ρ_avg a média (zeros incluídos) da produtibilidade equivalente `ρ_esp · h_líquida` de cada usina operada, altura calculada com o polinômio cota-volume no volume inicial, descontados canal de fuga e perdas."

  [[output.field]]
  path = "hydro.turbined_cost"
  from = [ { file = "hidr", item = "produtibilidade_especifica" }, { file = "hidr", item = "a0_volume_cota … a4_volume_cota" }, { file = "hidr", item = "canal_fuga_medio" }, { file = "hidr", item = "perdas, tipo_perda" }, { file = "dadger", register = "UH", item = "volume_inicial" } ]
  status = "derived"
  how = "`0.000333 × ρ_avg` (micro-penalidade de turbinamento escalada pela produtibilidade média do sistema)."

  [[output.field]]
  path = "hydro.diversion_cost"
  from = [ { file = "hidr", item = "produtibilidade_especifica" }, { file = "hidr", item = "a0_volume_cota … a4_volume_cota" }, { file = "hidr", item = "canal_fuga_medio" }, { file = "hidr", item = "perdas, tipo_perda" }, { file = "dadger", register = "UH", item = "volume_inicial" } ]
  status = "derived"
  how = "`0.000300 × ρ_avg` (micro-penalidade de volume desviado)."

  [[output.field]]
  path = "hydro.storage_violation_below_cost"
  from = [ { file = "dadger", register = "CD", item = "custo" }, { file = "hidr", item = "produtibilidade_especifica" }, { file = "hidr", item = "a0_volume_cota … a4_volume_cota" }, { file = "hidr", item = "canal_fuga_medio" }, { file = "hidr", item = "perdas, tipo_perda" }, { file = "dadger", register = "UH", item = "volume_inicial" } ]
  status = "derived"
  how = "`10 × custo_déficit × ρ_max × (1e6/3600)`, em R$/hm³: patamar de evaporação convertido a energia equivalente, com ρ_max a maior produtibilidade equivalente entre as usinas operadas. Não há `PENALID` no DECOMP; o valor é sempre derivado."

  [[output.field]]
  path = "hydro.filling_target_violation_cost"
  from = [ { file = "dadger", register = "CD", item = "custo" }, { file = "hidr", item = "produtibilidade_especifica" }, { file = "hidr", item = "a0_volume_cota … a4_volume_cota" }, { file = "hidr", item = "canal_fuga_medio" }, { file = "hidr", item = "perdas, tipo_perda" }, { file = "dadger", register = "UH", item = "volume_inicial" } ]
  status = "derived"
  how = "`0.9 × custo_déficit × ρ_max × (1e6/3600)`, em R$/hm³."

  [[output.field]]
  path = "hydro.turbined_violation_below_cost"
  from = [ { file = "dadger", register = "CD", item = "custo" }, { file = "hidr", item = "produtibilidade_especifica" }, { file = "hidr", item = "a0_volume_cota … a4_volume_cota" }, { file = "hidr", item = "canal_fuga_medio" }, { file = "hidr", item = "perdas, tipo_perda" }, { file = "dadger", register = "UH", item = "volume_inicial" } ]
  status = "derived"
  how = "`10 × custo_déficit × ρ_avg` (folga de turbinamento mínimo, sem `PENALID` no DECOMP)."

  [[output.field]]
  path = "hydro.outflow_violation_below_cost"
  from = [ { file = "dadger", register = "CD", item = "custo" }, { file = "hidr", item = "produtibilidade_especifica" }, { file = "hidr", item = "a0_volume_cota … a4_volume_cota" }, { file = "hidr", item = "canal_fuga_medio" }, { file = "hidr", item = "perdas, tipo_perda" }, { file = "dadger", register = "UH", item = "volume_inicial" } ]
  status = "derived"
  how = "`10 × custo_déficit × ρ_avg` (folga de vazão defluente mínima)."

  [[output.field]]
  path = "hydro.outflow_violation_above_cost"
  from = [ { file = "dadger", register = "CD", item = "custo" }, { file = "hidr", item = "produtibilidade_especifica" }, { file = "hidr", item = "a0_volume_cota … a4_volume_cota" }, { file = "hidr", item = "canal_fuga_medio" }, { file = "hidr", item = "perdas, tipo_perda" }, { file = "dadger", register = "UH", item = "volume_inicial" } ]
  status = "derived"
  how = "`10 × custo_déficit × ρ_avg` (folga de vazão defluente máxima)."

  [[output.field]]
  path = "hydro.generation_violation_below_cost"
  from = [ { file = "dadger", register = "CD", item = "custo" } ]
  status = "derived"
  how = "`10 × custo_déficit`, em R$/MWh (folga de geração mínima; domínio de energia, sem fator de produtibilidade)."

  [[output.field]]
  path = "hydro.evaporation_violation_cost"
  from = [ { file = "dadger", register = "CD", item = "custo" }, { file = "hidr", item = "produtibilidade_especifica" }, { file = "hidr", item = "a0_volume_cota … a4_volume_cota" }, { file = "hidr", item = "canal_fuga_medio" }, { file = "hidr", item = "perdas, tipo_perda" }, { file = "dadger", register = "UH", item = "volume_inicial" } ]
  status = "derived"
  how = "`10 × custo_déficit × ρ_max` (folga de evaporação, patamar mais alto da ordem de mérito)."

  [[output.field]]
  path = "hydro.water_withdrawal_violation_cost"
  from = [ { file = "dadger", register = "CD", item = "custo" }, { file = "hidr", item = "produtibilidade_especifica" }, { file = "hidr", item = "a0_volume_cota … a4_volume_cota" }, { file = "hidr", item = "canal_fuga_medio" }, { file = "hidr", item = "perdas, tipo_perda" }, { file = "dadger", register = "UH", item = "volume_inicial" } ]
  status = "derived"
  how = "`10 × custo_déficit × ρ_max` (folga de retirada de água para irrigação `TI`)."

  [[output.field]]
  path = "hydro.inflow_nonnegativity_cost"
  from = [ { file = "dadger", register = "CD", item = "custo" }, { file = "hidr", item = "produtibilidade_especifica" }, { file = "hidr", item = "a0_volume_cota … a4_volume_cota" }, { file = "hidr", item = "canal_fuga_medio" }, { file = "hidr", item = "perdas, tipo_perda" }, { file = "dadger", register = "UH", item = "volume_inicial" } ]
  status = "derived"
  how = "`water_withdrawal_violation_cost + 1` R$/(m³/s): a folga de vazão natural negativa nunca pode ser mais barata que a folga de retirada de água."

  [[output.field]]
  path = "line.exchange_cost"
  from = []
  status = "constant"
  how = "Micro-penalidade fixa `0.000273` R$/MWh (intercâmbio)."

  [[output.field]]
  path = "non_controllable_source.curtailment_cost"
  from = []
  status = "constant"
  how = "Micro-penalidade fixa `0.000344` R$/MWh (corte de geração não controlável)."

# ---------------------------------------------------------------------------
# initial_conditions.json
# ---------------------------------------------------------------------------
[[output]]
path = "initial_conditions.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/decomp/converters/hydro/entity.py"
reads = [
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "AC" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
  { file = "hidr" },
  { file = "dadgnl", register = "TG" },
  { file = "dadgnl", register = "GL" },
  { file = "dadgnl", register = "GS" },
  { file = "dadgnl", register = "NL" },
]
summary = "Volume inicial de cada usina operada (`UH` com `volume_inicial`), em hm³; quando `dadgnl` declara despacho GNL comprometido, o arquivo também recebe as janelas `past_anticipated_commitments`. As observações recentes de vazão são acrescentadas apenas pelo importador da FCF de fronteira, fora desta conversão."

  [[output.field]]
  path = "storage[].hydro_id"
  from = [ { file = "dadger", register = "UH", item = "codigo_usina" } ]
  status = "derived"
  how = "Id 0-based denso das usinas operadas (linhas `UH` com `volume_inicial`), atribuído na ordem crescente de `codigo_usina`."

  [[output.field]]
  path = "storage[].value_hm3"
  from = [ { file = "dadger", register = "UH", item = "volume_inicial" }, { file = "hidr", item = "volume_minimo, volume_maximo" }, { file = "hidr", item = "tipo_regulacao, volume_referencia" }, { file = "dadger", register = "AC", item = "VOLMIN, VOLMAX" } ]
  how = "`volume_inicial` (% do volume útil) resolvido sobre a faixa efetiva do estágio inicial: `vmin + pct/100 · (vmax − vmin)`, com `vmin`/`vmax` do cadastro após os `AC VOLMIN`/`VOLMAX` vigentes no estágio 0, limitado à faixa. Usinas a fio d'água (`tipo_regulacao` = `D`) colapsam ao `volume_referencia` independentemente do percentual. Um `volume_morto_inicial` declarado é apenas avisado, não convertido."

  [[output.field]]
  path = "filling_storage"
  from = []
  status = "null"
  how = "Sempre lista vazia: o enchimento de volume morto não é convertido."

  [[output.field]]
  path = "past_anticipated_commitments[].thermal_id"
  from = [ { file = "dadgnl", register = "TG", item = "codigo_usina" } ]
  status = "derived"
  when = "somente quando `dadgnl` declara despacho GNL comprometido (algum `GL` com `geracao` não nula)"
  how = "Id da térmica GNL criada em `system/thermals.json` (ids densos após a última térmica de `CT`, em ordem crescente de `codigo_usina` de `TG`)."

  [[output.field]]
  path = "past_anticipated_commitments[].start_date"
  from = [ { file = "dadgnl", register = "GL", item = "data_inicio" }, { file = "dadger", register = "DT", item = "dia, mes, ano" } ]
  status = "derived"
  when = "somente quando `dadgnl` declara despacho GNL comprometido (algum `GL` com `geracao` não nula)"
  how = "Janelas de classe 2 (dentro do estudo): a data de início de cada estágio do estudo coberto pelo lead global (soma das semanas `GS` dos meses do estudo × 168 h). Janelas de classe 4 (já comandadas): a `data_inicio` de cada semana `GL` a partir do fim do horizonte, com um stub a 0 MW quando a primeira começa depois dele."

  [[output.field]]
  path = "past_anticipated_commitments[].end_date"
  from = [ { file = "dadgnl", register = "GL", item = "data_inicio" }, { file = "dadger", register = "DP", item = "duracao" } ]
  status = "derived"
  when = "somente quando `dadgnl` declara despacho GNL comprometido (algum `GL` com `geracao` não nula)"
  how = "Classe 2: a data final do estágio do estudo. Classe 4: a `data_inicio` da semana `GL` seguinte, ou uma semana operativa (168 h) após o início na última janela. Nenhuma janela pode cruzar o fim do horizonte."

  [[output.field]]
  path = "past_anticipated_commitments[].value_mw"
  from = [ { file = "dadgnl", register = "GL", item = "geracao" }, { file = "dadgnl", register = "GL", item = "duracao" }, { file = "dadgnl", register = "TG", item = "inflexibilidade, disponibilidade" } ]
  when = "somente quando `dadgnl` declara despacho GNL comprometido (algum `GL` com `geracao` não nula)"
  how = "MW comprometido: média de `geracao` ponderada pelas `duracao` de patamar de cada registro `GL`; nas janelas de classe 2, as semanas `GL` que caem no estágio são refundidas por horas sobre o estágio (0 onde não há nenhuma). O valor é limitado, com aviso, à faixa de `TG` do seu estágio (inflexibilidade e disponibilidade ponderadas pelas horas de patamar, herdando o último `TG` declarado); as janelas de classe 4 usam a do último estágio do estudo."

