[[output]]
path = "constraints/hydro_bounds.parquet"
kind = "parquet"
when = "somente quando ao menos uma contribuição de limite é produzida (RQ/UH, VE, TI, faixa de armazenamento por estágio, restrição RE/RHQ/RHV de termo único ou canal de desvio de base)"
module = "src/novomodelo_bridge/decomp/converters/bounds.py"
reads = [
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
  { file = "dadger", register = "AC" },
  { file = "dadger", register = "RQ" },
  { file = "dadger", register = "VE" },
  { file = "dadger", register = "TI" },
  { file = "dadger", register = "RE" },
  { file = "dadger", register = "LU" },
  { file = "dadger", register = "FU" },
  { file = "dadger", register = "FT" },
  { file = "dadger", register = "FI" },
  { file = "dadger", register = "HQ" },
  { file = "dadger", register = "LQ" },
  { file = "dadger", register = "CQ" },
  { file = "dadger", register = "HV" },
  { file = "dadger", register = "LV" },
  { file = "dadger", register = "CV" },
  { file = "hidr" },
]
summary = "Sobrescritas por (usina, estágio, patamar) dos limites declarados em `system/hydros.json`. Toda contribuição (defluência mínima RQ/UH, faixa de armazenamento por estágio, volume de espera VE, irrigação TI, restrições RE/RHQ/RHV de termo único e coeficiente ±1, canal de desvio de base) é interseccionada por eixo (máximo dos pisos, mínimo dos tetos) e cada célula vira uma única linha; um estágio com contribuição por patamar é materializado em uma linha por patamar, sem linha-base. `FT`/`FI` entram só para decidir se uma `RE` tem termo único."

  [[output.field]]
  path = "hydro_id"
  from = [ { file = "dadger", register = "UH", item = "codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo da usina; linhas ordenadas por usina, estágio e patamar."

  [[output.field]]
  path = "stage_id"
  from = [ { file = "dadger", register = "DP", item = "estagio" } ]
  status = "derived"
  how = "Índice 0-based do estágio no calendário operativo (`estagio` − 1); os registros com trio mês/semana/ano (`AC`) e os limites por `estagio` (`LU`/`LQ`/`LV`, `VE`, `TI`) são resolvidos para esse índice."

  [[output.field]]
  path = "block_id"
  from = [ { file = "dadger", register = "DP", item = "numero_patamares" } ]
  status = "derived"
  how = "Nulo na linha-base (vale para todos os patamares); 0..n−1 quando algum contribuinte do eixo naquele estágio é por patamar (`LU`/`LQ` por patamar): então todos os patamares do estágio são materializados. O piso `RQ`/`UH` de defluência é por estágio (linha-base). Os eixos de armazenamento e retirada de água são sempre de estágio."

  [[output.field]]
  path = "min_outflow_m3s"
  from = [
    { file = "dadger", register = "UH", item = "vazao_defluente_minima" },
    { file = "dadger", register = "UH", item = "codigo_ree" },
    { file = "dadger", register = "RQ", item = "codigo_ree" },
    { file = "dadger", register = "RQ", item = "vazao" },
    { file = "hidr", item = "vazao_minima_historica" },
    { file = "dadger", register = "AC", item = "VAZMIN" },
    { file = "dadger", register = "HQ", item = "codigo_restricao" },
    { file = "dadger", register = "LQ", item = "limite_inferior" },
    { file = "dadger", register = "CQ", item = "codigo_usina" },
    { file = "dadger", register = "CQ", item = "tipo" },
    { file = "dadger", register = "CQ", item = "coeficiente" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "codigo_usina_jusante" },
    { file = "dadger", register = "AC", item = "NUMJUS" },
  ]
  how = "Piso de defluência: a `vazao_defluente_minima` do `UH` (fixa em todos os estágios) ou, na sua ausência, o percentual por estágio do `RQ` da REE da usina (`vazao_1` → estágio 0, `vazao_2` → estágio 1, …, repetindo o último declarado além das colunas do registro) aplicado à `vazao_minima_historica` efetiva (`AC VAZMIN`), um piso por (usina, estágio); valores não positivos não geram linha. Um piso `QDEF` de RHQ de termo único (`LQ` limite inferior por patamar, herdado entre estágios) coexiste e o maior piso prevalece. O piso padrão `RQ`/`UH` é liberado para as usinas a fio d'água desde a cabeceira até (exclusive) o primeiro reservatório da cascata (`tipo_regulacao` M ou S; jusante efetiva `codigo_usina_jusante` com `AC NUMJUS`): essas usinas não recebem piso `RQ`/`UH`. Uma janela `QDEF` de RHQ é uma restrição declarada pelo usuário e não é liberada — continua valendo."

  [[output.field]]
  path = "max_outflow_m3s"
  from = [
    { file = "dadger", register = "HQ", item = "codigo_restricao" },
    { file = "dadger", register = "HQ", item = "estagio_inicial" },
    { file = "dadger", register = "HQ", item = "estagio_final" },
    { file = "dadger", register = "LQ", item = "limite_superior" },
    { file = "dadger", register = "CQ", item = "codigo_usina" },
    { file = "dadger", register = "CQ", item = "tipo" },
    { file = "dadger", register = "CQ", item = "coeficiente" },
  ]
  how = "Teto de defluência de uma RHQ de termo único sobre `QDEF` com coeficiente ±1: `limite_superior` do `LQ` por patamar, herdado entre estágios dentro de [`estagio_inicial`, `estagio_final`]; coeficiente −1 troca e inverte os lados. RHQ com vários termos ou coeficiente diferente de ±1 vira restrição genérica."

  [[output.field]]
  path = "min_turbined_m3s"
  from = [
    { file = "dadger", register = "HQ", item = "codigo_restricao" },
    { file = "dadger", register = "LQ", item = "limite_inferior" },
    { file = "dadger", register = "CQ", item = "codigo_usina" },
    { file = "dadger", register = "CQ", item = "tipo" },
    { file = "dadger", register = "CQ", item = "coeficiente" },
  ]
  how = "Piso de turbinamento de uma RHQ de termo único sobre `QTUR`: `limite_inferior` do `LQ` por patamar, herdado entre estágios."

  [[output.field]]
  path = "max_turbined_m3s"
  from = [
    { file = "dadger", register = "HQ", item = "codigo_restricao" },
    { file = "dadger", register = "LQ", item = "limite_superior" },
    { file = "dadger", register = "CQ", item = "codigo_usina" },
    { file = "dadger", register = "CQ", item = "tipo" },
    { file = "dadger", register = "CQ", item = "coeficiente" },
  ]
  how = "Teto de turbinamento de uma RHQ de termo único sobre `QTUR`: `limite_superior` do `LQ` por patamar, truncado ao `generation.max_turbined_m3s` declarado da usina (o Novomodelo rejeita um teto acima da capacidade); um truncamento material gera aviso."

  [[output.field]]
  path = "min_generation_mw"
  from = [
    { file = "dadger", register = "RE", item = "codigo_restricao" },
    { file = "dadger", register = "RE", item = "estagio_inicial" },
    { file = "dadger", register = "RE", item = "estagio_final" },
    { file = "dadger", register = "LU", item = "limite_inferior" },
    { file = "dadger", register = "FU", item = "codigo_usina" },
    { file = "dadger", register = "FU", item = "coeficiente" },
  ]
  how = "Piso de geração de uma RE de termo único com `FU` de coeficiente ±1 (sem termos `FT`/`FI`): `limite_inferior` do `LU` por patamar, herdado entre estágios dentro de [`estagio_inicial`, `estagio_final`]."

  [[output.field]]
  path = "max_generation_mw"
  from = [
    { file = "dadger", register = "RE", item = "codigo_restricao" },
    { file = "dadger", register = "RE", item = "estagio_inicial" },
    { file = "dadger", register = "RE", item = "estagio_final" },
    { file = "dadger", register = "LU", item = "limite_superior" },
    { file = "dadger", register = "FU", item = "codigo_usina" },
    { file = "dadger", register = "FU", item = "coeficiente" },
  ]
  how = "Teto de geração de uma RE de termo único com `FU` de coeficiente ±1: `limite_superior` do `LU` por patamar, truncado ao `generation.max_generation_mw` declarado da usina (caso BELO MONTE, RE de 11000 MW acima da capacidade); um truncamento material gera aviso."

  [[output.field]]
  path = "min_storage_hm3"
  from = [
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "dadger", register = "AC", item = "VOLMIN" },
    { file = "dadger", register = "AC", item = "VOLMAX" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_referencia" },
    { file = "dadger", register = "HV", item = "codigo_restricao" },
    { file = "dadger", register = "HV", item = "estagio_inicial" },
    { file = "dadger", register = "HV", item = "estagio_final" },
    { file = "dadger", register = "LV", item = "limite_inferior" },
    { file = "dadger", register = "CV", item = "codigo_usina" },
    { file = "dadger", register = "CV", item = "tipo" },
    { file = "dadger", register = "CV", item = "coeficiente" },
  ]
  how = "Piso de armazenamento por estágio, sem patamar: o `volume_minimo` efetivo do estágio quando a faixa efetiva difere do envelope declarado em `system/hydros.json` (um `AC VOLMIN`/`VOLMAX` temporal), e/ou o `limite_inferior` do `LV` de uma RHV de termo único sobre `VARM`, que é relativo ao volume útil e é somado ao piso efetivo do estágio para virar hm³ absoluto."

  [[output.field]]
  path = "max_storage_hm3"
  from = [
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "dadger", register = "AC", item = "VOLMIN" },
    { file = "dadger", register = "AC", item = "VOLMAX" },
    { file = "hidr", item = "tipo_regulacao" },
    { file = "hidr", item = "volume_referencia" },
    { file = "dadger", register = "VE", item = "codigo_usina" },
    { file = "dadger", register = "VE", item = "volume" },
    { file = "dadger", register = "HV", item = "codigo_restricao" },
    { file = "dadger", register = "LV", item = "limite_superior" },
    { file = "dadger", register = "CV", item = "codigo_usina" },
    { file = "dadger", register = "CV", item = "tipo" },
    { file = "dadger", register = "CV", item = "coeficiente" },
  ]
  how = "Teto de armazenamento por estágio: o `volume_maximo` efetivo do estágio quando difere do envelope; o volume de espera `VE` (percentual do volume útil por estágio, `volume_k` → estágio k−1) convertido em hm³ absoluto e emitido só quando fica abaixo do envelope; e o `limite_superior` do `LV` de uma RHV de termo único sobre `VARM`, somado ao piso efetivo do estágio. O menor teto prevalece."

  [[output.field]]
  path = "min_diversion_m3s"
  from = [
    { file = "dadger", register = "HQ", item = "codigo_restricao" },
    { file = "dadger", register = "LQ", item = "limite_inferior" },
    { file = "dadger", register = "CQ", item = "codigo_usina" },
    { file = "dadger", register = "CQ", item = "tipo" },
    { file = "dadger", register = "CQ", item = "coeficiente" },
    { file = "hidr", item = "desvio" },
    { file = "dadger", register = "AC", item = "DESVIO" },
  ]
  how = "Piso de vazão desviada de uma RHQ de termo único sobre `QDES`: `limite_inferior` do `LQ` por patamar. Um `desvio` de base sem limite RHQ recebe piso 0.0 em todos os estágios junto com o teto de canal. Um piso positivo obriga o bloco `diversion` em `system/hydros.json`."

  [[output.field]]
  path = "max_diversion_m3s"
  from = [
    { file = "dadger", register = "HQ", item = "codigo_restricao" },
    { file = "dadger", register = "LQ", item = "limite_superior" },
    { file = "dadger", register = "CQ", item = "codigo_usina" },
    { file = "dadger", register = "CQ", item = "tipo" },
    { file = "dadger", register = "CQ", item = "coeficiente" },
    { file = "hidr", item = "desvio" },
    { file = "dadger", register = "AC", item = "DESVIO" },
  ]
  how = "Teto de vazão desviada de uma RHQ de termo único sobre `QDES`: `limite_superior` do `LQ` por patamar. Para um `desvio` de base (`hidr.dat` ou `AC DESVIO`) sem limite RHQ, o teto é o `limite_vazao` do `AC DESVIO` ou, na falta dele, o `generation.max_turbined_m3s` da usina receptora, em todos os estágios, para que a água desviada não fique presa em [0, 0]."

  [[output.field]]
  path = "min_spillage_m3s"
  from = [
    { file = "dadger", register = "HQ", item = "codigo_restricao" },
    { file = "dadger", register = "LQ", item = "limite_inferior" },
    { file = "dadger", register = "CQ", item = "codigo_usina" },
    { file = "dadger", register = "CQ", item = "tipo" },
    { file = "dadger", register = "CQ", item = "coeficiente" },
  ]
  how = "Piso de vertimento de uma RHQ de termo único sobre `QVER`: `limite_inferior` do `LQ` por patamar, herdado entre estágios."

  [[output.field]]
  path = "max_spillage_m3s"
  from = [
    { file = "dadger", register = "HQ", item = "codigo_restricao" },
    { file = "dadger", register = "LQ", item = "limite_superior" },
    { file = "dadger", register = "CQ", item = "codigo_usina" },
    { file = "dadger", register = "CQ", item = "tipo" },
    { file = "dadger", register = "CQ", item = "coeficiente" },
  ]
  how = "Teto de vertimento de uma RHQ de termo único sobre `QVER`: `limite_superior` do `LQ` por patamar, herdado entre estágios."

  [[output.field]]
  path = "water_withdrawal_m3s"
  from = [
    { file = "dadger", register = "TI", item = "codigo_usina" },
    { file = "dadger", register = "TI", item = "taxa" },
  ]
  how = "Retirada consuntiva de irrigação (m³/s, positiva = água removida) do registro `TI`, `taxa_k` → estágio k−1, sempre de estágio (sem patamar); estágios além das colunas declaradas repetem a última taxa e uma taxa nula não gera valor. Resolvida em tabela própria e anexada à linha da célula, pois não é um eixo de faixa (só piso)."

[[output]]
path = "constraints/hydro_unit_group_bounds.parquet"
kind = "parquet"
when = "somente quando algum grupo tem, em algum estágio, disponibilidade (MP × FD) ou engolimento corrigido pela queda abaixo do envelope declarado, ou quando Itaipu é operada com pisos `RI`"
module = "src/novomodelo_bridge/decomp/group_bounds.py"
reads = [
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
  { file = "dadger", register = "AC" },
  { file = "dadger", register = "MP" },
  { file = "dadger", register = "FD" },
  { file = "dadger", register = "RI" },
  { file = "hidr" },
]
summary = "Sobrescritas por (usina, grupo, estágio, patamar) dos limites dos `unit_groups` de `system/hydros.json`, esparsas: só onde a disponibilidade por estágio (instalada × `MP` × `FD`) ou o engolimento corrigido pela queda do estágio fica abaixo do envelope do grupo, mais os pisos por frequência `RI` de Itaipu. Os valores são calculados em `converters/hydro/bounds.py`; este módulo só os dispõe em linhas."

  [[output.field]]
  path = "hydro_id"
  from = [ { file = "dadger", register = "UH", item = "codigo_usina" } ]
  status = "derived"
  how = "Id Novomodelo da usina."

  [[output.field]]
  path = "hydro_unit_group_id"
  from = [
    { file = "dadger", register = "MP", item = "frequencia" },
    { file = "dadger", register = "FD", item = "frequencia" },
  ]
  status = "derived"
  how = "Id do grupo dentro da usina: 0 para o grupo único; 0 (50 Hz) e 1 (60 Hz) para Itaipu, na ordem crescente das frequências de `MP`/`FD`. O Novomodelo casa a linha pelo id declarado, não pela posição."

  [[output.field]]
  path = "stage_id"
  from = [ { file = "dadger", register = "DP", item = "estagio" } ]
  status = "derived"
  how = "Índice 0-based do estágio no calendário operativo; as colunas `manutencao_k`/`fator_k` de `MP`/`FD` e o `estagio` do `RI` são resolvidos para esse índice."

  [[output.field]]
  path = "block_id"
  from = [ { file = "dadger", register = "DP", item = "numero_patamares" } ]
  status = "derived"
  how = "Nulo na linha-base; 0..n−1 só quando o piso `RI` de Itaipu difere entre patamares do estágio (a linha-base recebe então a média ponderada pelas horas). Disponibilidade e engolimento são valores de estágio."

  [[output.field]]
  path = "min_turbined_m3s"
  from = []
  status = "null"
  how = "Sempre nulo: nenhum registro do DECOMP declara turbinamento mínimo por grupo."

  [[output.field]]
  path = "max_turbined_m3s"
  from = [
    { file = "hidr", item = "numero_conjuntos_maquinas" },
    { file = "hidr", item = "maquinas_conjunto_1..5" },
    { file = "hidr", item = "vazao_nominal_conjunto_1..5" },
    { file = "hidr", item = "potencia_nominal_conjunto_1..5" },
    { file = "hidr", item = "queda_nominal_conjunto_1..5" },
    { file = "hidr", item = "tipo_turbina" },
    { file = "hidr", item = "a0_volume_cota..a4_volume_cota" },
    { file = "hidr", item = "volume_minimo" },
    { file = "hidr", item = "volume_maximo" },
    { file = "hidr", item = "produtibilidade_especifica" },
    { file = "hidr", item = "canal_fuga_medio" },
    { file = "hidr", item = "perdas" },
    { file = "hidr", item = "tipo_perda" },
    { file = "dadger", register = "AC", item = "NUMCON" },
    { file = "dadger", register = "AC", item = "NUMMAQ" },
    { file = "dadger", register = "AC", item = "VAZEFE" },
    { file = "dadger", register = "AC", item = "POTEFE" },
    { file = "dadger", register = "AC", item = "COTVOL" },
    { file = "dadger", register = "AC", item = "VOLMIN" },
    { file = "dadger", register = "AC", item = "VOLMAX" },
    { file = "dadger", register = "AC", item = "PROESP" },
    { file = "dadger", register = "AC", item = "JUSMED" },
    { file = "dadger", register = "AC", item = "PERHID" },
  ]
  how = "Engolimento corrigido pela queda do estágio (mesma fórmula de `generation.max_turbined_m3s` em `system/hydros.json`, avaliada no estágio em vez do máximo), emitido só quando fica abaixo do envelope do grupo além da tolerância numérica: um `AC` de máquinas ou de cadastro que reduz o engolimento no meio do horizonte aparece aqui. Para Itaipu, por conjunto."

  [[output.field]]
  path = "min_generation_mw"
  when = "somente para Itaipu (código 66) operada com registro `RI`"
  from = [
    { file = "dadger", register = "RI", item = "estagio" },
    { file = "dadger", register = "RI", item = "geracao_minima_50_hz" },
    { file = "dadger", register = "RI", item = "geracao_minima_60_hz" },
  ]
  how = "Piso de geração por frequência de Itaipu: `geracao_minima_50_hz` no grupo 0 e `geracao_minima_60_hz` no grupo 1, por patamar (colunas `_1`..`_5`), com estágios não declarados herdando o anterior (o `RI` precisa declarar o estágio 1). Os campos `geracao_maxima_*` do `RI` não são consumidos."

  [[output.field]]
  path = "max_generation_mw"
  from = [
    { file = "hidr", item = "numero_conjuntos_maquinas" },
    { file = "hidr", item = "maquinas_conjunto_1..5" },
    { file = "hidr", item = "potencia_nominal_conjunto_1..5" },
    { file = "dadger", register = "AC", item = "NUMCON" },
    { file = "dadger", register = "AC", item = "NUMMAQ" },
    { file = "dadger", register = "AC", item = "POTEFE" },
    { file = "dadger", register = "MP", item = "codigo_usina" },
    { file = "dadger", register = "MP", item = "manutencao" },
    { file = "dadger", register = "FD", item = "codigo_usina" },
    { file = "dadger", register = "FD", item = "fator" },
  ]
  how = "Potência disponível do estágio: instalada efetiva do estágio × `manutencao_k` (`MP`) × `fator_k` (`FD`), fator 1.0 quando a usina não tem o registro, emitida só quando fica abaixo do envelope do grupo. Para Itaipu o cálculo é por grupo, com a linha `MP`/`FD` da frequência correspondente (obrigatória). O teto hidráulico ρ_eq × engolimento não é duplicado aqui: age pelo `max_turbined_m3s`."

# ===== frag_F_dc_scenarios_constraints_fcf =====
# Fragment F — DECOMP: cenários, restrições genéricas e função de custo futuro de fronteira.

# ---------------------------------------------------------------------------
# scenarios/inflow_seasonal_stats.parquet
# ---------------------------------------------------------------------------
[[output]]
path = "scenarios/inflow_seasonal_stats.parquet"
kind = "parquet"
when = ""
module = "src/novomodelo_bridge/decomp/scenarios.py"
reads = [
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
]
summary = "Tabela identidade (média 0, desvio 1) por usina hidráulica e estágio: sob a convenção de vazões explícitas, o ruído padronizado é a própria vazão incremental de `external_inflow_scenarios.parquet`."

  [[output.field]]
  path = "hydro_id"
  from = [ { file = "dadger", register = "UH", item = "codigo_usina" } ]
  status = "derived"
  how = "Id 0-based denso das usinas operadas (registros `UH` com `volume_inicial` preenchido), em ordem crescente de `codigo_usina`."

  [[output.field]]
  path = "stage_id"
  from = [ { file = "dadger", register = "DP", item = "estagio" } ]
  status = "derived"
  how = "Índice 0-based do estágio do calendário operativo (`estagio` − 1); uma linha por usina e estágio."

  [[output.field]]
  path = "mean_m3s"
  from = []
  status = "constant"
  how = "Sempre 0.0: média nula da convenção identidade, para que a vazão externa entre sem deslocamento."

  [[output.field]]
  path = "std_m3s"
  from = []
  status = "constant"
  how = "Sempre 1.0: desvio unitário da convenção identidade, evitando a patologia de desvio zero no leque terminal."

# ---------------------------------------------------------------------------
# scenarios/external_inflow_scenarios.parquet
# ---------------------------------------------------------------------------
[[output]]
path = "scenarios/external_inflow_scenarios.parquet"
kind = "parquet"
when = ""
module = "src/novomodelo_bridge/decomp/scenarios.py"
reads = [
  { file = "vazoes" },
  { file = "hidr" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
  { file = "dadger", register = "AC" },
]
summary = "Árvore explícita de vazões incrementais por usina: o tronco determinístico (`previsoes`, uma coluna por estágio semanal) e o leque terminal (`cenarios_gerados`, uma coluna por cenário no último estágio)."

  [[output.field]]
  path = "stage_id"
  from = [
    { file = "vazoes", item = "previsoes · estagio" },
    { file = "vazoes", item = "cenarios_gerados · estagio" },
  ]
  status = "derived"
  how = "`estagio` − 1. As previsões devem cobrir exatamente os estágios semanais e os cenários gerados devem estar todos no estágio terminal; caso contrário a conversão falha."

  [[output.field]]
  path = "scenario_id"
  from = [ { file = "vazoes", item = "cenarios_gerados · cenario" } ]
  status = "derived"
  how = "0 em todo estágio do tronco; `cenario` − 1 no estágio terminal."

  [[output.field]]
  path = "hydro_id"
  from = [ { file = "dadger", register = "UH", item = "codigo_usina" } ]
  status = "derived"
  how = "Id 0-based denso das usinas operadas, em ordem crescente de `codigo_usina`."

  [[output.field]]
  path = "value_m3s"
  from = [
    { file = "vazoes", item = "previsoes · coluna do posto" },
    { file = "vazoes", item = "cenarios_gerados · coluna do posto" },
    { file = "hidr", item = "posto" },
    { file = "dadger", register = "AC", item = "NUMPOS · codigo_posto" },
  ]
  how = "Vazão incremental lida diretamente da coluna do posto da usina (`posto` do `hidr`, sobreposto por `AC NUMPOS` quando presente, avaliado no estágio inicial), sem subtração de montante: o arquivo de vazões do DECOMP já é incremental. Um `AC NUMPOS` que varia ao longo do horizonte gera aviso e usa o posto do estágio inicial."

