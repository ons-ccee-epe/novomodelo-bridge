  status = "unread"
  note = "Estágio da participação térmica; ignorado como em `FU`."

  [[source.item]]
  register = "FI"
  item = "estagio"
  status = "unread"
  note = "Estágio da participação de intercâmbio; ignorado como em `FU`."

  [[source.item]]
  register = "CQ"
  item = "estagio"
  status = "unread"
  note = "Estágio da participação de vazão; ignorado como em `FU`."

  [[source.item]]
  register = "CV"
  item = "estagio"
  status = "unread"
  note = "Estágio da participação de volume; ignorado como em `FU`."

