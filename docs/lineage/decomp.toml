  how = "Maior geração por patamar (`geracao_k`, em branco lido como 0) em todos os estágios, após preencher estágios não declarados com o último declarado (estágio 1 obrigatório). Parques: o valor modal entre cenários de cada (estágio, patamar), com aviso se os cenários divergirem. O perfil por estágio e patamar vai para as estatísticas e fatores de NCS."

  [[output.field]]
  path = "non_controllable_sources[].allow_curtailment"
  from = []
  status = "constant"
  how = "Sempre `false`: a geração é abatida da carga na origem, logo é must-run e fixada na disponibilidade."

# ---------------------------------------------------------------------------
# constraints/generic_parameters.json
# ---------------------------------------------------------------------------
[[output]]
path = "constraints/generic_parameters.json"
kind = "json"
when = "somente quando alguma restrição de energia armazenada `HE`/`CM` (RHE) sobrevive como restrição genérica e referencia ao menos um reservatório"
module = "src/novomodelo_bridge/decomp/converters/scalar_parameters.py"
reads = [
  { file = "dadger", register = "HE" },
  { file = "dadger", register = "CM" },
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "AC" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
  { file = "hidr" },
]
summary = "Declara, para cada usina operada, os parâmetros `@rho_eq_h{id}` e `@rho_acum_h{id}` usados em expressões de restrições genéricas; o `rho_acum` das usinas referenciadas por uma RHE recebe valores por estágio (produtibilidade acumulada integrada no volume, convenção de energia armazenada do DECOMP), os demais ficam calculados pelo Novomodelo."

  [[output.field]]
  path = "scalar_parameters[].id"
  from = []
  status = "derived"
  how = "Sequencial 0-based: para cada usina, em ordem crescente de id hidráulico, primeiro o `rho_eq` e depois o `rho_acum`."

  [[output.field]]
  path = "scalar_parameters[].name"
  from = [ { file = "dadger", register = "UH", item = "codigo_usina" } ]
  status = "derived"
  how = "`rho_eq_h{id}` ou `rho_acum_h{id}`, com o id 0-based da usina operada."

  [[output.field]]
  path = "scalar_parameters[].kind"
  from = [ { file = "dadger", register = "HE", item = "codigo_restricao" }, { file = "dadger", register = "CM", item = "codigo_ree" }, { file = "dadger", register = "UH", item = "codigo_ree" } ]
  status = "derived"
  how = "`computed` por padrão. `per_stage` no `rho_acum` de cada usina que participa da expressão de alguma RHE emitida: membros da REE (`codigo_ree` de `UH`) nomeada por `CM`, restritos a reservatórios (`tipo_regulacao` = `M` ou `S`) com volume útil positivo."

  [[output.field]]
  path = "scalar_parameters[].computed_spec.tag"
  from = []
  status = "constant"
  how = "`equivalent_productivity` nas entradas `rho_eq`; `accumulated_productivity` nas entradas `rho_acum` sem valores por estágio. Ausente nas entradas `per_stage`."

  [[output.field]]
  path = "scalar_parameters[].computed_spec.hydro_id"
  from = [ { file = "dadger", register = "UH", item = "codigo_usina" } ]
  status = "derived"
  how = "Id 0-based da usina a que o parâmetro calculado se refere."

  [[output.field]]
  path = "scalar_parameters[].values[][]"
  from = [ { file = "hidr", item = "a0_volume_cota … a4_volume_cota" }, { file = "hidr", item = "volume_minimo, volume_maximo, volume_referencia" }, { file = "hidr", item = "produtibilidade_especifica, canal_fuga_medio, tipo_regulacao" }, { file = "hidr", item = "codigo_usina_jusante" }, { file = "dadger", register = "AC", item = "COTVOL, JUSMED, VOLMIN, VOLMAX, NUMJUS" }, { file = "dadger", register = "DP", item = "duracao" } ]
  how = "Pares `[estágio, ρ_acum]` em MWmês/hm³. Por estágio, a produtibilidade de energia armazenada própria de cada usina operada (integral da altura em `[vmin, vmax]` para `tipo_regulacao` = `M` ou `S`; ponto em `volume_referencia` para `D`) é somada ao longo da cascata operada (`codigo_usina_jusante`, com `AC NUMJUS`), e o total é dividido por `3600 · H / 1e6`, com `H` as horas do estágio. Os `AC COTVOL`/`JUSMED`/`VOLMIN`/`VOLMAX` vigentes deslocam o valor do estágio. Emitido apenas para as usinas referenciadas por uma RHE."

