  [[output.field]]
  path = "lines[].operational_start_date"
  from = [ { file = "dadger", register = "DT", item = "dia, mes, ano" } ]
  status = "derived"
  how = "Data de início do estudo."

  [[output.field]]
  path = "lines[].source_bus_id"
  from = [ { file = "dadger", register = "IA", item = "nome_submercado_de" } ]
  how = "Barra resolvida pelo nome de origem (`IV` resolve para a barra de transbordo). Na linha `IV-SE` criada, a barra de transbordo."

  [[output.field]]
  path = "lines[].target_bus_id"
  from = [ { file = "dadger", register = "IA", item = "nome_submercado_para" }, { file = "hidr", item = "submercado (usina 66)" } ]
  how = "Barra resolvida pelo nome de destino. Na linha `IV-SE` criada, a barra do `submercado` de Itaipu no cadastro."

  [[output.field]]
  path = "lines[].capacity.direct_mw"
  from = [ { file = "dadger", register = "IA", item = "limite_de_para" }, { file = "dadger", register = "RI", item = "geracao_maxima_60_hz" } ]
  how = "Maior limite de→para entre os patamares do estágio 1 (`limite_de_para_k`); o sentinela 99999 passa como capacidade grande. Na linha `IV-SE` criada, o maior `geracao_maxima_60_hz` de `RI` em todos os estágios e patamares (99999 sem `RI`)."

  [[output.field]]
  path = "lines[].capacity.reverse_mw"
  from = [ { file = "dadger", register = "IA", item = "limite_para_de" }, { file = "dadger", register = "RI", item = "geracao_maxima_60_hz" } ]
  how = "Maior limite para→de entre os patamares do estágio 1 (`limite_para_de_k`). Na linha `IV-SE` criada, o mesmo valor do sentido direto."

# ---------------------------------------------------------------------------
# system/thermals.json
# ---------------------------------------------------------------------------
[[output]]
path = "system/thermals.json"
kind = "json"
when = ""
module = "src/novomodelo_bridge/decomp/converters/thermal.py"
reads = [
  { file = "dadger", register = "CT" },
  { file = "dadger", register = "SB" },
  { file = "dadger", register = "UH" },
  { file = "dadger", register = "DP" },
  { file = "dadger", register = "DT" },
  { file = "dadgnl", register = "TG" },
  { file = "dadgnl", register = "GL" },
  { file = "dadgnl", register = "GS" },
  { file = "dadgnl", register = "NL" },
]
summary = "Uma térmica por `codigo_usina` de `CT`, com os valores do estágio 1 ponderados pelas horas de patamar; as térmicas GNL de `dadgnl` (ausentes de `CT`) são acrescentadas ao final com ids seguintes, marcadas como despacho antecipado."

  [[output.field]]
  path = "thermals[].id"
  from = [ { file = "dadger", register = "CT", item = "codigo_usina" }, { file = "dadgnl", register = "TG", item = "codigo_usina" } ]
  status = "derived"
  how = "Id 0-based denso na ordem crescente de `codigo_usina` de `CT`; as térmicas GNL de `TG` continuam a numeração, também em ordem crescente de código."

  [[output.field]]
  path = "thermals[].name"
  from = [ { file = "dadger", register = "CT", item = "nome_usina" }, { file = "dadgnl", register = "TG", item = "nome" } ]
  how = "Nome da usina sem espaços laterais."

  [[output.field]]
  path = "thermals[].operational_start_date"
  from = [ { file = "dadger", register = "DT", item = "dia, mes, ano" } ]
  status = "derived"
  how = "Data de início do estudo."

  [[output.field]]
  path = "thermals[].bus_id"
  from = [ { file = "dadger", register = "CT", item = "codigo_submercado" }, { file = "dadgnl", register = "TG", item = "codigo_submercado" } ]
  how = "Barra do submercado declarado."

  [[output.field]]
  path = "thermals[].cost_per_mwh"
  from = [ { file = "dadger", register = "CT", item = "cvu" }, { file = "dadger", register = "DP", item = "duracao" }, { file = "dadgnl", register = "TG", item = "cvu" } ]
  how = "CVU do estágio 1 por patamar (`cvu_k`, em branco lido como 0), ponderado pelas horas de patamar de `DP`; estágios seguintes vão para `constraints/thermal_bounds.parquet`. GNL: o mesmo com o `TG` do estágio 1."

  [[output.field]]
  path = "thermals[].generation.min_mw"
  from = [ { file = "dadger", register = "CT", item = "inflexibilidade" }, { file = "dadger", register = "DP", item = "duracao" }, { file = "dadgnl", register = "TG", item = "inflexibilidade" } ]
  how = "Inflexibilidade do estágio 1 por patamar, ponderada pelas horas de patamar. GNL: a menor inflexibilidade de `TG` entre os estágios, cada um ponderado pelas suas horas de patamar (um estágio sem registro `TG` herda o último declarado, como em `CT`), para que todo compromisso dentro da capacidade do seu estágio seja aceito."

  [[output.field]]
  path = "thermals[].generation.max_mw"
  from = [ { file = "dadger", register = "CT", item = "disponibilidade" }, { file = "dadger", register = "DP", item = "duracao" }, { file = "dadgnl", register = "TG", item = "disponibilidade" } ]
  how = "Disponibilidade do estágio 1 por patamar, ponderada pelas horas de patamar. GNL: a maior disponibilidade de `TG` entre os estágios, com a mesma ponderação e herança da inflexibilidade."

  [[output.field]]
  path = "thermals[].anticipated_config.lead_time_hours"
  from = [ { file = "dadgnl", register = "GL", item = "data_inicio" }, { file = "dadgnl", register = "GS", item = "mes, semanas" }, { file = "dadger", register = "DT", item = "dia, mes, ano" } ]
  status = "derived"
  when = "somente nas térmicas GNL, quando `dadgnl` declara despacho comprometido (algum `GL` com `geracao` não nula)"
  how = "Lead físico por usina, em horas: da data de início do estudo até o fim da última semana já comandada da usina em `GL` (o corte de classe 4). Sem calendário `GS`, a duração do primeiro estágio."

  [[output.field]]
  path = "thermals[].entry_stage_id"
  from = []
  status = "null"
  when = "somente nas térmicas GNL, quando `dadgnl` declara despacho comprometido"
  how = "Sempre nulo: térmicas GNL estão ativas em todo o horizonte. Térmicas de `CT` omitem o campo."

  [[output.field]]
  path = "thermals[].exit_stage_id"
  from = []
  status = "null"
  when = "somente nas térmicas GNL, quando `dadgnl` declara despacho comprometido"
  how = "Sempre nulo: térmicas GNL não saem dentro do horizonte. Térmicas de `CT` omitem o campo."

