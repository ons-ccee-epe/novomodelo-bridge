target-version = "py312"
line-length = 88

[lint]
# PGH bans blanket suppressions: every `# noqa` and `# type: ignore` must name
# its code (pair each with a rationale — .claude/rules/comments.md D3).
# RUF100 drops a `# noqa` that suppresses nothing.
# PLW1514 (text-mode open / read_text / write_text without `encoding`) is
# preview-only; `explicit-preview-rules` turns on that rule and no other
# preview rule.
select = ["E", "F", "I", "UP", "PGH", "RUF100", "PLW1514"]
preview = true
explicit-preview-rules = true

[lint.pycodestyle]
# The rename lengthens identifiers and strings; the formatter keeps 88.
max-line-length = 110

[lint.per-file-ignores]
"**/dashboard/tabs/*.py" = ["E501"]
"**/ui/html/css.py" = ["E501"]
"**/ui/html/js.py" = ["E501"]
"**/ui/html/document.py" = ["E501"]
"tests/**/test_*.py" = ["E501"]
