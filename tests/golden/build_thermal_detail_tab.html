<div style="margin-bottom:32px"><div class="gap-scroll"><table class="cost-breakdown-table gap-table" data-prefix="thermal"><caption>Thermal plants: gap over stages, Σ|Novomodelo − NEWAVE| / Σ|NEWAVE|, Σ|NEWAVE| no smaller than the mean plant's <span class="cb-caption-note">— close up to 5%, far beyond 20%; click a plant to open its charts</span></caption><thead><tr><th class="cb-cat" onclick="gapTableSort(this)">Plant</th><th class="cb-num" onclick="gapTableSort(this)">Generation (MW)</th></tr></thead><tbody class="gap-total"><tr class="cb-total"><td class="cb-cat">All plants</td><td class="cb-num gap-moderate" data-gap="0.0925926" title="moderate">9.3%</td></tr></tbody><tbody><tr class="gap-row" data-plant="15_T1" tabindex="0" onclick="gapTableOpen(this)" onkeydown="if (event.key === 'Enter') gapTableOpen(this)"><td class="cb-cat">T1</td><td class="cb-num gap-moderate" data-gap="0.0980392" title="moderate">9.8%</td></tr><tr class="gap-row" data-plant="16_T2" tabindex="0" onclick="gapTableOpen(this)" onkeydown="if (event.key === 'Enter') gapTableOpen(this)"><td class="cb-cat">T2</td><td class="cb-num gap-moderate" data-gap="0.0617284" title="moderate">6.2%</td></tr></tbody></table></div><script>
function gapTableSort(th) {
    var table = th.closest('table');
    var body = table.tBodies[table.tBodies.length - 1];
    var column = th.cellIndex;
    var descending = column > 0 && th.dataset.sort !== 'desc';
    if (column === 0) { descending = th.dataset.sort === 'asc'; }
    Array.prototype.forEach.call(th.parentNode.cells, function (cell) {
        delete cell.dataset.sort;
    });
    th.dataset.sort = descending ? 'desc' : 'asc';
    var rows = Array.prototype.slice.call(body.rows);
    rows.sort(function (a, b) {
        var x = a.cells[column], y = b.cells[column];
        var order = column === 0
            ? x.textContent.localeCompare(y.textContent)
            : parseFloat(x.dataset.gap) - parseFloat(y.dataset.gap);
        return descending ? -order : order;
    });
    rows.forEach(function (row) { body.appendChild(row); });
}
function gapTableOpen(row) {
    var select = document.getElementById(row.closest('table').dataset.prefix + '-select');
    if (!select) { return; }
    select.value = row.dataset.plant;
    select.dispatchEvent(new Event('change'));
    select.scrollIntoView({behavior: 'smooth', block: 'start'});
}
</script></div>
    <div class="plant-selector">
        <label for="thermal-select">Thermal Plant:</label>
        <select id="thermal-select"
                onchange="updateThermalCharts()">
            <option value="15_T1">T1 (15)</option><option value="16_T2">T2 (16)</option>
        </select>
        <div class="plant-info" id="thermal-info"></div>
    </div>
    <div class="chart-grid-single"><div class="chart-card"><div id="thermal-chart-generation-mw" style="width:100%;height:350px;"></div></div></div>
    <script>
    var thermalData = {"15_T1":{"name":"T1","code":15,"novomodelo_id":5,"generation_mw_stages":[1,2],"generation_mw_nw":[50.0,52.0],"generation_mw_cb":[45.0,47.0],"generation_mw_p10":[40.0,42.0],"generation_mw_p90":[50.0,52.0]},"16_T2":{"name":"T2","code":16,"novomodelo_id":6,"generation_mw_stages":[1],"generation_mw_nw":[60.0],"generation_mw_cb":[55.0],"generation_mw_p10":[50.0],"generation_mw_p90":[60.0]}};
    function updateThermalCharts() {
        var sel = document.getElementById('thermal-select');
        var pid = sel.value;
        var d = thermalData[pid];
        if (!d) return;
        document.getElementById('thermal-info').innerHTML =
            '<span>Code: ' + d.code + '</span>';
        
        (function() {
            var s = d['generation_mw_stages'] || [];
            var nw = d['generation_mw_nw'] || [];
            var cb = d['generation_mw_cb'] || [];
            var p10 = d['generation_mw_p10'] || null;
            var p90 = d['generation_mw_p90'] || null;
            var traces = [];
            if (p10 && p90 && p10.length > 0) {
                traces.push({
                    x: s.concat(s.slice().reverse()),
                    y: p90.concat(p10.slice().reverse()),
                    fill: 'toself',
                    fillcolor: 'rgba(74,144,184,0.15)',
                    line: {color: 'rgba(255,255,255,0)'},
                    name: 'Novomodelo P10–P90',
                    type: 'scatter',
                    legendgroup: 'band',
                    showlegend: true,
                    // Skip hover on the wrap-around polygon — its y values
                    // are the reversed-p10 closing edge and have no
                    // meaning at the cursor x.  Real values come from
                    // the visible p10 / p90 line traces below.
                    hoverinfo: 'skip'
                });
                traces.push({
                    x: s, y: p10,
                    name: 'Novomodelo P10', type: 'scatter', mode: 'lines',
                    line: {color: '#4A90B8', width: 1, dash: 'dot'},
                    legendgroup: 'band', showlegend: false
                });
                traces.push({
                    x: s, y: p90,
                    name: 'Novomodelo P90', type: 'scatter', mode: 'lines',
                    line: {color: '#4A90B8', width: 1, dash: 'dot'},
                    legendgroup: 'band', showlegend: false
                });
            }
            if (nw && nw.length > 0) {
                traces.push({x: s, y: nw, name: 'NEWAVE', type: 'scatter',
                    mode: 'lines', line: {color: '#F5A623', width: 2}});
            }
            traces.push({x: s, y: cb, name: 'Novomodelo Mean', type: 'scatter',
                mode: 'lines', line: {color: '#4A90B8', width: 2}});
            var maxCb = d['generation_mw_max_cb'];
            if (maxCb && maxCb.length > 0) {
                traces.push({x: s, y: maxCb, name: 'Novomodelo LP gen_max',
                    type: 'scatter', mode: 'lines',
                    line: {color: '#4A90B8', width: 1.5, dash: 'dash'}});
            }
            // Bound overlays (static from hydros.json, with per-stage
            // overrides from hydro_bounds.parquet shadowing where present).
            // Rendered in a muted grey so they sit behind the comparison
            // traces without competing for attention.  ``connectgaps:false``
            // ensures stages where the bound is structurally undefined
            // produce a gap in the dashed line.
            var bMin = d['generation_mw_bound_min'];
            if (bMin && bMin.length > 0) {
                traces.push({x: s, y: bMin, name: 'Lower bound',
                    type: 'scatter', mode: 'lines', connectgaps: false,
                    line: {color: '#888', width: 1.2, dash: 'dash'}});
            }
            var bMax = d['generation_mw_bound_max'];
            if (bMax && bMax.length > 0) {
                traces.push({x: s, y: bMax, name: 'Upper bound',
                    type: 'scatter', mode: 'lines', connectgaps: false,
                    line: {color: '#888', width: 1.2, dash: 'dash'}});
            }
            Plotly.react('thermal-chart-generation-mw', traces, {
                title: d.name + ' — Generation (MW)',
                xaxis: {title: 'Stage', automargin: true},
                yaxis: {title: 'Generation (MW)'},
                legend: {"orientation":"h","yref":"container","y":0,"yanchor":"bottom","xanchor":"center","x":0.5,"font":{"size":11}},
                margin: {"l":60,"r":30,"t":60,"b":50},
                template: 'plotly_white',
                hovermode: 'x unified',
                height: 350
            }, {responsive: true});
        })();
    }
    document.addEventListener('DOMContentLoaded', function() {
        var sel = document.getElementById('thermal-select');
        if (sel && sel.options.length > 0) {
            updateThermalCharts();
        }
    });
    </script>
