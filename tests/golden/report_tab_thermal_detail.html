<div style="margin-bottom:32px"><table class="cost-breakdown-table"><caption>Thermal per-plant max relative difference (|Novomodelo − NEWAVE| / |NEWAVE|, over stages)</caption><thead><tr><th class="cb-cat">Plant</th><th class="cb-num">Generation (MW)</th></tr></thead><tbody><tr><td class="cb-cat">GAS_A</td><td class="cb-num cb-diff-neg">0.70%</td></tr><tr><td class="cb-cat">Median</td><td class="cb-num cb-diff-neg">0.70%</td></tr></tbody></table></div>
    <div class="plant-selector">
        <label for="thermal-select">Thermal Plant:</label>
        <select id="thermal-select"
                onchange="updateThermalCharts()">
            <option value="10_GAS_A">GAS_A (10)</option>
        </select>
        <div class="plant-info" id="thermal-info"></div>
    </div>
    <div class="chart-grid-single"><div class="chart-card"><div id="thermal-chart-generation-mw" style="width:100%;height:350px;"></div></div></div>
    <script>
    var thermalData = {"10_GAS_A":{"name":"GAS_A","code":10,"novomodelo_id":0,"generation_mw_stages":[0],"generation_mw_nw":[300.0],"generation_mw_cb":[298.0],"generation_mw_p10":[250.0],"generation_mw_p90":[350.0]}};
    function updateThermalCharts() {
        var sel = document.getElementById('thermal-select');
        var pid = sel.value;
        var d = thermalData[pid];
        if (!d) return;
        document.getElementById('thermal-info').innerHTML =
            '<span>Code: ' + d.code + '</span>';
        
        (function() {
            var s = d['generation_mw_stages'] || [];
            var nw = d['generation_mw_nw'] || [];
            var cb = d['generation_mw_cb'] || [];
            var p10 = d['generation_mw_p10'] || null;
            var p90 = d['generation_mw_p90'] || null;
            var traces = [];
            if (p10 && p90 && p10.length > 0) {
                traces.push({
                    x: s.concat(s.slice().reverse()),
                    y: p90.concat(p10.slice().reverse()),
                    fill: 'toself',
                    fillcolor: 'rgba(74,144,184,0.15)',
                    line: {color: 'rgba(255,255,255,0)'},
                    name: 'Novomodelo P10–P90',
                    type: 'scatter',
                    legendgroup: 'band',
                    showlegend: true,
                    // Skip hover on the wrap-around polygon — its y values
                    // are the reversed-p10 closing edge and have no
                    // meaning at the cursor x.  Real values come from
                    // the visible p10 / p90 line traces below.
                    hoverinfo: 'skip'
                });
                traces.push({
                    x: s, y: p10,
                    name: 'Novomodelo P10', type: 'scatter', mode: 'lines',
                    line: {color: '#4A90B8', width: 1, dash: 'dot'},
                    legendgroup: 'band', showlegend: false
                });
                traces.push({
                    x: s, y: p90,
                    name: 'Novomodelo P90', type: 'scatter', mode: 'lines',
                    line: {color: '#4A90B8', width: 1, dash: 'dot'},
                    legendgroup: 'band', showlegend: false
                });
            }
            if (nw && nw.length > 0) {
                traces.push({x: s, y: nw, name: 'NEWAVE', type: 'scatter',
                    mode: 'lines', line: {color: '#F5A623', width: 2}});
            }
            traces.push({x: s, y: cb, name: 'Novomodelo Mean', type: 'scatter',
                mode: 'lines', line: {color: '#4A90B8', width: 2}});
            var maxCb = d['generation_mw_max_cb'];
            if (maxCb && maxCb.length > 0) {
                traces.push({x: s, y: maxCb, name: 'Novomodelo LP gen_max',
                    type: 'scatter', mode: 'lines',
                    line: {color: '#4A90B8', width: 1.5, dash: 'dash'}});
            }
            // Bound overlays (static from hydros.json, with per-stage
            // overrides from hydro_bounds.parquet shadowing where present).
            // Rendered in a muted grey so they sit behind the comparison
            // traces without competing for attention.  ``connectgaps:false``
            // ensures stages where the bound is structurally undefined
            // produce a gap in the dashed line.
            var bMin = d['generation_mw_bound_min'];
            if (bMin && bMin.length > 0) {
                traces.push({x: s, y: bMin, name: 'Lower bound',
                    type: 'scatter', mode: 'lines', connectgaps: false,
                    line: {color: '#888', width: 1.2, dash: 'dash'}});
            }
            var bMax = d['generation_mw_bound_max'];
            if (bMax && bMax.length > 0) {
                traces.push({x: s, y: bMax, name: 'Upper bound',
                    type: 'scatter', mode: 'lines', connectgaps: false,
                    line: {color: '#888', width: 1.2, dash: 'dash'}});
            }
            Plotly.react('thermal-chart-generation-mw', traces, {
                title: d.name + ' — Generation (MW)',
                xaxis: {title: 'Stage'},
                yaxis: {title: 'Generation (MW)'},
                legend: {"orientation":"h","yanchor":"bottom","y":1.02,"xanchor":"center","x":0.5,"font":{"size":11}},
                margin: {"l":60,"r":30,"t":60,"b":50},
                template: 'plotly_white',
                hovermode: 'x unified',
                height: 350
            }, {responsive: true});
        })();
    }
    document.addEventListener('DOMContentLoaded', function() {
        var sel = document.getElementById('thermal-select');
        if (sel && sel.options.length > 0) {
            updateThermalCharts();
        }
    });
    </script>
