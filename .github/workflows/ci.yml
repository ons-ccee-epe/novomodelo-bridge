name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The ruff uv.lock pins, which the pre-commit hook runs from .venv;
      # tests/test_packaging.py fails if the two differ.
      - run: pip install "ruff==0.16.9"
      - run: ruff check .
      - run: ruff format --check .
      # Drift/rot gates — conventions in .claude/rules/, docs in scripts/README.md
      - run: python3 scripts/ci/check_no_plan_leaks.py
      - run: python3 scripts/ci/check_comment_refs.py
      - run: python3 scripts/ci/check_doc_paths.py

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A cold cache builds novomodelo-python (Rust) from the pinned core commit.
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # novomodelo-python comes from the private core repository through the
      # git source in pyproject.toml, which only uv reads.
      - name: Let git read the core repository
        run: git config --global url."https://x-access-token:${{ secrets.NOVOMODELO_CORE_TOKEN }}@github.com/ons-ccee-epe/novomodelo".insteadOf "https://github.com/ons-ccee-epe/novomodelo"
      # novomodelo-python is a core runtime dependency, so the sync pulls it on
      # every Python in the matrix — the tier-2 (`requires_novomodelo_python`)
      # boundary-FCF tests run on all jobs, not just the primary one.
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest --tb=short

  coverage:
    name: coverage (reader/align layer floor)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Let git read the core repository
        run: git config --global url."https://x-access-token:${{ secrets.NOVOMODELO_CORE_TOKEN }}@github.com/ons-ccee-epe/novomodelo".insteadOf "https://github.com/ons-ccee-epe/novomodelo"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest --cov --cov-report=term-missing
