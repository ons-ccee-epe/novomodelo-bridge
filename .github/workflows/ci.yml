name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The ruff uv.lock pins, which the pre-commit hook runs from .venv;
      # tests/test_packaging.py fails if the two differ.
      - run: pip install "ruff==0.16.9"
      - run: ruff check .
      - run: ruff format --check .
      # Drift/rot gates — conventions in .claude/rules/, docs in scripts/README.md
      - run: python3 scripts/ci/check_no_plan_leaks.py
      - run: python3 scripts/ci/check_comment_refs.py
      - run: python3 scripts/ci/check_doc_paths.py

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # novomodelo-python is a core runtime dependency, so `.[dev]` pulls it on
      # every Python in the matrix — the tier-2 (`requires_novomodelo_python`)
      # boundary-FCF tests now run on all jobs, not just the primary one.
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short

  coverage:
    name: coverage (reader/align layer floor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing
