name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff + type check + quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      # --locked fails when uv.lock does not match pyproject.toml, so every
      # tool below (ruff, ty) is the version the lock pins.
      - name: Sync dependencies
        run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .

      # Drift/rot gates: conventions in .claude/rules/, docs in scripts/README.md
      - run: python3 scripts/ci/check_no_plan_leaks.py
      - run: python3 scripts/ci/check_comment_refs.py
      - run: python3 scripts/ci/check_doc_paths.py

      - name: Type check (ty)
        run: uv run ty check

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      # novomodelo-python is a core runtime dependency, so the sync pulls it on
      # every job: the tier-2 (`requires_novomodelo_python`) tests run on all of them.
      - name: Sync dependencies
        run: uv sync --locked

      - run: uv run pytest --tb=short

  coverage:
    name: coverage (reader/align layer floor)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --locked

      - run: uv run pytest --cov --cov-report=term-missing
