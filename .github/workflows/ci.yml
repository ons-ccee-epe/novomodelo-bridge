name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The ruff uv.lock pins, which the pre-commit hook runs from .venv;
      # tests/test_packaging.py fails if the two differ.
      - run: pip install "ruff==0.17.2"
      - run: ruff check .
      - run: ruff format --check .
      # Drift/rot gates — conventions in .claude/rules/, docs in scripts/README.md
      - run: python3 scripts/ci/check_no_plan_leaks.py
      - run: python3 scripts/ci/check_comment_refs.py
      - run: python3 scripts/ci/check_doc_paths.py

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # CI installs the bridge without novomodelo-python, a private git
      # dependency until a release, so `requires_novomodelo_python` skips the
      # tests that need it; they run locally with the pinned revision.
      - run: pip install --no-deps -e .
      - run: python3 scripts/ci/novomodelo_free_requirements.py > "$RUNNER_TEMP/requirements-ci.txt"
      - run: pip install -r "$RUNNER_TEMP/requirements-ci.txt"
      - run: pytest --tb=short

  coverage:
    name: coverage (reader/align layer floor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Same novomodelo-free install as the `test` job.
      - run: pip install --no-deps -e .
      - run: python3 scripts/ci/novomodelo_free_requirements.py > "$RUNNER_TEMP/requirements-ci.txt"
      - run: pip install -r "$RUNNER_TEMP/requirements-ci.txt"
      - run: pytest --cov --cov-report=term-missing
